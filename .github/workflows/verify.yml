# La compuerta del proyecto.
#
# Corre **despues** de que el cambio ya entro a `main`: no hay rama corta, no hay
# pull request y no hay segundo revisor. Es la forma de trabajo afirmada por el
# equipo, elegida con los ojos abiertos. La consecuencia es que el tronco puede
# ponerse rojo, y entonces arreglarlo pasa por delante de cualquier otra tarea.
#
# El flujo **invoca** `scripts/verify.sh`; no mantiene su propia lista de pasos.
# Una unidad nueva no anade trabajos aqui: anade pasos al guion.

# **Donde corre: en los servidores de GitHub.** Desde el 2026-10-15 el repositorio es
# publico, y en un repositorio publico los corredores estandar de GitHub (`ubuntu-latest`)
# no gastan minutos del plan. Antes, privado, la cuenta llego al 90 % de los 3.000 minutos
# del mes y la regla era una subida al dia; la que queda (decision de Miguel del mismo dia)
# es subir cuando el avance lo amerita, en tandas, y no cada cambio. Un corredor mas
# grande que los estandar si se cobra aunque el repositorio sea publico.
#
# La variable del repositorio `RUNS_ON` (Settings -> Secrets and variables -> Actions ->
# Variables) permite mandar la corrida a otro corredor sin tocar el codigo, por ejemplo
# `["self-hosted","macOS","ARM64"]`. Sin variable, corre aqui. El corredor propio esta
# descrito en `docs/reference/corredor-propio.md`; **nunca con el repositorio publico**.

name: verify

on:
  push:
    branches: [main]
    # Un cambio que solo toca documentacion o el registro del flujo no dispara la
    # corrida completa. Lo que estos filtros **nunca** apagan es la compuerta de
    # evaluaciones: un filtro que la desactive la convierte en una sugerencia, y
    # el fallo seria invisible porque las corridas seguirian saliendo verdes.
    # Los prompts y las plantillas de borrador son `.md` pero son codigo: el
    # aplicativo los lee. Se vuelven a incluir despues de excluir `**/*.md`
    # (en `paths` el orden importa: gana el ultimo patron que coincide). Con
    # `paths-ignore` un cambio solo de prompt no corria la compuerta.
    paths:
      - "**"
      - "!docs/**"
      - "!aidlc/**"
      - "!review/**"
      - "!**/*.md"
      - "app/config/prompts/**"
      - "app/backend/src/untangle/synthetic_data/draft_template/**"
  workflow_dispatch:

# Permisos vacios por defecto, elevados por trabajo solo a lo que haga falta.
permissions: {}

concurrency:
  # Dos corridas sobre el mismo trabajo son minutos regalados, y el plan trae
  # 2.000 al mes con bloqueo al agotarse.
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Primero y solo. El aviso llega en minutos y no al final de la corrida, que es
  # lo que exige la practica afirmada. Va **sin credenciales** a proposito: es el
  # trabajo con mas superficie de todo el flujo.
  secrets:
    name: escaneo de secretos
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["ubuntu-latest"]') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El historial completo: el escaneo mira el cambio y, cuando hay
          # historial, tambien lo que quedo detras.
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # La cache de la accion restaura el directorio de herramientas de `mise`. En
          # un servidor de GitHub ahorra la instalacion; en la Mac de Miguel pisaria
          # las herramientas que el ya tiene instaladas, asi que ahi no se usa.
          cache: ${{ runner.environment == 'github-hosted' }}

      - run: scripts/verify.sh --only secrets

  # Los pasos 2 a 9 se reparten en trabajos paralelos para que la corrida dure lo que dura
  # el mas lento y no la suma (la corrida secuencial pasaba de una hora). El guion sigue
  # siendo la unica fuente de los controles: cada trabajo lo invoca con `--only`, y la
  # union de los grupos es exactamente los pasos 2 a 9. Los trabajos en paralelo no gastan
  # minutos en un repositorio publico.
  rapido:
    name: pasos rapidos (2, 3, 4, 6, 7, 8, 9)
    needs: secrets
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: dependencias
        run: mise run deps:install

      # No se levanta `docker compose`: las pruebas que necesitan base de datos la
      # levantan ellas mismas, con la misma imagen anclada y el rol del aplicativo. Un
      # solo camino, local y en la tuberia. El motor de contenedores ya viene en el
      # corredor de GitHub; en la Mac de Miguel tiene que estar abierto.
      - run: scripts/verify.sh --only rapido

      - name: reporte de la corrida
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-report-${{ github.sha }}
          path: tmp/evals/reports/
          if-no-files-found: warn
          retention-days: 30

  interfaz:
    name: interfaz y arnes de accesibilidad
    needs: secrets
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: dependencias
        run: mise run deps:install

      # Los tres navegadores del arnes de accesibilidad (U6), con las bibliotecas del
      # sistema que piden en Linux. Paso propio y **fuera** de `bootstrap` (NFR21.3).
      # El espejo de Ubuntu del corredor dejo de responder el 2026-10-07 y `apt`
      # esperaba su tiempo por defecto en cada archivo: con espera corta y reintentos
      # el salto al espejo que responde es inmediato.
      - name: apt con espera corta
        if: runner.os == 'Linux'
        run: printf 'Acquire::http::Timeout "15";\nAcquire::https::Timeout "15";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/99-espera-corta

      - name: navegadores del arnes
        # Tarda un minuto; colgado, no deja correr nada mas (2026-10-07).
        timeout-minutes: 10
        run: mise run browsers:install ${{ runner.os == 'Linux' && '-- --with-deps' || '' }}

      # Incluye el presupuesto de PERF-U6.3 del arnes, que el guion aplica donde lo mide.
      - run: scripts/verify.sh --only frontend

      - name: cobertura de la interfaz
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cov-frontend
          path: app/frontend/coverage/
          if-no-files-found: error
          retention-days: 2

  servidor:
    name: pruebas del servidor ${{ matrix.tanda }}/6
    needs: secrets
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      # Que una tanda roja no cancele a las demas: la corrida dice todo lo que hay que
      # arreglar, no un problema por vuelta.
      fail-fast: false
      matrix:
        tanda: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: dependencias
        run: mise run deps:install

      # Cada tanda corre en su propio corredor con su propio motor de contenedores, asi que
      # las bases efimeras no pueden chocar entre tandas. Sus datos de cobertura se
      # combinan en el trabajo `piso`; una tanda sola no mide ni declara el piso.
      - run: scripts/verify.sh --only backend-shard ${{ matrix.tanda }}/6

      - name: datos de cobertura de la tanda
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cov-servidor-${{ matrix.tanda }}
          path: app/backend/coverage/data/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  piso:
    name: piso de cobertura combinada
    needs: [secrets, interfaz, servidor]
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: dependencias
        run: mise run deps:install

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cov-servidor-*
          merge-multiple: true
          path: app/backend/coverage/data

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cov-frontend
          path: app/frontend/coverage

      # Combina las seis tandas y corre la misma compuerta de siempre (piso agregado y de
      # modulos criticos) sobre la cobertura combinada.
      - run: scripts/verify.sh --only gate
