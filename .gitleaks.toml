# Configuracion del escaneo de secretos (paso 1 de `scripts/verify.sh`, y primer
# trabajo del flujo de GitHub Actions).
#
# Se extiende el conjunto de reglas por defecto en vez de reemplazarlo: una
# configuracion propia que no herede las reglas apaga el control entero sin
# decirlo.
[extend]
useDefault = true

# --- Excepciones -------------------------------------------------------------
#
# Cada excepcion va acotada a su archivo **y** a su campo, con su razon escrita
# al lado. Una excepcion por regla o por directorio dejaria de ver una clave de
# verdad pegada tres lineas mas abajo, que es exactamente lo que este paso
# existe para atrapar.

[[rules]]
id = "generic-api-key"
  [rules.allowlist]
  description = """
  Resumenes sinteticos de la fixture de aislamiento DS-8. Son valores
  hexadecimales escritos a mano (`a1b2c3d4e5f6...`, `6f4b2c1d9a8e...`) que el
  escaner marca porque se parecen a una clave.

  No son secretos, y no lo son por diseno: `token_digest` guarda el **resumen**
  del enlace de caso y nunca el enlace, y `visitor_key_hash` guarda el
  **resumen** de la clave del navegador y nunca la clave. Que ahi solo viva el
  resumen es el control (BR3.5, SEC-U2.8), no un descuido.

  La excepcion esta atada al archivo y a esos dos campos: una clave real pegada
  en cualquier otra linea del mismo archivo sigue bloqueando la entrega.
  """
  paths = ['''^app/data/fixtures/ds8_isolation\.json$''']
  regexes = [
    '''"token_digest":\s*"[0-9a-f]{64}"''',
    '''"visitor_key_hash":\s*"[0-9a-f]{64}"''',
  ]
