  } else {
    head = ['closedAt', 'case', 'type', 'resolution', 'channel'];
    body = rows.map((r) => `<tr data-case="${r.n}" data-sub="closed"><td class="mono">${state.lang === 'es' ? r.at : r.atEn}</td><td>${caseCell(r)}</td><td>${t.types[r.type]}</td><td>${r.res === 'rejected' && r.type === 'coverage' ? res.rejectedCoverage : res[r.res]}</td><td>${channelCell(r)}</td></tr>`);
  }
  const cards = rows.map((r) => {
    const top = ib.tab === 'derived' ? `<span class="prio ${r.prio}">${prioIcon(r.prio)}${t.prios[r.prio]}</span>` : `<span class="mono t-small">${ib.tab === 'closed' ? (state.lang === 'es' ? r.at : r.atEn) : r.wait}</span>`;
    const detail = ib.tab === 'closed' ? (r.res === 'rejected' && r.type === 'coverage' ? res.rejectedCoverage : res[r.res]) : `${t.cols.complete} ${r.done}/${r.total}`;
    return `<li><div class="top">${caseCell(r)}${top}</div><span>${t.types[r.type]}${r.cat ? `, ${t.cats[r.cat].toLowerCase()}` : ''}</span><span class="t-small muted">${detail}. ${t.channels[r.channel]}, ${t.langs[r.lang].toLowerCase()}.</span></li>`;
  });
  let list;
  if (ib.loading) {
    list = `<div class="table-wrap"><table class="cases"><thead><tr>${['priority', 'wait', 'case', 'type', 'category', 'complete', 'channel'].map((k) => `<th scope="col">${t.cols[k]}</th>`).join('')}</tr></thead><tbody>${[0, 1, 2].map(() => `<tr aria-hidden="true">${'<td><span class="skel" style="height:14px"></span></td>'.repeat(7)}</tr>`).join('')}</tbody></table></div>
      <ul class="case-cards" aria-hidden="true">${[0, 1, 2].map(() => '<li><span class="skel" style="height:48px"></span></li>').join('')}</ul><p class="sr-only" role="status">${t.loading}</p>`;
  } else if (!rows.length) {
    list = `<div class="empty">${filtered ? `<p>${t.noMatch}</p><button type="button" class="btn btn-secondary btn-sm" data-act="f-clear">${t.clear}</button>` : `<p>${t.emptyWaiting}</p>`}</div>`;
  } else {
    list = `<div class="table-wrap"><table class="cases"><caption class="sr-only">${t.tabs[ib.tab]}</caption><thead><tr>${head.map((k) => `<th scope="col">${t.cols[k]}</th>`).join('')}</tr></thead><tbody>${body.join('')}</tbody></table></div><ul class="case-cards">${cards.join('')}</ul>`;
  }
  return `<div class="screen ${surf()}" lang="${state.lang}">${skip()}${bar}
    <main class="inbox" id="main-content" tabindex="-1">
      <h1 class="t-title" id="inbox-title" tabindex="-1">${t.title}</h1>
      <div class="tabs" role="tablist" aria-labelledby="inbox-title">${tabs}</div>
      ${filters}
      <p class="result-count" role="status">${ib.loading ? '' : t.count(rows.length)}</p>
      ${list}
    </main>
  </div>`;
}

/* ---------- M7 Vista de caso, M8 Vista por enlace y bandeja del suscriptor ---------- */
function initCase() {
  const sub = state.sub;
  const k = { key: 'claim', status: 'derived', form: null, saved: null, comment: '', conflict: false, open: new Set(['fields', 'transcript']), fixing: null, fixValue: '', fixError: false, fixes: [], loading: false, link: null, expired: false };
  const defaultComment = { es: 'Solicitar placa del tercero', en: 'Request the other driver’s plate' };
  if (state.screen === 'm7') {
    if (['coverage', 'agency'].includes(sub)) k.key = sub;
    if (sub === 'form') k.form = { action: 'approve', error: false };
    if (sub === 'nocomment') k.form = { action: 'approve', error: true };
    if (sub === 'saved') { k.saved = 'approve'; k.comment = defaultComment[state.lang]; }
    if (sub === 'conflict') k.conflict = true;
    if (sub === 'waiting') k.status = 'waiting';
    if (sub === 'closed') k.status = 'closed';
    if (sub === 'badfix') { k.fixing = 'when'; k.fixValue = state.lang === 'es' ? '31/02/2026 17:30' : '02/31/2026 17:30'; k.fixError = true; }
    if (sub === 'loading') k.loading = true;
  } else if (state.screen === 'm8') {
    k.key = sub === 'readonly' ? 'direct' : 'link';
    k.link = sub;
    if (sub === 'readonly') k.status = 'closed';
    if (sub === 'after') { k.saved = 'approve'; k.comment = defaultComment.en; }
    if (sub === 'expired') { k.form = { action: 'approve', error: false }; k.comment = defaultComment.en; k.expired = true; }
  } else {
    k.key = 'quote';
  }
  state.kase = k;
}

function caseReason(data) { return c().case.reasons[data.reason]; }

function caseHeader(data) {
  const t = c().case;
  const k = state.kase;
  const decided = Boolean(k.saved);
  let statusLabel = decided ? t.status.decided : t.status[k.status];
  if (k.key === 'direct') statusLabel = c().link.closedRegistered;
  const statusTone = decided || k.status === 'closed' ? 'ok' : k.status === 'derived' ? 'warn' : '';
  const canDecide = k.status === 'derived' && !decided && !k.conflict;
  const done = data.fields.filter(([, v]) => v).length + k.fixes.filter((f) => f.filled).length;
  const total = data.fields.length;
  const acts = canDecide ? actionsFor(data).map(([id, label], i) => `<button type="button" id="act-${id}" class="btn ${i === 0 ? 'btn-primary' : 'btn-secondary'}" data-act="decide" data-v="${id}"${k.form && k.form.action === id ? ' aria-current="true"' : ''}>${label}</button>`).join('') : '';
  const roleLine = data.role === 'agency' || data.role === 'subscriber' ? `<span>${t.role[data.role]}</span>` : '';
  return `<header class="case-head"><div class="case-head-grid">
    ${k.link ? '' : `<a class="back" href="#" data-go="m6:derived">${icon('arrowLeft', 'i-16')}<span>${t.back}</span></a>`}
    <div class="case-title"><h1 id="case-title" tabindex="-1">${t.title} <span class="mono">${data.n}</span></h1><span class="tag">${c().inbox.types[data.record]}</span><span class="tag ${statusTone}">${statusLabel}</span></div>
    <p class="case-reason">${caseReason(data)}</p>
    <p class="case-facts">${roleLine}${data.role === 'agency' ? `<span>${t.issuer}</span>` : ''}<span>${t.category}: ${c().inbox.cats[data.cat].toLowerCase()}</span><span>${fill(t.completeness, { d: done > total ? total : done, t: total })}<span class="mini-thread" aria-hidden="true">${data.fields.map(([, v]) => `<i class="${v ? 'on' : ''}"></i>`).join('')}</span></span><span class="case-extra">${k.status === 'derived' && !decided ? t.since : ''}</span></p>
    <div class="case-actions">${acts}</div>
  </div></header>`;
}

function decisionBlock(data) {
  const t = c().case;
  const k = state.kase;
  if (k.loading) return '';
  if (k.conflict) return `<div class="decision-form"><div class="inline-alert warn" role="status">${icon('info')}<div><strong>${t.conflict}</strong><p>${t.conflictDetail}</p></div></div></div>`;
  if (k.status === 'waiting') return `<div class="decision-form"><div class="inline-alert" role="note">${icon('clock')}<span>${t.waitingNote}</span></div></div>`;
  if (k.status === 'closed' && k.key !== 'direct') return `<div class="decision-form"><div class="inline-alert ok" role="note">${icon('checkCircle')}<span>${t.closedNote}</span></div></div>`;
  if (k.saved && !k.link) {
    const def = actionDef(data, k.saved);
    const who = data.role === 'agency' ? t.whoPriya : t.whoDiana;
    return `<div class="decision-form"><section class="decision-result" aria-labelledby="result-title" role="status"><h2 id="result-title" tabindex="-1" class="section-title">${def[4]}</h2><p class="muted">${fill(t.savedBy, { who })}</p><blockquote style="margin:0" lang="${data.lang}">${esc(k.comment)}</blockquote></section></div>`;
  }
  if (!k.form) return '';
  const def = actionDef(data, k.form.action);
  const l = c().link;
  const err = k.form.error ? `<p class="field-error" id="comment-error">${icon('warning', 'i-16')}<span>${t.commentError}</span></p>` : '';
  const expired = k.expired ? `<div class="inline-alert bad" role="alert">${icon('warning')}<div><p>${l.expired}</p><p class="t-small">${l.expiredHelp}</p></div></div>` : '';
  const primary = k.expired
    ? `<button type="button" class="btn btn-primary" data-act="copy-comment">${icon('copy')}<span>${l.copy}</span></button>`
    : `<button type="submit" class="btn btn-primary">${def[3]}</button>`;
  return `<div class="decision-form"><form data-form="decision" novalidate aria-labelledby="form-title">
    <h2 id="form-title" class="section-title">${def[2]}</h2>
    ${expired}
    <div><label class="field-label" for="decision-comment">${k.link ? t.commentLink : t.comment}</label>
      <textarea id="decision-comment" class="textarea${k.form.error ? ' is-invalid' : ''}" aria-describedby="comment-help${k.form.error ? ' comment-error' : ''}"${k.form.error ? ' aria-invalid="true"' : ''}>${esc(k.comment)}</textarea>
      <p class="field-help" id="comment-help">${k.link ? t.commentLinkHelp : t.commentHelp}</p>${err}</div>
    <div class="form-actions">${primary}<button type="button" class="btn btn-secondary" data-act="decide-cancel">${t.cancel}</button></div>
  </form></div>`;
}

function linkBand() {
  const k = state.kase;
  if (!k.link) return '';
  const l = c().link;
  let inner;
  if (k.link === 'readonly') {
    inner = `<p><strong>${l.readonlyTitle}</strong></p><p>${l.readonlyRule}</p><p class="t-small muted">${l.readonlyExpires}</p>`;
  } else if (k.saved) {
    inner = `<p role="status" id="link-done" tabindex="-1"><strong>${l.doneTitle}</strong></p><p class="t-small muted">${l.seesLabel}</p><blockquote lang="en">${fill(l.sees, { c: esc(k.comment) })}</blockquote><p>${l.console}</p><div><button type="button" class="btn btn-secondary" data-go="m4:decided:sunmeadow">${l.back}</button></div>`;
  } else {
    inner = `<p>${l.enter}</p><div><p><strong>${l.stepsTitle}</strong></p><ol class="link-steps">${l.steps.map((step) => `<li>${step}</li>`).join('')}</ol></div><div><button type="button" class="btn btn-secondary" data-go="m4:ended:sunmeadow">${l.back}</button></div>`;
  }
  return `<section class="link-band" aria-label="${l.back}"><div class="link-band-inner">${inner}</div></section>`;
}

const DATE_RE = /^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{1,2}):(\d{2})$/;
function validDate(value) {
  const m = DATE_RE.exec(value.trim());
  if (!m) return false;
  const [day, month] = state.lang === 'es' ? [Number(m[1]), Number(m[2])] : [Number(m[2]), Number(m[1])];
  const year = Number(m[3]);
  const probe = new Date(year, month - 1, day);
  return probe.getMonth() === month - 1 && probe.getDate() === day && Number(m[4]) < 24 && Number(m[5]) < 60;
}

function evidence(data) {
  const t = c().case;
  const k = state.kase;
  const labels = FIELD_LABELS[state.lang];
  const canFix = !k.link || k.link === 'enter';
  const editable = (k.status === 'derived' || k.status === 'waiting') && !k.saved && canFix && data.role !== 'agency' && data.role !== 'subscriber';
  const sec = (id, title, summary, body) => {
    const open = k.open.has(id);
    return `<section class="ev"><h2><button type="button" class="ev-toggle" id="ev-btn-${id}" data-act="ev" data-v="${id}" aria-expanded="${open}" aria-controls="ev-${id}">${icon('caretRight', 'i-16')}<span>${title}</span>${summary ? `<span class="ev-summary">${summary}</span>` : ''}</button></h2><div class="ev-body" id="ev-${id}"${open ? '' : ' hidden'}>${body}</div></section>`;
  };
  const values = Object.fromEntries(data.fields);
  k.fixes.forEach((f) => { values[f.key] = f.value; });
  const fields = `<ul class="fields">${data.fields.map(([key]) => {
    const value = values[key];
    const editing = k.fixing === key;
    const side = value
      ? `<span class="tag ok">${icon('check', 'i-16')}${t.confirmed}</span>${editable && !editing ? `<button type="button" class="btn btn-quiet btn-sm" id="fix-${key}" data-act="fix" data-v="${key}">${t.fix}<span class="sr-only"> ${labels[key]}</span></button>` : ''}`
      : `<span class="tag">${t.pending}</span>`;
    const form = editing ? `<form class="field-edit" data-form="fix" data-v="${key}" novalidate>
        <label class="field-label" for="fix-input">${labels[key]}</label>
        <input id="fix-input" class="input${k.fixError ? ' is-invalid' : ''}" value="${esc(k.fixValue)}" aria-describedby="fix-format${k.fixError ? ' fix-error' : ''}"${k.fixError ? ' aria-invalid="true"' : ''}>
        ${key === 'when' ? `<p class="field-help" id="fix-format">${t.fixFormat}</p>` : '<p class="sr-only" id="fix-format"></p>'}
        ${k.fixError ? `<p class="field-error" id="fix-error">${icon('warning', 'i-16')}<span>${t.fixError}</span></p>` : ''}
        <div class="form-actions"><button type="submit" class="btn btn-primary btn-sm">${t.save}</button><button type="button" class="btn btn-secondary btn-sm" data-act="fix-cancel">${t.cancel}</button></div>
      </form>` : '';
    return `<li class="field-row"><span class="field-name">${labels[key]}</span><span class="field-val" lang="${data.lang}">${value ? esc(value) : '—'}</span><span class="field-side">${side}</span>${form}</li>`;
  }).join('')}</ul>${k.fixes.length ? `<p class="t-small muted">${t.fixDone}</p>` : ''}`;

  const pii = (text) => text.replace(/\{pii:(\w+)\}/g, (_, type) => piiTag(type));
  const agentName = 'Valentina';
  const transcript = `<p class="tmark">${icon('check', 'i-16')}<span>${t.disclosureAt}</span></p>${data.transcript.map(([who, time, text]) => `<div class="tline" lang="${data.lang}"><span class="who">${who === 'agent' ? agentName : data.speaker}<span class="when">${time}</span></span><span class="txt">${pii(esc(text).replace(/\{pii:(\w+)\}/g, '{pii:$1}'))}</span></div>`).join('')}`;

  const cited = data.cited.map((id) => { const cl = CLAUSE_TEXT[id]; return `<div class="source"><p class="source-title">${icon('file', 'i-16')}<span>${cl.title[state.lang]}</span></p><p class="source-meta"><span class="mono">${cl.id}</span><span>${c().chat.version} <span class="mono">${cl.version}</span></span><span class="tag ok">${t.verified}</span></p><p class="clause" lang="${cl.lang}">${cl.text}</p></div>`; }).join('');
  const clauses = `${cited || `<p class="muted">${NONE_CITED[state.lang]}</p>`}${data.noClause ? `<p class="src-row" style="margin-top:8px"><span>${t.noClauseLine}</span><span class="tag warn">${t.noClauseTag}</span></p>` : ''}`;
  const rule = data.rule[state.lang];
  const controls = `<ul class="check-list">${t.controls.map((x) => `<li>${icon('checkCircle')}<span>${x}<span class="sr-only">, ${t.cumplido}</span></span></li>`).join('')}</ul>`;
  const trace = `<ol class="thread">${TRACE_NODES[state.lang].map(([name, token, ms]) => `<li class="done"><span class="node">${icon('check')}</span><div class="node-row"><span><span class="node-name">${name}</span><span class="node-token">${token}</span></span><span class="node-ms">${ms}</span></div></li>`).join('')}</ol>`;
  const decidedBy = k.saved ? `${fill(t.savedBy, { who: k.link ? t.whoVisitor : (data.role === 'agency' ? t.whoPriya : t.whoDiana) })}` : (k.key === 'direct' ? rule[1] : state.lang === 'es' ? 'Pendiente de decisión.' : 'Pending decision.');
  const explainRows = [[t.explain[0][0], data.asked[state.lang]], [t.explain[1][0], data.cited.length ? data.cited.join(', ') : NONE_CITED[state.lang]], [t.explain[2][0], rule[0]], [t.explain[3][0], decidedBy]];
  const explain = `<dl class="kv" style="grid-template-columns:minmax(0,11rem) minmax(0,1fr)">${explainRows.map(([q, a]) => `<dt>${q}</dt><dd style="text-align:left">${a}</dd>`).join('')}</dl>`;
  const hist = [...t.history, ...k.fixes.map(() => t.historyFix)];
  if (k.saved) hist.push([state.lang === 'es' ? '4:31 p. m.' : '4:31 p.m.', `${k.link ? t.whoVisitor : t.whoDiana}: ${actionDef(data, k.saved)[4].toLowerCase()}.`]);
  const history = `<ul class="history">${hist.map(([time, text]) => `<li><span class="mono">${time}</span>${text}</li>`).join('')}</ul>`;

  return `<div class="evidence">
    <div class="ev-top">${sec('fields', t.sections.fields, '', fields)}${sec('transcript', t.sections.transcript, '', transcript)}</div>
    ${sec('clauses', fill(t.sections.clauses, { n: data.cited.length }), '', clauses)}
    ${sec('rule', t.sections.rule, rule[0], `<p>${rule[1]}</p>`)}
    ${sec('controls', t.sections.controls, fill(t.controlsSummary, { n: 4 }), controls)}
    ${sec('trace', t.sections.trace, t.traceSummary, trace)}
    ${sec('explain', t.sections.explain, '', explain)}
    ${sec('history', fill(t.sections.history, { n: hist.length }), '', history)}
  </div>`;
}

function renderCase() {
  if (!state.kase) initCase();
  const k = state.kase;
  const data = CASE_DATA[k.key];
  const t = c().case;
  const bar = k.link ? appbar(data.n) : appbar(data.role === 'agency' ? 'Knotwell Insurance Agency' : data.role === 'subscriber' ? 'Sunmeadow Auto' : 'Stonecroft Mutual', `<span class="appbar-title">${t.role[data.role] || ''}</span>`);
  if (k.loading) {
    return `<div class="screen ${surf()}" lang="${state.lang}">${bar}<div class="case-head"><div class="case-head-grid" aria-hidden="true"><span class="skel" style="height:28px;width:50%"></span><span class="skel" style="height:18px;width:70%"></span><span class="skel" style="height:18px;width:40%"></span></div></div><div class="evidence" aria-hidden="true">${[0, 1, 2, 3].map(() => '<span class="skel" style="height:52px"></span>').join('')}</div><p class="sr-only" role="status">${t.loading}</p></div>`;
  }
  return `<div class="screen ${surf()} case" lang="${state.lang}">${skip()}${bar}${linkBand()}
    <main id="main-content" tabindex="-1">${caseHeader(data)}${decisionBlock(data)}${evidence(data)}</main>
  </div>`;
}

/* ---------- M10 Panel de gasto ---------- */
function money(value) { return `${value.toFixed(2).replace('.', c().spend.dec)} USD`; }
function renderSpend() {
  const t = c().spend;
  const key = ['alert', 'ceiling'].includes(state.sub) ? state.sub : 'normal';
  const data = SPEND[key];
  const pct = Math.min(100, (data.total / 5) * 100);
  const tone = key === 'ceiling' ? 'full' : key === 'alert' ? 'over' : '';
  const dot = key === 'ceiling' ? 'bad' : key === 'alert' ? 'warn' : 'ok';
  const names = [t.llm, t.stt, t.tts];
  const maxBin = Math.max(...HIST);
  return `<div class="screen ${surf()}" lang="${state.lang}">${skip()}${appbar(t.title)}
    <main class="panel" id="main-content" tabindex="-1">
      <section class="spend-head" aria-labelledby="sp-title">
        <h1 id="sp-title"><span class="t-figure">${money(data.total)}</span> <span class="t-lead muted">${t.of} ${money(5)}</span></h1>
        <p class="muted">${t.window}</p>
        <div class="meter" role="meter" aria-label="${t.meterLabel}" aria-valuemin="0" aria-valuemax="5" aria-valuenow="${data.total}" aria-valuetext="${money(data.total)} ${t.of} ${money(5)}">
          <span class="meter-fill ${tone}" style="width:${pct}%"></span><span class="meter-mark" style="left:60%" aria-hidden="true"></span>
        </div>
        <div class="meter-legend" aria-hidden="true"><span style="left:60%">${t.alertAt}</span></div>
        <p class="status-line" role="status"><span class="dot ${dot}"></span><span>${t.status[key]}</span></p>
      </section>
      <section class="metric" aria-labelledby="sp-prov"><h2 id="sp-prov">${t.byProvider}</h2>
        <div style="overflow-x:auto"><table class="money-table"><thead><tr><th scope="col"><span class="sr-only">${t.byProvider}</span></th><th scope="col" class="num">${t.month}</th><th scope="col" class="num">${t.total}</th></tr></thead><tbody>
          ${data.rows.map(([month, total], i) => `<tr><th scope="row" style="font-weight:400">${names[i]}${i === 1 ? ` <span class="tag info">${t.freeCredit}</span>` : ''}</th><td class="num mono">${money(month)}</td><td class="num mono">${money(total)}</td></tr>`).join('')}
        </tbody></table></div></section>
      <section class="metric" aria-labelledby="sp-month"><h2 id="sp-month">${t.byMonth}</h2><ul class="counts">${t.months.map(([name], i) => `<li><span>${name}</span><span class="mono">${money(data.months[i])}</span></li>`).join('')}</ul></section>
      <section class="metric" aria-labelledby="sp-case"><h2 id="sp-case">${t.perCase}</h2>
        <div><p>${t.average}</p><p class="t-small muted" style="margin-top:4px">${t.histLabel}</p>
          <div class="hist">${HIST.map((n, i) => `<div class="hist-row"><span>${t.bins[i]}</span><span class="hist-bar" style="width:${(n / maxBin) * 100}%"></span><span class="mono">${n}</span></div>`).join('')}</div>
          <p style="margin-top:14px">${t.perMinute}: <span class="mono">${t.perMinuteValue.slice(0, t.perMinuteValue.indexOf(', '))}</span>${t.perMinuteValue.slice(t.perMinuteValue.indexOf(', '))}</p>
        </div></section>
      <p class="metric-meta" style="padding-top:16px;border-top:1px solid var(--hair)">${t.foot}</p>
    </main></div>`;
}

/* ---------- M11 Páginas de estado ---------- */
function renderStatus() {
  const light = state.sub === 'expiredLight';
  const key = light ? 'expired' : state.sub;
  const [title, text, action, wakingText] = c().status[key] || c().status.notfound;
  const actions = { unavailable: 'data-note', invalid: 'data-go="m1:available"', expired: 'data-go="m2:closure"', reset: 'data-go="m1:available"', notfound: 'data-go="m1:available"', down: 'data-act="status-retry"' };
  const btn = action ? `<button type="button" class="btn ${key === 'down' ? 'btn-primary' : 'btn-secondary'}" ${actions[key]}>${action}</button>` : '';
  const wake = key === 'waking' ? `<div class="wake" aria-hidden="true"></div><p class="wake-text">${wakingText}</p>` : '';
  const surface = light ? `${surf()} ins-ctx ins-${state.ins}` : surf();
  const head = light ? `<header class="chat-head">${mono(state.ins)}<div class="chat-ins"><strong>${INS[state.ins].name}</strong><span class="sig">${c().chat.withUntangle}</span></div><div class="head-lang">${langSeg()}${themeSeg()}</div></header>` : appbar('');
  return `<div class="screen ${surface}" lang="${state.lang}">${head}
    <main class="status" id="main-content" tabindex="-1"><div class="status-card">
      <h1 class="t-title">${title}</h1>${key === 'waking' ? `<p class="sr-only" role="status">${title}</p>` : ''}<p class="muted">${text}</p>${wake}${btn}
    </div></main></div>`;
}

/* ---------- Render, navegación y barra de revisión ---------- */
function renderScreen() {
  switch (state.screen) {
    case 'm1': return renderHome();
    case 'm2': case 'm3': return renderChat();
    case 'm4': return renderConsole();
    case 'm5': return renderCompare();
    case 'm6': return renderInbox();
    case 'm7': case 'm8': return renderCase();
    case 'm9': return renderMetrics();
    case 'm10': return renderSpend();
    case 'm11': return renderStatus();
    case 'm12': return state.sub === 'subscriber' ? renderCase() : renderChat();
    default: return renderHome();
  }
}

let callTick = null;
function stopCallTimer() { if (callTick) { clearInterval(callTick); callTick = null; } }
function resetScreenState() {
  clearTimers();
  stopCallTimer();
  state.chat = null; state.call = null; state.cmp = null; state.inbox = null; state.kase = null;
}

function render(opts = {}) {
  const app = document.getElementById('app');
  const active = document.activeElement;
  const activeId = active && app.contains(active) && active.id ? active.id : null;
  const scrolls = {};
  app.querySelectorAll('[data-scroll]').forEach((el) => { scrolls[el.dataset.scroll] = el.scrollTop; });
  const screenScroll = app.firstElementChild ? app.firstElementChild.scrollTop : 0;
  app.innerHTML = renderScreen();
  const screen = app.firstElementChild;
  if (!opts.nav && screen) screen.scrollTop = screenScroll;
  app.querySelectorAll('[data-scroll]').forEach((el) => { if (!opts.nav && el.dataset.scroll in scrolls) el.scrollTop = scrolls[el.dataset.scroll]; });
  const log = app.querySelector('.chat-log');
  if (log && state.chat && (state.chat.scrollEnd || opts.nav)) { log.scrollTop = log.scrollHeight; state.chat.scrollEnd = false; }
  const callLog = app.querySelector('[data-scroll="call-log"]');
  if (callLog && state.call && state.call.scrollEnd) { callLog.scrollTop = callLog.scrollHeight; state.call.scrollEnd = false; }
  if (state.chat) { state.chat.traceAnim = false; state.chat.msgs.forEach((m) => { m.isNew = false; }); }
  const target = state.focus || (activeId ? `#${CSS.escape(activeId)}` : null) || (opts.focusMain ? '#main-content' : null);
  state.focus = null;
  if (target) {
    const el = app.querySelector(target);
    if (el) {
      el.focus({ preventScroll: Boolean(opts.nav) });
      if ((el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') && typeof el.value === 'string') { const end = el.value.length; try { el.setSelectionRange(end, end); } catch (e) { /* algunos campos no admiten selección */ } }
    }
  }
}

function writeHash() {
  try { history.replaceState(null, '', `#${[state.screen, state.sub, state.ins, state.lang, state.device, state.mode].join('/')}`); } catch (e) { /* el marco puede bloquear el historial */ }
}
function readHash() {
  try {
    const [screen, sub, ins, lang, device, mode] = decodeURIComponent(location.hash.replace(/^#/, '')).split('/');
    if (mode === 'light' || mode === 'dark') state.mode = mode;
    if (screen && SCREENS.some((s) => s.id === screen)) {
      state.screen = screen;
      const def = screenById(screen);
      state.sub = def.states.some(([id]) => id === sub) ? sub : def.states[0][0];
    }
    if (ins && INS[ins]) state.ins = ins;
    if (lang === 'es' || lang === 'en') state.lang = lang;
    if (device === 'phone' || device === 'desktop') state.device = device;
  } catch (e) { /* sin estado en la dirección */ }
}

function goTo(screen, sub, ins, opts = {}) {
  const def = screenById(screen);
  state.screen = def.id;
  state.sub = def.states.some(([id]) => id === sub) ? sub : def.states[0][0];
  if (ins && INS[ins]) state.ins = ins;
  else if (def.id === 'm4' && !opts.keepIns) state.ins = 'sunmeadow';
  resetScreenState();
  writeHash();
  syncChrome();
  render({ nav: true, focusMain: Boolean(opts.focusMain) });
  const device = document.getElementById('app').firstElementChild;
  if (device) device.scrollTop = 0;
}

function setLang(lang) {
  if (lang !== 'es' && lang !== 'en') return;
  state.lang = lang;
  resetScreenState();
  writeHash();
  syncChrome();
  render({ nav: true });
}

function setMode(mode) {
  if (mode !== 'light' && mode !== 'dark') return;
  state.mode = mode;
  try { localStorage.setItem('untangle-maqueta-modo', mode); } catch (e) { /* sin almacenamiento: vale solo en esta visita */ }
  writeHash();
  render();
}

function applyDevice() {
  document.getElementById('device').classList.toggle('is-phone', state.device === 'phone');
}

function syncChrome() {
  const def = screenById(state.screen);
  const screenSel = document.getElementById('proto-screen');
  screenSel.innerHTML = SCREENS.map((s) => `<option value="${s.id}"${s.id === def.id ? ' selected' : ''}>${s.name}</option>`).join('');
  document.getElementById('proto-state').innerHTML = def.states.map(([id, label]) => `<option value="${id}"${id === state.sub ? ' selected' : ''}>${label}</option>`).join('');
  const insWrap = document.getElementById('proto-ins-wrap');
  insWrap.hidden = !(def.insurer || (def.id === 'm11' && state.sub === 'expiredLight'));
  document.getElementById('proto-ins').innerHTML = INSURER_IDS.map((id) => `<option value="${id}"${id === state.ins ? ' selected' : ''}>${INS[id].name}</option>`).join('');
  document.querySelectorAll('[data-device]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.device === state.device)));
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang)));
  document.getElementById('proto-note').innerHTML = `<strong>${def.name}.</strong> ${def.purpose} Historias: ${def.stories}.`;
}

let toastTimer = null;
function toast(text) {
  const el = document.getElementById('proto-toast');
  el.textContent = text;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 3400);
}

/* ---------- Simulaciones ---------- */
function streamMessage(msg) {
  const ch = state.chat;
  if (!ch) return;
  msg.isNew = true;
  if (reducedMotion()) { ch.msgs.push(msg); ch.scrollEnd = true; render(); return; }
  const words = msg.text.split(' ');
  msg.shown = '';
  ch.msgs.push(msg);
  ch.scrollEnd = true;
  render();
  let count = 0;
  const step = () => {
    if (state.chat !== ch) return;
    count += 1;
    msg.shown = words.slice(0, count).join(' ');
    const log = document.querySelector('.chat-log');
    const bubbles = document.querySelectorAll('.chat-log .msg.agent .bubble');
    const bubble = bubbles[bubbles.length - 1];
    if (log) log.setAttribute('aria-busy', 'true');
    if (bubble) bubble.textContent = msg.shown;
    if (log) log.scrollTop = log.scrollHeight;
    if (count < words.length) later(step, 40);
    else { delete msg.shown; ch.scrollEnd = true; render(); }
  };
  later(step, 40);
}

function replyTo(text) {
  const ch = state.chat;
  if (!ch) return;
  const t = c().chat;
  ch.msgs = ch.msgs.filter((m) => m.k !== 'typing');
  const low = text.toLowerCase();
  if (/herid|sangr|hurt|injur|bleed/.test(low)) {
    ch.msgs.push({ k: 'emergency', isNew: true });
    streamMessage({ k: 'agent', text: t.afterEmergency });
  } else if (/persona|humano|ajustador|person|human|adjuster/.test(low)) streamMessage({ k: 'agent', text: t.humanReply });
  else if (/alquiler|rental|cubre|cover|póliza|poliza|policy/.test(low)) streamMessage({ k: 'cited', text: t.rentalA[state.ins] });
  else if (/choq|chocaron|accidente|crash|accident|collision/.test(low)) streamMessage({ k: 'agent', text: t.crashReply });
  else streamMessage({ k: 'agent', text: t.genericReply });
}

function sendChat() {
  const ch = state.chat;
  if (!ch || ch.limit || ch.sending) return;
  const text = ch.draft.trim();
  if (!text) return;
  ch.msgs.push({ k: 'person', text, isNew: true, pending: true });
  ch.draft = '';
  ch.sending = true;
  ch.scrollEnd = true;
  state.focus = '#chat-input';
  render();
  if (!ch.toldProto) { ch.toldProto = true; toast(c().chat.protoReply); }
  later(() => {
    if (state.chat !== ch) return;
    ch.msgs[ch.msgs.length - 1].pending = false;
    ch.sending = false;
    ch.msgs.push({ k: 'typing' });
    ch.scrollEnd = true;
    render();
    later(() => replyTo(text), 900);
  }, 350);
}

function startCall({ resume = false } = {}) {
  const call = state.call;
  stopCallTimer();
  Object.assign(call, {
    phase: 'incall', lines: [], partial: null, agent: 'listening', latency: null, bg: false, tab: 'conversation', scrollEnd: true,
    blocks: Object.fromEntries(BLOCK_KEYS.map((k) => [k, 'pending'])), remaining: resume ? call.remaining : 180,
  });
  state.focus = '#call-hangup';
  render();
  CALL_EVENTS.forEach(([at, apply]) => later(() => {
    if (state.call !== call || call.phase !== 'incall') return;
    apply(call);
    call.scrollEnd = true;
    render();
  }, at + 400));
  callTick = setInterval(() => {
    if (state.call !== call || call.phase !== 'incall') { stopCallTimer(); return; }
    call.remaining -= 1;
    const out = document.getElementById('call-remaining');
    if (out) out.textContent = clock(call.remaining);
    if (call.remaining === 60) { const live = document.getElementById('call-announce'); if (live) live.textContent = c().console.announce60; }
    if (call.remaining === 30) { render(); const live = document.getElementById('call-announce'); if (live) live.textContent = c().console.announce30; }
    if (call.remaining <= 0) { stopCallTimer(); call.phase = 'ended'; state.focus = '#end-title'; render(); }
  }, 1000);
}

function askCompare(text) {
  const cmp = state.cmp;
  const value = (text || '').trim();
  if (!cmp || !value) return;
  cmp.text = value;
  cmp.expanded.clear();
  const low = value.toLowerCase();
  if (/choq|siniestro|reportar|crash|accident|report a claim/.test(low)) { cmp.claim = true; render(); return; }
  cmp.claim = false;
  cmp.q = /granizo|hail|vidrio|window/.test(low) ? 'hail' : /cerca|fence|vecino|neighbor/.test(low) ? 'fence' : 'rental';
  INSURER_IDS.forEach((id) => { cmp.cols[id] = 'loading'; });
  render();
  const done = resolvedColumns(cmp.q);
  INSURER_IDS.forEach((id, i) => later(() => { if (state.cmp !== cmp) return; cmp.cols[id] = done[id]; render(); }, 700 + i * 550));
}

function submitDecision() {
  const k = state.kase;
  if (!k || !k.form || k.expired) return;
  if (!k.comment.trim()) { k.form.error = true; state.focus = '#decision-comment'; render(); return; }
  k.saved = k.form.action;
  k.form = null;
  state.focus = k.link ? '#link-done' : '#result-title';
  render();
}

function submitFix(key) {
  const k = state.kase;
  if (!k) return;
  const value = k.fixValue.trim();
  if ((key === 'when' && !validDate(value)) || !value) { k.fixError = true; state.focus = '#fix-input'; render(); return; }
  k.fixes = k.fixes.filter((f) => f.key !== key).concat({ key, value });
  k.fixing = null;
  k.fixError = false;
  state.focus = `#fix-${key}`;
  render();
}

/* ---------- Eventos ---------- */
function onAction(el, ev) {
  const act = el.dataset.act;
  const v = el.dataset.v;
  const ch = state.chat;
  const call = state.call;
  const k = state.kase;
  switch (act) {
    case 'skip': { ev.preventDefault(); const main = document.getElementById('main-content'); if (main) main.focus(); break; }
    case 'lang': setLang(v); break;
    case 'theme': setMode(v); break;
    case 'suggest': { ch.draft = c().chat.suggestions[Number(el.dataset.i)]; sendChat(); break; }
    case 'policy': ch.policyOpen = !ch.policyOpen; render(); break;
    case 'clause': { const i = Number(el.dataset.i); if (ch.expanded.has(i)) ch.expanded.delete(i); else ch.expanded.add(i); render(); break; }
    case 'trace-open': ch.traceOpen = true; ch.traceAnim = true; ch.traceReturn = el.id; state.focus = '#trace-title'; render(); break;
    case 'trace-close': ch.traceOpen = false; state.focus = ch.traceReturn ? `#${ch.traceReturn}` : '#chat-input'; render(); break;
    case 'readback': {
      const m = ch.msgs.find((x) => x.k === 'readback' && x.open);
      if (!m) break;
      const t = c().chat;
      const yes = v === 'yes';
      m.open = false;
      ch.msgs.push({ k: 'person', text: yes ? t.yesCorrect : t.fix, isNew: true }, { k: 'typing' });
      ch.scrollEnd = true;
      state.focus = '#chat-input';
      render();
      later(() => { if (state.chat !== ch) return; ch.msgs = ch.msgs.filter((x) => x.k !== 'typing'); streamMessage({ k: 'agent', text: yes ? t.afterYes : t.afterFix }); }, 800);
      break;
    }
    case 'call-start': call.phase = 'connecting'; state.focus = '#call-cancel'; render(); later(() => { if (state.call === call && call.phase === 'connecting') startCall(); }, 1400); break;
    case 'call-cancel': clearTimers(); call.phase = 'before'; state.focus = '#call-start'; render(); break;
    case 'call-hangup': stopCallTimer(); clearTimers(); call.phase = 'ended'; state.focus = '#end-title'; render(); break;
    case 'call-again': call.phase = 'connecting'; render(); later(() => { if (state.call === call) startCall({ resume: true }); }, 1200); break;
    case 'call-pass': call.phase = 'ended'; state.focus = '#end-title'; render(); break;
    case 'call-tab': call.tab = v; state.focus = `#tab-${v}`; render(); break;
    case 'cmp-suggest': askCompare(c().compare.questions[el.dataset.q]); break;
    case 'cmp-retry': { const id = el.dataset.ins; state.cmp.cols[id] = 'loading'; render(); later(() => { if (!state.cmp) return; state.cmp.cols[id] = resolvedColumns(state.cmp.q)[id]; render(); }, 900); break; }
    case 'cmp-clause': { const id = el.dataset.ins; const set = state.cmp.expanded; if (set.has(id)) set.delete(id); else set.add(id); render(); break; }
    case 'inbox-tab': state.inbox.tab = v; state.inbox.prio = 'all'; render(); break;
    case 'f-clear': Object.assign(state.inbox, { channel: 'all', lang: 'all', prio: 'all' }); state.focus = '#inbox-title'; render(); break;
    case 'decide': k.form = { action: v, error: false }; k.comment = ''; state.focus = '#decision-comment'; render(); break;
    case 'decide-cancel': { const action = k.form && k.form.action; k.form = null; k.expired = false; state.focus = action ? `#act-${action}` : '#case-title'; render(); break; }
    case 'copy-comment': {
      const done = () => toast(c().link.copied);
      try { navigator.clipboard.writeText(k.comment).then(done, () => { const box = document.getElementById('decision-comment'); if (box) box.select(); }); } catch (e) { const box = document.getElementById('decision-comment'); if (box) box.select(); }
      break;
    }
    case 'fix': { const data = CASE_DATA[k.key]; const current = (k.fixes.find((f) => f.key === v) || {}).value || Object.fromEntries(data.fields)[v] || ''; k.fixing = v; k.fixValue = current; k.fixError = false; state.focus = '#fix-input'; render(); break; }
    case 'fix-cancel': { const key = k.fixing; k.fixing = null; k.fixError = false; state.focus = `#fix-${key}`; render(); break; }
    case 'ev': if (k.open.has(v)) k.open.delete(v); else k.open.add(v); render(); break;
    case 'status-retry': goTo('m1', 'available'); break;
    default: break;
  }
}

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-go],[data-act],[data-note],[data-case],[data-device],[data-lang]');
  if (!el) return;
  if (el.dataset.device) { state.device = el.dataset.device; applyDevice(); writeHash(); syncChrome(); render(); return; }
  if (el.dataset.lang && el.closest('.proto-bar')) { setLang(el.dataset.lang); return; }
  if (el.hasAttribute('data-go')) { ev.preventDefault(); const [screen, sub, ins] = el.dataset.go.split(':'); goTo(screen, sub, ins, { focusMain: true }); return; }
  if (el.hasAttribute('data-note')) { ev.preventDefault(); toast(c().common.protoLink); return; }
  if (el.dataset.case) { ev.preventDefault(); goTo('m7', el.dataset.sub, undefined, { focusMain: true }); return; }
  if (el.dataset.act) onAction(el, ev);
});

document.addEventListener('submit', (ev) => {
  const form = ev.target.closest('[data-form]');
  if (!form) return;
  ev.preventDefault();
  if (form.dataset.form === 'chat') sendChat();
  if (form.dataset.form === 'compare') askCompare(document.getElementById('cmp-q').value);
  if (form.dataset.form === 'decision') submitDecision();
  if (form.dataset.form === 'fix') submitFix(form.dataset.v);
});

document.addEventListener('keydown', (ev) => {
  if (ev.target.id === 'chat-input' && ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); sendChat(); return; }
  if (ev.key !== 'Escape') return;
  if (state.chat && state.chat.traceOpen) { state.chat.traceOpen = false; state.focus = state.chat.traceReturn ? `#${state.chat.traceReturn}` : '#chat-input'; render(); return; }
  if (state.kase && state.kase.form) { const action = state.kase.form.action; state.kase.form = null; state.kase.expired = false; state.focus = `#act-${action}`; render(); return; }
  if (state.kase && state.kase.fixing) { const key = state.kase.fixing; state.kase.fixing = null; state.kase.fixError = false; state.focus = `#fix-${key}`; render(); }
});

document.addEventListener('input', (ev) => {
  const { id, value } = ev.target;
  if (id === 'chat-input' && state.chat) state.chat.draft = value;
  if (id === 'decision-comment' && state.kase) state.kase.comment = value;
  if (id === 'fix-input' && state.kase) state.kase.fixValue = value;
  if (id === 'cmp-q' && state.cmp) state.cmp.text = value;
});

document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.id === 'proto-screen') { goTo(el.value); return; }
  if (el.id === 'proto-state') { goTo(state.screen, el.value, state.ins, { keepIns: true }); return; }
  if (el.id === 'proto-ins') { goTo(state.screen, state.sub, el.value, { keepIns: true }); return; }
  const kind = el.dataset.change;
  if (!kind) return;
  if (kind === 'lang') setLang(el.value);
  if (kind === 'call-ins') { state.ins = el.value; state.call.lang = callLangFor(el.value); writeHash(); render(); }
  if (kind === 'call-lang') { state.call.lang = el.value; render(); }
  if (kind === 'f-channel') { state.inbox.channel = el.value; render(); }
  if (kind === 'f-lang') { state.inbox.lang = el.value; render(); }
  if (kind === 'f-prio') { state.inbox.prio = el.value; render(); }
});

window.addEventListener('hashchange', () => { readHash(); resetScreenState(); applyDevice(); syncChrome(); render({ nav: true }); });

document.getElementById('proto-logo').innerHTML = LOGO;
try {
  const saved = localStorage.getItem('untangle-maqueta-modo');
  if (saved === 'light' || saved === 'dark') state.mode = saved;
  else if (window.matchMedia) state.mode = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
} catch (e) { /* sin almacenamiento: se usa el modo del dispositivo */ }
readHash();
applyDevice();
syncChrome();
render({ nav: true });

})();
</script>
</body>
</html>
