<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maqueta de Untangle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..500&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root {
  color-scheme: dark;
  --font-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-inout: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --review-bg: #16161E;
  --review-panel: #1F1F2A;
  --review-line: #30303F;
  --review-text: #E9E6EE;
  --review-muted: #A9A7B3;
}

html, body { height: 100%; }
body {
  margin: 0;
  padding-inline: 16px;
  background: var(--review-bg);
  color: var(--review-text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* Barra de revisión: no es parte del aplicativo */
.proto { max-width: 1280px; margin: 0 auto; padding-block: 12px 24px; display: grid; gap: 10px; }
.proto-bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  padding: 8px 10px; background: var(--review-panel);
  border: 1px solid var(--review-line); border-radius: 12px;
}
.proto-brand { display: flex; align-items: center; gap: 8px; margin-right: auto; font-size: 14px; font-weight: 500; }
.proto-brand svg { width: 24px; height: 18px; color: #E0873A; }
.proto-field { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--review-muted); }
.proto-field select {
  color: var(--review-text); background: #13131D; border: 1px solid #66667F; border-radius: 8px;
  min-height: 36px; padding: 0 8px; font-size: 14px; max-width: 58vw;
}
.proto-seg { display: inline-flex; border: 1px solid #66667F; border-radius: 999px; overflow: hidden; }
.proto-seg button {
  color: var(--review-muted); background: transparent; border: 0; min-height: 34px; padding: 0 12px;
  font-size: 13px; cursor: pointer;
}
.proto-seg button[aria-pressed="true"] { background: #E0873A; color: #120B06; }
.proto-bar :focus-visible { outline: 2px solid #E0873A; outline-offset: 2px; }
.proto-note { margin: 0; font-size: 13px; line-height: 1.5; color: var(--review-muted); max-width: 110ch; }
.proto-note strong { color: var(--review-text); font-weight: 500; }
.stage { display: flex; justify-content: center; }
.device {
  container: app / inline-size;
  position: relative; width: 100%;
  height: min(820px, calc(100dvh - 170px)); min-height: 540px;
  overflow: hidden; border-radius: 14px; border: 1px solid var(--review-line); background: #0B0B12;
}
.device.is-phone { width: 390px; max-width: 100%; border: 10px solid #282833; border-radius: 34px; }
@media (max-width: 720px) {
  .device, .device.is-phone { width: 100%; border: 1px solid var(--review-line); border-radius: 12px; height: calc(100dvh - 150px); min-height: 460px; }
  .proto-seg.device-seg { display: none; }
  .proto-brand span { display: none; }
}
.proto-toast {
  position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 100;
  transform: translateX(-50%); max-width: calc(100% - 32px);
  background: #F0ECE6; color: #15161D; border-radius: 12px; padding: 10px 16px;
  font-size: 14px; line-height: 1.45; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
}

/* Temas del aplicativo */
.surface-dark {
  color-scheme: dark;
  --bg: #0B0B12; --bg-deep: #07070C; --surface: #13131D; --raised: #1B1B28; --sunken: #13131D;
  --hair: #2A2A3C; --control: #66667F; --field-bg: #1B1B28;
  --text: #F0ECE6; --text-2: #A9A7B3; --text-3: #8B8997;
  --accent: #E0873A; --accent-hover: #F0A35C; --on-accent: #120B06; --focus: #E0873A;
  --indigo: #4A57E0; --link: #9CA4F4; --thread: #E9C29A;
  --ok: #7CC49A; --warn: #E3C25C; --danger: #F28B82; --on-danger: #120B06;
  color: var(--text); background: var(--bg);
}
.surface-light {
  color-scheme: light;
  --bg: #F5F6F8; --bg-deep: #FFFFFF; --surface: #FFFFFF; --raised: #EEF0F3; --sunken: #EEF0F3;
  --hair: #E1E4E9; --control: #7A808D; --field-bg: #FFFFFF;
  --text: #15161D; --text-2: #525866;
  --accent: #9A4F12; --accent-hover: #7F410F; --on-accent: #FFFFFF; --focus: #9A4F12;
  --indigo: #4A57E0; --thread: #B8753A; --text-3: #5F6573;
  --link: #4A57E0; --untangle-ink: #9A4F12;
  --ok: #22704A; --warn: #8A5A00; --danger: #B3372E; --on-danger: #FFFFFF;
  color: var(--text); background: var(--bg);
}
.surface-dark { --untangle-ink: #E0873A; }
.surface-light.ins-ctx { --accent: var(--ins); --accent-hover: color-mix(in srgb, var(--ins) 84%, #000); --on-accent: #FFFFFF; --focus: var(--ins); }
.surface-dark.ins-ctx { --accent: var(--ins-dark); --accent-hover: color-mix(in srgb, var(--ins-dark) 82%, #fff); --on-accent: #0B0B12; --focus: var(--ins-dark); }
.ins-stonecroft { --ins: #2C5F68; --ins-dark: #7DB4BD; }
.ins-sunmeadow { --ins: #3A6B2A; --ins-dark: #A3CC86; }
.ins-knotwell { --ins: #6B3E8E; --ins-dark: #C4A3E4; }

.screen { position: relative; height: 100%; overflow-y: auto; overscroll-behavior: contain; font-family: var(--font-body); }
.screen.shell { overflow: hidden; display: flex; flex-direction: column; }
.screen :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.screen a { color: var(--link); text-underline-offset: 3px; }
.skip {
  position: absolute; left: 12px; top: -60px; z-index: 60; padding: 8px 14px; border-radius: 8px;
  background: var(--accent); color: var(--on-accent) !important; text-decoration: none; font-weight: 500;
}
.skip:focus { top: 8px; }

/* Escala tipográfica */
.t-caption { font-size: 0.75rem; line-height: 1.4; }
.t-small { font-size: 0.875rem; line-height: 1.45; }
.t-body { font-size: 1rem; line-height: 1.55; }
.t-lead { font-size: 1.2rem; line-height: 1.4; }
.t-title { font-size: 1.44rem; line-height: 1.25; font-weight: 500; text-wrap: balance; margin: 0; }
.t-figure { font-family: var(--font-display); font-weight: 300; font-size: 2.5rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.t-display { font-family: var(--font-display); font-weight: 300; font-size: 3rem; line-height: 1.05; letter-spacing: -0.02em; text-wrap: balance; margin: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 0.92em; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
h1, h2, h3 { margin: 0; }
h2.section-title { font-size: 1.2rem; line-height: 1.4; font-weight: 500; }
h3.sub { font-size: 1rem; font-weight: 500; }
p { margin: 0; }

/* Íconos con el trazo de Phosphor */
.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
.i-16 { width: 16px; height: 16px; }
.i-24 { width: 24px; height: 24px; }

/* Botones y campos */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 8px 20px; border-radius: 999px; border: 1px solid transparent;
  font-size: 1rem; font-weight: 500; line-height: 1.2; text-align: center; cursor: pointer; text-decoration: none;
  transition: background-color 160ms var(--ease-out), color 160ms var(--ease-out), border-color 160ms var(--ease-out), transform 120ms var(--ease-out);
}
.btn:active { transform: scale(0.97); }
.btn-sm { font-size: 0.875rem; padding: 6px 16px; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-secondary { background: transparent; color: var(--text); border-color: var(--control); }
.btn-danger { background: var(--danger); color: var(--on-danger); min-height: 48px; }
.btn-quiet { background: transparent; color: var(--link); padding-inline: 6px; border-radius: 8px; text-decoration: underline; text-underline-offset: 3px; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.55; cursor: not-allowed; transform: none; }
@media (hover: hover) and (pointer: fine) {
  .btn-primary:not([disabled]):hover { background: var(--accent-hover); }
  .btn-secondary:not([disabled]):hover { border-color: var(--text-2); background: color-mix(in srgb, var(--text) 6%, transparent); }
  .btn-quiet:hover { color: var(--text); }
}
.field-label { display: block; font-size: 0.875rem; color: var(--text-2); margin-bottom: 4px; }
.input, .select, .textarea {
  width: 100%; min-height: 44px; color: var(--text); background: var(--field-bg);
  border: 1px solid var(--control); border-radius: 8px; padding: 8px 12px; font-size: 1rem;
}
.textarea { resize: vertical; min-height: 88px; line-height: 1.5; }
.select { padding-right: 8px; }
.field-help { font-size: 0.875rem; color: var(--text-2); margin-top: 4px; }
.field-error { display: flex; gap: 6px; align-items: flex-start; font-size: 0.875rem; color: var(--danger); margin-top: 6px; }
.field-error .i { margin-top: 1px; }
.is-invalid { border-color: var(--danger); }

.tag {
  display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; border-radius: 8px;
  border: 1px solid var(--control); color: var(--text-2); font-size: 0.75rem; line-height: 1.6; white-space: nowrap;
}
.tag.ok { color: var(--ok); border-color: currentColor; }
.tag.warn { color: var(--warn); border-color: currentColor; }
.tag.bad { color: var(--danger); border-color: currentColor; }
.tag.info { color: var(--link); border-color: currentColor; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--text-3); }
.dot.ok { background: var(--ok); }
.dot.warn { background: var(--warn); }
.dot.bad { background: var(--danger); }
.dot.accent { background: var(--accent); }
.dot.indigo { background: var(--indigo); }

.inline-alert {
  display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px;
  border: 1px solid var(--hair); background: var(--surface); color: var(--text); font-size: 0.9375rem;
}
.inline-alert .i { margin-top: 2px; }
.inline-alert.warn { border-color: color-mix(in srgb, var(--warn) 55%, transparent); }
.inline-alert.warn .i { color: var(--warn); }
.inline-alert.bad { border-color: color-mix(in srgb, var(--danger) 60%, transparent); }
.inline-alert.bad .i { color: var(--danger); }
.inline-alert.ok .i { color: var(--ok); }

.skel { display: block; border-radius: 8px; background: linear-gradient(90deg, var(--raised), var(--surface), var(--raised)); background-size: 200% 100%; animation: skel 1.4s linear infinite; }
@keyframes skel { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* Barra superior de las superficies de Untangle */
.appbar {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 8px 20px; flex-wrap: wrap;
  padding: 8px 16px; min-height: 60px; background: var(--bg-deep); border-bottom: 1px solid var(--hair);
}
.brand { display: inline-flex; align-items: center; gap: 8px; color: var(--text) !important; text-decoration: none; font-weight: 500; min-height: 44px; }
.brand svg { width: 26px; height: 20px; color: var(--accent); }
.appbar-title { color: var(--text-2); font-size: 0.875rem; }
.appbar-end { margin-left: auto; display: flex; align-items: center; gap: 4px 16px; flex-wrap: wrap; }
.navlink { color: var(--text-2) !important; text-decoration: none; font-size: 0.875rem; min-height: 44px; display: inline-flex; align-items: center; padding: 0 4px; }
.navlink:hover { color: var(--text) !important; }
.langseg { display: inline-flex; border: 1px solid var(--control); border-radius: 999px; overflow: hidden; }
.langseg button { display: inline-flex; align-items: center; gap: 6px; background: transparent; color: var(--text-2); border: 0; min-width: 44px; min-height: 40px; padding: 0 12px; font-size: 0.875rem; cursor: pointer; }
.langseg .i { width: 16px; height: 16px; }
.langseg button[aria-pressed="true"] { background: var(--raised); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
.notice-band { padding: 8px 16px; font-size: 0.875rem; line-height: 1.45; background: var(--sunken); color: var(--text); border-bottom: 1px solid var(--hair); }
.surface-dark .notice-band { background: var(--surface); color: var(--text-2); }
.appfoot { display: flex; flex-wrap: wrap; gap: 4px 20px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--hair); background: var(--bg-deep); font-size: 0.875rem; color: var(--text-2); }
.appfoot a { color: var(--text-2); }

/* M1 Inicio */
.home-main { max-width: 1200px; margin: 0 auto; padding: 40px 16px 56px; display: grid; gap: 44px; }
.home-hero { display: grid; gap: 16px; max-width: 780px; }
.home-hero .t-display { font-size: 2.5rem; }
.availability { display: flex; gap: 10px; align-items: baseline; max-width: 64ch; }
.availability .dot { transform: translateY(1px); }
.ins-list { list-style: none; margin: 16px 0 0; padding: 0; border-top: 1px solid var(--hair); }
.ins-row { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px 14px; padding: 18px 0; border-bottom: 1px solid var(--hair); }
.ins-mono { width: 40px; height: 40px; }
.surface-dark .ins-row .ins-mono { color: var(--ins-dark); }
.surface-light .ins-row .ins-mono { color: var(--ins); }
.ins-name { font-size: 1.2rem; line-height: 1.3; font-weight: 500; }
.ins-char { font-size: 0.875rem; color: var(--text-2); margin-top: 2px; }
.ins-policy { grid-column: 2; display: grid; gap: 1px; font-size: 0.875rem; color: var(--text-2); }
.ins-policy .mono { color: var(--text); }
.ins-actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ins-reason { font-size: 0.875rem; color: var(--text-2); max-width: 26ch; }
.home-compare { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.try-list { margin: 12px 0 0; padding-left: 20px; display: grid; gap: 6px; color: var(--text); max-width: 60ch; }
.try-list li::marker { color: var(--accent); }
@container app (min-width: 768px) {
  .home-main { padding: 56px 32px 64px; }
  .home-hero .t-display { font-size: 3rem; }
  .ins-row { grid-template-columns: 48px minmax(0, 1.25fr) minmax(0, 1fr) auto; align-items: center; }
  .ins-mono { width: 48px; height: 48px; }
  .ins-policy { grid-column: auto; }
  .ins-actions { grid-column: auto; justify-content: flex-end; }
}

/* M2 Chat */
.chat-head { display: flex; align-items: center; gap: 10px; padding: 8px 16px; min-height: 60px; background: var(--surface); border-bottom: 1px solid var(--hair); }
.chat-head .ins-mono { width: 32px; height: 32px; color: var(--accent); }
.chat-ins { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.chat-ins strong { font-weight: 500; }
.sig { font-size: 0.75rem; color: var(--untangle-ink); }
.head-lang { margin-left: auto; display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 6px 10px; font-size: 0.875rem; color: var(--text-2); }
.chat-head { flex-wrap: wrap; }
.home-link { font-size: 0.875rem; color: var(--text-2) !important; min-height: 44px; display: inline-flex; align-items: center; }
.head-lang .select { width: auto; min-width: 7.5rem; }
.chat-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
.chat-aside { display: none; }
.chat-main { position: relative; min-height: 0; display: flex; flex-direction: column; }
.policy-toggle { border-bottom: 1px solid var(--hair); background: var(--surface); }
.policy-toggle > button { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 0 16px; border: 0; background: transparent; color: var(--text); font-size: 0.875rem; cursor: pointer; }
.policy-toggle .policy { padding: 0 16px 12px; }
.policy { display: grid; gap: 2px; font-size: 0.875rem; }
.policy .mono { font-size: 0.875rem; }
.chat-log { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; }
.chat-log-inner { width: 100%; max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.msg { display: flex; flex-direction: column; gap: 4px; max-width: 88%; }
.msg.agent { align-self: flex-start; }
.msg.person { align-self: flex-end; align-items: flex-end; }
.msg.wide { align-self: stretch; max-width: 100%; }
.msg.is-new { animation: fade-in 160ms var(--ease-out); }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.msg-author { font-size: 0.75rem; color: var(--text-2); }
.bubble { background: var(--surface); color: var(--text); border: 1px solid var(--hair); border-radius: 16px 16px 16px 4px; padding: 10px 14px; max-width: 62ch; }
.msg.person .bubble { background: var(--sunken); border-color: transparent; border-radius: 16px 16px 4px 16px; }
.msg.pending .bubble { opacity: 0.6; }
.bubble.degraded { display: flex; gap: 10px; }
.bubble.degraded .i { color: var(--warn); margin-top: 2px; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.source { margin-top: 10px; border: 1px solid var(--hair); border-radius: 12px; background: var(--bg); padding: 12px; }
.source-title { font-weight: 500; display: flex; gap: 8px; align-items: center; }
.source-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; font-size: 0.75rem; color: var(--text-2); align-items: center; }
.source-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.clause { margin-top: 10px; padding: 12px; border-radius: 8px; background: var(--sunken); max-width: 70ch; font-size: 0.9375rem; }
.clause-note { font-size: 0.75rem; color: var(--text-2); margin-bottom: 6px; }
.emergency { display: flex; gap: 12px; padding: 14px 16px; border: 2px solid var(--danger); border-radius: 12px; background: var(--surface); color: var(--text); }
.emergency .i { color: var(--danger); }
.emergency strong { display: block; font-weight: 500; }
.closure { border: 1px solid var(--hair); border-radius: 12px; background: var(--surface); padding: 16px; display: grid; gap: 8px; }
.closure-case { font-size: 0.875rem; color: var(--text-2); }
.closure-link { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 4px; }
.decision-note { display: flex; gap: 12px; border: 1px solid var(--hair); border-radius: 12px; background: var(--surface); padding: 14px 16px; }
.decision-note .i { color: var(--ok); margin-top: 2px; }
.decision-note q { display: block; margin-top: 2px; }
.sysline { align-self: center; text-align: center; font-size: 0.875rem; color: var(--text-2); max-width: 56ch; padding: 4px 0; }
.typing { display: flex; align-items: center; gap: 8px; font-size: 0.875rem; color: var(--text-2); }
.typing span.dots { display: inline-flex; gap: 3px; }
.typing span.dots i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: pulse 1.2s linear infinite; }
.typing span.dots i:nth-child(2) { animation-delay: 0.2s; }
.typing span.dots i:nth-child(3) { animation-delay: 0.4s; }
.eligibility { border: 1px solid var(--hair); border-radius: 12px; background: var(--surface); padding: 14px 16px; display: grid; gap: 6px; }
.composer { border-top: 1px solid var(--hair); background: var(--surface); padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); }
.composer-inner { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; align-items: end; }
.composer label { grid-column: 1 / -1; font-size: 0.75rem; color: var(--text-2); }
.composer textarea { resize: none; min-height: 44px; max-height: 120px; border-radius: 12px; }
.composer .hint { grid-column: 1 / -1; font-size: 0.75rem; color: var(--text-2); }
.composer .hint.bad { color: var(--danger); }
.aside-block { display: grid; gap: 8px; }
.aside-block + .aside-block { margin-top: 24px; }
.aside-list { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 0.875rem; }
@container app (min-width: 1024px) {
  .chat-body { grid-template-columns: 250px minmax(0, 1fr); }
  .chat-aside { display: block; overflow-y: auto; padding: 20px 16px; border-right: 1px solid var(--hair); }
  .policy-toggle { display: none; }
  .msg { max-width: 80%; }
}

/* M3 Traza */
.trace-scrim { position: absolute; inset: 0; z-index: 29; background: rgba(7, 7, 12, 0.5); }
.trace {
  position: absolute; z-index: 30; left: 0; right: 0; bottom: 0; height: 92%;
  display: flex; flex-direction: column; border-radius: 16px 16px 0 0;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35); border: 1px solid var(--hair);
  background: var(--bg); color: var(--text);
}
.trace.is-opening { animation: sheet-up 260ms var(--ease-drawer); }
@keyframes sheet-up { from { transform: translateY(100%); } to { transform: none; } }
@keyframes panel-in { from { transform: translateX(100%); } to { transform: none; } }
.trace-grip { width: 40px; height: 4px; border-radius: 4px; background: var(--control); margin: 8px auto 0; }
.trace-head { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--hair); }
.trace-head h2 { font-size: 1.2rem; line-height: 1.35; font-weight: 500; }
.icon-btn { margin-left: auto; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex: none; border-radius: 999px; border: 1px solid var(--control); background: transparent; color: var(--text); cursor: pointer; }
.trace-body { flex: 1; overflow-y: auto; padding: 16px; display: grid; gap: 20px; align-content: start; }
.trace-foot { padding: 12px 16px; border-top: 1px solid var(--hair); font-size: 0.75rem; color: var(--text-3); }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; font-size: 0.875rem; }
.kv dt { color: var(--text-2); }
.kv dd { margin: 0; text-align: right; }
.clause-list { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; }
.clause-list li { display: flex; justify-content: space-between; gap: 12px; font-size: 0.875rem; }
@container app (min-width: 768px) {
  .trace-scrim { display: none; }
  .trace { top: 0; left: auto; width: 440px; max-width: 100%; height: auto; border-radius: 0; border-width: 0 0 0 1px; }
  .trace.is-opening { animation-name: panel-in; }
  .trace-grip { display: none; }
}

/* Hilo del caso */
.thread { list-style: none; margin: 8px 0 0; padding: 0; }
.thread > li { position: relative; padding: 0 0 14px 30px; min-height: 30px; }
.thread > li::before { content: ""; position: absolute; left: 8px; top: 20px; bottom: 0; width: 2px; background: var(--hair); }
.thread > li:last-child { padding-bottom: 0; }
.thread > li:last-child::before { display: none; }
.thread > li.done::before { background: var(--thread); }
.thread > li.bg::before { background: var(--indigo); }
.node { position: absolute; left: 0; top: 2px; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--control); background: var(--bg); display: grid; place-items: center; transition: background-color 240ms var(--ease-out), border-color 240ms var(--ease-out); }
.node .i { width: 10px; height: 10px; stroke-width: 28; color: var(--on-accent); }
.done > .node { background: var(--accent); border-color: var(--accent); }
.current > .node { border-color: var(--accent); }
.bg > .node { border-color: var(--indigo); }
.node-row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.node-name { font-size: 0.9375rem; }
.node-token { display: block; font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-3); }
.node-state { font-size: 0.75rem; color: var(--text-2); }
.node-ms { font-family: var(--font-mono); font-size: 0.8125rem; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* M4 Consola */
.console-pre { flex: 1; overflow-y: auto; }
.console-pre-inner { max-width: 720px; margin: 0 auto; padding: 28px 16px 40px; display: grid; gap: 24px; }
.call-selects { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.policy-line { font-size: 0.9375rem; color: var(--text-2); }
.console-tabs { display: flex; border-bottom: 1px solid var(--hair); background: var(--bg-deep); }
.console-tabs button { flex: 1; min-height: 44px; background: transparent; border: 0; color: var(--text-2); font-size: 0.875rem; cursor: pointer; border-bottom: 2px solid transparent; }
.console-tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.console-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
.zone { min-height: 0; overflow-y: auto; padding: 16px; }
.zone h2 { font-size: 0.875rem; font-weight: 500; color: var(--text-2); margin-bottom: 8px; }
.zone.is-hidden-narrow { display: none; }
.side-block + .side-block { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--hair); }
.agent-state { display: flex; align-items: center; gap: 10px; font-size: 1rem; }
.agent-state.thinking .dot { animation: pulse 1.6s linear infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.latency { font-size: 0.875rem; color: var(--text-2); }
.latency .mono { color: var(--text); font-size: 1rem; }
.tline { display: grid; gap: 2px; padding: 8px 0; }
.tline .who { font-size: 0.875rem; font-weight: 500; }
.tline .when { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-3); margin-left: 8px; font-weight: 400; }
.tline.partial .txt { color: var(--text-2); }
.tline .txt { max-width: 70ch; }
.tmark { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--ok); padding: 2px 0 6px; }
.pii { font-family: var(--font-mono); font-size: 0.85em; padding: 0 4px; border-radius: 4px; background: var(--raised); color: var(--link); white-space: nowrap; }
.controlbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--bg-deep); border-top: 1px solid var(--hair); }
.remaining { font-size: 0.9375rem; color: var(--text-2); }
.remaining .mono { color: var(--text); font-size: 1.2rem; }
.controlbar .inline-alert { flex-basis: 100%; }
.call-end { max-width: 720px; margin: 0 auto; padding: 24px 16px 40px; display: grid; gap: 16px; }
.end-card { border: 1px solid var(--hair); border-radius: 12px; background: var(--surface); padding: 18px; display: grid; gap: 8px; }
.end-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center; }
@container app (min-width: 1024px) {
  .console-tabs { display: none; }
  .console-grid { grid-template-columns: minmax(0, 1fr) 340px; }
  .zone.is-hidden-narrow { display: block; }
  .zone + .zone { border-left: 1px solid var(--hair); background: color-mix(in srgb, var(--surface) 55%, var(--bg)); }
}

/* M5 Comparación */
.cmp-top { max-width: 1200px; margin: 0 auto; padding: 20px 16px; display: grid; gap: 12px; }
.ask { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; max-width: 760px; }
.ask label { grid-column: 1 / -1; }
.suggest { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 0.875rem; color: var(--text-2); }
.chip { min-height: 36px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--control); background: transparent; color: var(--text); font-size: 0.875rem; cursor: pointer; }
.cmp-cols { display: grid; grid-template-columns: minmax(0, 1fr); border-top: 1px solid var(--hair); }
.cmp-col { padding: 18px 16px; border-bottom: 1px solid var(--hair); display: grid; gap: 10px; align-content: start; }
.cmp-col-head { display: flex; gap: 10px; align-items: center; }
.cmp-col-head .ins-mono { width: 32px; height: 32px; }
.surface-dark .cmp-col-head .ins-mono { color: var(--ins-dark); }
.surface-light .cmp-col-head .ins-mono { color: var(--ins); }
.cmp-answer { font-size: 1rem; max-width: 60ch; }
.src-row { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 0.8125rem; color: var(--text-2); }
.cmp-col .clause { background: var(--surface); }
@container app (min-width: 1024px) {
  .cmp-top { padding: 24px 32px; }
  .cmp-cols { grid-template-columns: repeat(3, minmax(0, 1fr)); padding-inline: 16px; }
  .cmp-col { border-bottom: 0; }
  .cmp-col + .cmp-col { border-left: 1px solid var(--hair); }
  .cmp-answer { font-size: 1.2rem; line-height: 1.4; }
}

/* M6 Bandeja */
.inbox { max-width: 1200px; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 16px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--hair); }
.tabs button { min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: var(--text-2); font-size: 0.9375rem; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tabs .count { font-family: var(--font-mono); font-size: 0.8125rem; margin-left: 6px; color: var(--text-3); }
.filters { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
.filters .f { display: grid; min-width: 140px; }
.result-count { font-size: 0.875rem; color: var(--text-2); }
.table-wrap { overflow-x: auto; border: 1px solid var(--hair); border-radius: 12px; display: none; }
table.cases { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
.cases th { text-align: left; font-weight: 500; color: var(--text-2); padding: 10px 12px; border-bottom: 1px solid var(--hair); white-space: nowrap; background: var(--surface); }
.cases td { padding: 12px; border-bottom: 1px solid var(--hair); vertical-align: top; }
.cases tr:last-child td { border-bottom: 0; }
.cases tbody tr { cursor: pointer; }
@media (hover: hover) and (pointer: fine) { .cases tbody tr:hover td { background: var(--surface); } }
.case-link { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--link); }
.prio { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.prio.high { color: var(--warn); }
.sub-line { display: block; color: var(--text-2); font-size: 0.8125rem; margin-top: 2px; }
.case-cards { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--hair); }
.case-cards li { padding: 12px 0; border-bottom: 1px solid var(--hair); display: grid; gap: 4px; }
.case-cards .top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.empty { padding: 28px 16px; border: 1px dashed var(--control); border-radius: 12px; display: grid; gap: 10px; justify-items: start; color: var(--text-2); }
@container app (min-width: 768px) {
  .table-wrap { display: block; }
  .case-cards { display: none; }
  .inbox { padding: 24px 32px 48px; }
}

/* M7 y M8 Vista de caso */
.case-head { position: sticky; top: 0; z-index: 10; background: var(--bg-deep); border-bottom: 1px solid var(--hair); padding: 10px 16px 14px; }
.case-head-grid { max-width: 1200px; margin: 0 auto; display: grid; gap: 6px 24px; }
.back { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; color: var(--text-2) !important; text-decoration: none; font-size: 0.875rem; }
.case-title { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.case-title h1 { font-size: 1.44rem; line-height: 1.25; font-weight: 500; }
.case-reason { font-size: 1rem; }
.case-facts { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 0.875rem; color: var(--text-2); align-items: center; }
.case-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
.mini-thread { display: inline-flex; gap: 3px; align-items: center; margin-left: 6px; vertical-align: middle; }
.mini-thread i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--control); }
.mini-thread i.on { background: var(--accent); border-color: var(--accent); }
.case-extra { display: none; }
.decision-form { max-width: 1200px; margin: 0 auto; padding: 16px; }
.decision-form form, .decision-result { border: 1px solid var(--hair); border-radius: 12px; background: var(--surface); padding: 16px; display: grid; gap: 10px; max-width: 760px; }
.form-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.evidence { max-width: 1200px; margin: 0 auto; padding: 8px 16px 40px; display: grid; gap: 12px; }
.ev-top { display: grid; gap: 12px; }
.ev { background: var(--surface); border: 1px solid var(--hair); border-radius: 12px; }
.ev h2 { font-size: 1rem; }
.ev-toggle { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 8px 16px; border: 0; border-radius: 12px; background: transparent; color: var(--text); text-align: left; cursor: pointer; font-size: 1rem; font-weight: 500; }
.ev-toggle .i { transition: transform 200ms var(--ease-out); }
.ev-toggle[aria-expanded="true"] .i { transform: rotate(90deg); }
.ev-summary { font-weight: 400; color: var(--text-2); }
.ev-body { padding: 0 16px 16px; display: grid; gap: 8px; }
.fields { list-style: none; margin: 0; padding: 0; }
.field-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--hair); }
.field-row:first-child { border-top: 0; }
.field-name { font-size: 0.875rem; color: var(--text-2); }
.field-val { grid-column: 1; }
.field-side { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 6px; align-items: center; }
.field-edit { grid-column: 1 / -1; display: grid; gap: 6px; margin-top: 6px; }
.history { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 0.875rem; }
.history .mono { color: var(--text-3); margin-right: 8px; }
.check-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 0.9375rem; }
.check-list li { display: flex; gap: 8px; align-items: flex-start; }
.check-list .i { color: var(--ok); margin-top: 2px; }
.link-band { background: color-mix(in srgb, var(--accent) 10%, var(--bg-deep)); border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, var(--hair)); }
.link-band-inner { max-width: 1200px; margin: 0 auto; padding: 14px 16px; display: grid; gap: 8px; }
.link-band blockquote { margin: 0; padding: 8px 12px; border-radius: 8px; background: var(--surface); }
@container app (min-width: 768px) {
  .case-head { padding: 10px 32px 16px; }
  .case-head-grid { grid-template-columns: minmax(0, 1fr) auto; }
  .case-head-grid > .back { grid-column: 1 / -1; }
  .case-actions { grid-column: 2; grid-row: 2 / span 3; justify-content: flex-end; }
  .case-extra { display: flex; }
  .evidence, .decision-form { padding-inline: 32px; }
  .link-band-inner { padding-inline: 32px; }
}
@container app (min-width: 1024px) {
  .ev-top { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
}

/* M9 y M10 Paneles */
.panel { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 0; }
.panel-intro { max-width: 64ch; color: var(--text-2); margin-bottom: 20px; }
.metric { display: grid; gap: 8px 32px; padding: 20px 0; border-top: 1px solid var(--hair); }
.metric h2 { font-size: 1.2rem; font-weight: 500; line-height: 1.35; }
.figs { display: flex; flex-wrap: wrap; gap: 12px 40px; align-items: flex-end; }
.fig { display: grid; }
.fig-lang { font-size: 0.875rem; color: var(--text-2); }
.metric-meta { font-size: 0.8125rem; color: var(--text-3); display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.lat-table { width: 100%; border-collapse: collapse; font-size: 0.9375rem; }
.lat-table th { text-align: left; font-weight: 500; color: var(--text-2); font-size: 0.8125rem; padding: 4px 16px 8px 0; }
.lat-table td { padding: 8px 16px 8px 0; border-top: 1px solid var(--hair); vertical-align: top; }
.lat-table .mono { font-size: 0.9375rem; }
.not-measured { color: var(--warn); }
.counts { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.counts li { display: flex; justify-content: space-between; gap: 16px; max-width: 420px; }
.spend-head { display: grid; gap: 10px; padding-bottom: 24px; }
.meter { position: relative; height: 12px; border-radius: 999px; background: var(--raised); margin-top: 10px; max-width: 760px; }
.meter-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--accent); }
.meter-fill.over { background: var(--warn); }
.meter-fill.full { background: var(--danger); }
.meter-mark { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--text); }
.meter-legend { position: relative; max-width: 760px; height: 20px; font-size: 0.75rem; color: var(--text-2); }
.meter-legend span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.status-line { display: flex; gap: 10px; align-items: baseline; }
.money-table { width: 100%; max-width: 760px; border-collapse: collapse; font-size: 0.9375rem; }
.money-table th { text-align: left; font-weight: 500; color: var(--text-2); font-size: 0.8125rem; padding: 4px 12px 8px 0; }
.money-table th.num, .money-table td.num { text-align: right; }
.money-table td { padding: 8px 12px 8px 0; border-top: 1px solid var(--hair); }
.hist { display: grid; gap: 6px; max-width: 560px; margin-top: 10px; }
.hist-row { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr) 4.5rem; gap: 10px; align-items: center; font-size: 0.8125rem; color: var(--text-2); }
.hist-bar { height: 10px; border-radius: 3px; background: var(--indigo); }
.hist-row .mono { text-align: right; color: var(--text); }
@container app (min-width: 768px) {
  .panel { padding: 32px 32px 56px; }
  .metric { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.4fr); }
  .metric > .metric-meta { grid-column: 2; }
}

/* M11 Estados */
.status { min-height: 100%; display: grid; align-items: center; padding: 32px 16px; }
.status-card { width: 100%; max-width: 520px; margin: 0 auto; display: grid; gap: 12px; }
.status-card .btn { justify-self: start; margin-top: 8px; }
.wake { position: relative; height: 2px; margin-top: 12px; background: var(--hair); overflow: hidden; border-radius: 2px; }
.wake::after { content: ""; position: absolute; top: 0; left: 0; width: 38%; height: 2px; background: linear-gradient(90deg, transparent, var(--thread)); animation: wake 1.9s var(--ease-inout) infinite; }
.wake-dot { position: absolute; right: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--thread); }
@keyframes wake { from { transform: translateX(-100%); } to { transform: translateX(270%); } }
.wake-text { display: none; font-size: 0.875rem; color: var(--text-2); }

@media (prefers-reduced-motion: reduce) {
  .btn:active { transform: none; }
  .trace.is-opening { animation: fade-in 160ms var(--ease-out); }
  .msg.is-new { animation: none; }
  .agent-state.thinking .dot, .typing span.dots i, .skel { animation: none; }
  .wake::after { animation: none; display: none; }
  .wake { display: none; }
  .wake-text { display: block; }
  .node, .ev-toggle .i { transition: none; }
}

/* Ajustes */
.clause p + .clause-note { margin-top: 10px; }
.screen.case .appbar { position: relative; }

/* Revisión 1: uso sin contexto */
.how { display: grid; gap: 10px; }
.how ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; counter-reset: how; max-width: 64ch; }
.how li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: baseline; counter-increment: how; }
.how li::before { content: counter(how); font-family: var(--font-mono); font-size: 0.875rem; color: var(--untangle-ink); text-align: right; }
.hint-line { font-size: 0.875rem; color: var(--text-2); margin-top: 6px; max-width: 70ch; }
.suggest-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chan { font-size: 0.75rem; color: var(--text-2); }
.link-steps { margin: 4px 0 0; padding-left: 22px; display: grid; gap: 2px; }

</style>
</head>
<body>
<div class="proto">
  <header class="proto-bar" aria-label="Revisión de la maqueta">
    <div class="proto-brand"><span id="proto-logo" aria-hidden="true"></span><span>Maqueta de Untangle</span></div>
    <label class="proto-field">Pantalla <select id="proto-screen"></select></label>
    <label class="proto-field">Estado <select id="proto-state"></select></label>
    <label class="proto-field" id="proto-ins-wrap">Aseguradora <select id="proto-ins"></select></label>
    <div class="proto-seg device-seg" role="group" aria-label="Vista">

      <button type="button" data-device="phone" aria-pressed="false">Teléfono</button>
    </div>
    <div class="proto-seg" role="group" aria-label="Idioma de los textos">
      <button type="button" data-lang="es" lang="es" aria-pressed="true">Español</button>
      <button type="button" data-lang="en" lang="en" aria-pressed="false">English</button>

</div>
<div class="proto-toast" id="proto-toast" role="status" hidden></div>

<script>
(function () {
'use strict';
/* ---------- Utilidades ---------- */
const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const reducedMotion = () => Boolean(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const fill = (text, vars) => String(text).replace(/\{(\w+)\}/g, (_, key) => (vars && key in vars ? vars[key] : `{${key}}`));
const timers = new Set();
const later = (fn, ms) => { const id = setTimeout(() => { timers.delete(id); fn(); }, ms); timers.add(id); return id; };

        : `<span>${t.policyLabel} <span class="mono">${d.policy}</span></span><span>${d.holder}</span><span>${d.vehicle}</span>`;
      let call;
      if (sub === 'available') call = `<button type="button" class="btn btn-secondary" data-go="m4:before:${id}">${icon('phone')}<span>${t.call}</span></button>`;
      else if (sub === 'error') call = `<button type="button" class="btn btn-secondary" disabled aria-describedby="voice-line">${icon('phone')}<span>${t.call}</span></button>`;
      else call = `<span class="ins-reason">${t.reason[sub]}</span>`;
      return `<li class="ins-row ins-${id}">
        ${mono(id)}
        <div><h3 class="ins-name">${d.name}</h3><p class="ins-char">${t.character[id]}</p></div>
        <div class="ins-policy">${policy}</div>
        <div class="ins-actions"><button type="button" class="btn btn-primary" data-go="m2:fresh:${id}">${icon('chat')}<span>${t.openChat}</span></button>${call}</div>
      </li>`;
    }).join('');
  return `<div class="screen ${surf()} home" lang="${state.lang}">
    ${skip()}
    ${appbar('', `<nav aria-label="Untangle"><a class="navlink" href="#" data-go="m9:measured">${cm.metrics}</a> <a class="navlink" href="#" data-go="m10:normal">${cm.spend}</a> <a class="navlink" href="#" data-note>${cm.readme}</a></nav>`)}
    <main id="main-content" class="home-main" tabindex="-1">
      <section class="home-hero">
        <h1 class="t-display">${t.title}</h1>
        <p class="t-lead muted">${t.intro}</p>
        <p class="availability" id="voice-line" role="status"><span class="dot ${dot}"></span><span>${t.voice[sub]}</span></p>
      </section>
      <section class="how" aria-labelledby="how-title">
        <h2 id="how-title" class="section-title">${t.howTitle}</h2>
        <ol>${t.howSteps.map((step) => `<li>${step}</li>`).join('')}</ol>
      </section>
      <section aria-labelledby="choose-title">
        <h2 id="choose-title" class="section-title">${t.choose}</h2>
        <p class="hint-line">${t.firstTime}</p>
        <ul class="ins-list">${rows}</ul>
      </section>
      <div class="home-compare">
        <button type="button" class="btn btn-secondary" data-go="m5:answered">${t.compare}</button>
        <p class="t-small muted">${t.compareNote}</p>
      </div>
      <section aria-labelledby="try-title">
        <h2 id="try-title" class="section-title">${t.tryTitle}</h2>
        <ul class="try-list">${t.tryItems.map((item) => `<li>${item}</li>`).join('')}</ul>
      </section>
    </main>
    <footer class="appfoot"><span>${cm.footer}</span><a href="#" data-note>${cm.video}</a><a href="#" data-note>${cm.landing}</a></footer>
  </div>`;
}

/* ---------- M2 Chat, M3 Traza y M12 Cotización ---------- */
const AGENT_KINDS = ['agent', 'disclosure', 'readback', 'cited', 'noclause', 'verifyfail', 'degraded'];

function chatScript(sub) {
  const t = c().chat;
  const ins = state.ins;
  const opening = [{ k: 'disclosure' }];
  const cited = [{ k: 'person', text: t.rentalQ }, { k: 'agent', text: t.safetyQ }, { k: 'person', text: t.allGood }, { k: 'cited', text: t.rentalA[ins] }];
  const scripts = {
    fresh: opening,
    cited: [...opening, ...cited],
    complete: [...opening, ...cited], recording: [...opening, ...cited], loading: [...opening, ...cited],
    readback: [...opening, { k: 'person', text: t.whereQ }, { k: 'readback', text: t.readback, open: true }],
    emergency: [...opening, { k: 'person', text: t.hurt }, { k: 'emergency' }, { k: 'agent', text: t.afterEmergency }],
    closure: [...opening, { k: 'person', text: t.thatsAll }, { k: 'closure' }, { k: 'agent', text: t.goodbye }, { k: 'decision' }],
    noclause: [...opening, { k: 'person', text: t.rimsQ }, { k: 'noclause', text: t.noClause }],
    verifyfail: [...opening, { k: 'person', text: t.hailQ }, { k: 'verifyfail', text: t.verifyFail }],
    degraded: [...opening, { k: 'person', text: t.degradedQ }, { k: 'degraded', text: t.degraded }],
    limit: [...opening, ...cited, { k: 'sys', text: t.limitSys }],
    resume: [...opening, { k: 'agent', text: t.resume }],
    resumeVoice: [
      { k: 'agent', text: t.voiceA0, ch: 'voice' }, { k: 'person', text: t.voiceP1, ch: 'voice' }, { k: 'agent', text: t.voiceA1, ch: 'voice' },
      { k: 'sys', text: t.resumeSys },
      { k: 'disclosure', ch: 'chat' }, { k: 'person', text: fill(t.resumeP1, { n: INS[ins].caseNo }), ch: 'chat' }, { k: 'agent', text: t.resumeA1, ch: 'chat' },
      { k: 'person', text: INS[ins].policy, ch: 'chat' }, { k: 'agent', text: t.resumeDone, ch: 'chat' },
    ],
    foreign: [...opening, { k: 'person', text: fill(t.foreignQ, { n: ins === 'stonecroft' ? 'SMA-731045' : 'SMU-482913' }) }, { k: 'agent', text: t.foreignA }],
    reset: [{ k: 'sys', text: t.resetSys }, ...opening],
    eligible: [...opening, { k: 'person', text: t.quoteQ }, { k: 'agent', text: t.quoteLicense }, { k: 'person', text: t.quoteYears }, { k: 'agent', text: t.quoteClaims }, { k: 'person', text: t.quoteNo }, { k: 'eligibility' }],
    off: [...opening, { k: 'person', text: t.quoteQ }, { k: 'agent', text: fill(t.quoteOff, { ins: INS[ins].name }) }],
  };
  return (scripts[sub] || scripts.cited).map((m) => ({ ...m }));
}

function initChat() {
  const sub = state.sub;
  state.chat = {
    msgs: chatScript(sub), expanded: new Set(), draft: sub === 'degraded' ? c().chat.degradedQ : '',
    sending: false, limit: sub === 'limit', policyOpen: false,
    traceOpen: state.screen === 'm3', traceState: state.screen === 'm3' ? sub : 'complete', traceAnim: false,
    scrollEnd: true, toldProto: false,
  };
}

function sourceCard(idx) {
  const t = c().chat;
  const cl = CLAUSES[state.ins];
  const open = state.chat.expanded.has(idx);
  const cross = cl.lang !== state.lang;
  const clauseId = `clause-${idx}`;
  return `<div class="source" role="group" aria-label="${fill(t.clauseAria, { id: cl.id, v: cl.version })}">
    <p class="source-title">${icon('file', 'i-16')}<span>${cl.title[state.lang]}</span></p>
    <p class="source-meta"><span class="mono">${cl.id}</span><span>${t.version} <span class="mono">${cl.version}</span></span><span class="tag ok">${t.current}</span></p>
    <div class="source-actions">
      <button type="button" class="btn btn-secondary btn-sm" data-act="clause" data-i="${idx}" aria-expanded="${open}" aria-controls="${clauseId}">${open ? t.hideClause : t.viewClause}</button>
      <button type="button" class="btn btn-quiet btn-sm" data-act="trace-open" id="trace-trigger-${idx}">${icon('path', 'i-16')}<span>${t.howAnswer}</span></button>
    </div>
    <div class="clause" id="${clauseId}"${open ? '' : ' hidden'}>
      ${cross ? `<p class="clause-note">${t.originalIn}</p>` : ''}
      <p lang="${cl.lang}">${cl.text}</p>
      ${cross ? `<p class="clause-note">${t.summaryOf}</p><p>${cl.summary[state.lang]}</p>` : ''}
    </div>
  </div>`;
}

function renderMsg(m, i, msgs) {
  const t = c().chat;
  const fresh = m.isNew ? ' is-new' : '';
  const lang = `lang="${state.lang}"`;
  const chan = m.ch ? `<span class="chan">${m.ch === 'voice' ? t.byVoice : t.byChat}</span>` : '';
  if (m.k === 'person') {
    return `<article class="msg person${m.pending ? ' pending' : ''}${fresh}" aria-label="${t.personName}" ${lang}><div class="bubble">${esc(m.text)}</div>${chan}</article>`;
  }
  if (m.k === 'suggest') {
    return `<div class="msg wide" role="group" aria-label="${t.suggestLabel}"><span class="msg-author">${t.suggestLabel}</span><div class="suggest-row">${t.suggestions.map((text, i) => `<button type="button" class="chip" data-act="suggest" data-i="${i}">${text}</button>`).join('')}</div></div>`;
  }
  if (m.k === 'sys') return `<p class="sysline${fresh}" ${lang}>${m.text}</p>`;
  if (m.k === 'typing') return `<div class="typing" role="status">${t.typing}<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></div>`;
  if (m.k === 'emergency') {
    return `<div class="msg wide${fresh}" role="alert" ${lang}><div class="emergency">${icon('octagon', 'i-24')}<div><strong>${t.emergencyTitle}</strong><span>${t.emergencyText}</span></div></div></div>`;
  }
  if (m.k === 'closure') {
    const d = INS[state.ins];
    return `<article class="msg wide${fresh}" aria-label="${t.agentName}" ${lang}><div class="closure">
      <p>${fill(t.closureSummary, { vehicle: d.vehicle || (state.lang === 'es' ? 'vehículo' : 'car') })}</p>
      <p>${t.closureNext}</p>
      <p class="closure-case">${t.caseLabel} <span class="mono">${d.caseNo}</span></p>
      <div class="closure-link"><button type="button" class="btn btn-primary" data-go="m8:enter" aria-describedby="link-exp-${i}">${t.reviewLink}</button><span class="t-small muted" id="link-exp-${i}">${t.linkExpires}</span></div>
    </div></article>`;
  }
  if (m.k === 'decision') {
    return `<div class="msg wide${fresh}" role="status" ${lang}><div class="decision-note">${icon('checkCircle')}<div><strong>${t.decisionTitle}</strong><q>${t.decisionComment}</q><span class="t-small muted">${t.caseLabel} <span class="mono">${INS[state.ins].caseNo}</span></span></div></div></div>`;
  }
  if (m.k === 'eligibility') {
    return `<article class="msg wide${fresh}" aria-label="${t.agentName}" ${lang}><div class="eligibility">
      <strong>${t.eligibleTitle}</strong><span>${t.eligibleBand}</span><span>${t.eligibleCondition}</span><span class="t-small muted">${t.noPrices}</span>
    </div></article>`;
  }
  const prev = msgs[i - 1];
  const first = !(prev && AGENT_KINDS.includes(prev.k));
  let content = m.k === 'disclosure' ? fill(t.disclosure, { ins: INS[state.ins].name }) : esc(m.shown ?? m.text);
  const degraded = m.k === 'verifyfail' || m.k === 'degraded';
  if (degraded) content = `${icon('warning')}<span>${content}</span>`;
  if (m.k === 'cited' && m.shown === undefined) content = `<p>${content}</p>${sourceCard(i)}`;
  const quick = m.k === 'readback' && m.open
    ? `<div class="quick"><button type="button" class="btn btn-secondary btn-sm" data-act="readback" data-v="yes">${t.yesCorrect}</button><button type="button" class="btn btn-secondary btn-sm" data-act="readback" data-v="fix">${t.fix}</button></div>`
    : '';
  return `<article class="msg agent${fresh}" aria-label="${t.agentName}" ${lang}>
    ${first ? `<span class="msg-author">${t.agentName}</span>` : ''}
    <div class="bubble${degraded ? ' degraded' : ''}">${content}</div>${quick}${chan}
  </article>`;
}

function policyCard() {
  const d = INS[state.ins];
  const t = c().chat;
  return `<div class="policy"><span class="mono">${d.policy}</span>${d.holder ? `<span>${d.holder}</span>` : ''}${d.vehicle ? `<span>${d.vehicle}</span>` : ''}${d.issuer ? `<span>${t.issuer} ${d.issuer}</span>` : ''}<span class="t-small muted" style="margin-top:4px">${t.policyHint}</span></div>`;
}

function renderTrace() {
  const tr = c().trace;
  const ch = state.chat;
  const narrow = deviceWidth() < 768;
  const retrieved = state.ins === 'stonecroft' ? [['SMU-PAP-D-3.1', '2026.1'], ['SMU-END-07', '2025.2']] : [['SMA-PAP-D-3.1', '2026.1'], ['SMA-END-04', '2025.2']];
  const cl = CLAUSES[state.ins];
  const skeleton = `<div aria-hidden="true" style="display:grid;gap:12px"><span class="skel" style="height:20px;width:40%"></span><span class="skel" style="height:44px"></span><span class="skel" style="height:44px"></span><span class="skel" style="height:44px"></span></div>`;
  let body;
  if (ch.traceState === 'loading') body = `<p class="sr-only" role="status">${tr.loading}</p>${skeleton}`;
  else if (ch.traceState === 'recording') body = `<div class="inline-alert" role="status">${icon('clock')}<span>${tr.recording}</span></div>${skeleton}`;
  else {
    body = `<section><h3 class="sub">${tr.route}</h3><ol class="thread">${tr.nodes.map(([name, token, ms]) => `<li class="done"><span class="node">${icon('check')}</span><div class="node-row"><span><span class="node-name">${name}</span><span class="node-token">${token}</span></span><span class="node-ms">${ms}</span></div><span class="sr-only">${tr.confirmed}</span></li>`).join('')}</ol></section>
      <section><h3 class="sub">${tr.clauses}</h3>
        <p class="t-small muted" style="margin-top:6px">${tr.cited}</p><ul class="clause-list"><li><span class="mono">${cl.id}</span><span class="mono">${cl.version}</span></li></ul>
        <p class="t-small muted" style="margin-top:10px">${tr.retrieved}</p><ul class="clause-list">${retrieved.map(([id, v]) => `<li><span class="mono">${id}</span><span class="mono">${v}</span></li>`).join('')}</ul>
      </section>
      <dl class="kv"><dt>${tr.total}</dt><dd class="mono">${tr.totalValue}</dd><dt>${tr.cost}</dt><dd class="mono">${tr.costValue}</dd></dl>`;
  }
  return `${narrow ? '<div class="trace-scrim" data-act="trace-close"></div>' : ''}
  <section class="trace${ch.traceAnim ? ' is-opening' : ''}" role="dialog" aria-modal="${narrow}" aria-labelledby="trace-title" lang="${state.lang}">
    <div class="trace-grip" aria-hidden="true"></div>
    <div class="trace-head"><div><h2 id="trace-title" tabindex="-1">${tr.title}</h2><p class="t-small" style="margin-top:2px">${tr.intro}</p><p class="t-small muted">${tr.answerAt} ${tr.redacted}</p></div>
      <button type="button" class="icon-btn" data-act="trace-close" aria-label="${c().common.close}">${icon('x')}</button></div>
    <div class="trace-body">${body}</div>
    <p class="trace-foot">${tr.foot}</p>
  </section>`;
}

function renderChat() {
  if (!state.chat) initChat();
  const t = c().chat;
  const ch = state.chat;
  const d = INS[state.ins];
  const msgs = ch.msgs.some((m) => m.k === 'person') ? ch.msgs : [...ch.msgs, { k: 'suggest' }];
  return `<div class="screen shell ${surf()} ins-ctx ins-${state.ins}" lang="${state.lang}">
    ${skip()}
    <header class="chat-head">${mono(state.ins)}<div class="chat-ins"><strong>${d.name}</strong><span class="sig">${t.withUntangle}</span></div>
      <div class="head-lang"><a class="home-link" href="#" data-go="m1:available">${c().common.homeLink}</a>${langSeg()}${themeSeg()}</div>
    </header>
    <div class="notice-band" role="note">${t.notice}</div>
    <div class="chat-body">
      <aside class="chat-aside" aria-label="${t.samplePolicy}">
        <div class="aside-block"><h2 class="t-small muted">${t.samplePolicy}</h2>${policyCard()}</div>
        <div class="aside-block"><h2 class="t-small muted">${t.tryTitle}</h2><ul class="aside-list">${t.tryItems.map((x) => `<li>${x}</li>`).join('')}</ul></div>
      </aside>
      <main class="chat-main" id="main-content" tabindex="-1">
        <div class="policy-toggle">
          <button type="button" data-act="policy" aria-expanded="${ch.policyOpen}" aria-controls="policy-panel">${icon(ch.policyOpen ? 'caretDown' : 'caretRight', 'i-16')}<span>${t.samplePolicy}</span></button>
          <div id="policy-panel"${ch.policyOpen ? '' : ' hidden'}>${policyCard()}</div>
        </div>
        <div class="chat-log" data-scroll="chat-log" role="log" aria-label="${t.logLabel}">
          <div class="chat-log-inner">${msgs.map((m, i, all) => renderMsg(m, i, all)).join('')}</div>
        </div>
        ${composer()}
      </main>
    </div>
    ${ch.traceOpen ? renderTrace() : ''}
  </div>`;
}

function composer() {
  const t = c().chat;
  const ch = state.chat;
  const off = ch.limit;
  return `<form class="composer" data-form="chat" novalidate><div class="composer-inner">
    <label for="chat-input">${t.composerLabel}</label>
    <textarea id="chat-input" class="textarea" rows="1" maxlength="600" aria-describedby="composer-hint"${off ? ' disabled' : ''}>${esc(ch.draft)}</textarea>
    <button class="btn btn-primary" type="submit"${off || ch.sending ? ' disabled' : ''}>${icon('send')}<span>${ch.sending ? t.sending : t.send}</span></button>
    <p class="hint${off ? ' bad' : ''}" id="composer-hint">${off ? t.limitComposer : t.composerHint}</p>
  </div></form>`;
}

/* ---------- M4 Consola de llamada ---------- */
const BLOCK_KEYS = ['identity', 'what', 'when', 'place', 'vehicle', 'others', 'injuries'];
const CALL_EVENTS = [
  [0, (s) => { s.agent = 'speaking'; s.lines.push({ who: 'agent', t: '0:00', key: 'opening' }); }],
  [3200, (s) => { s.lines.push({ mark: true, t: '0:09' }); s.agent = 'listening'; }],
  [4600, (s) => { s.lines.push({ who: 'person', t: '0:11', key: 'p1' }); s.agent = 'thinking'; s.blocks.what = 'current'; }],
  [5400, (s) => { s.latency = 612; s.agent = 'speaking'; s.lines.push({ who: 'agent', t: '0:14', key: 'a1' }); }],
  [7200, (s) => { s.agent = 'listening'; }],
  [8600, (s) => { s.lines.push({ who: 'person', t: '0:19', key: 'p2' }); s.blocks.identity = 'done'; s.blocks.what = 'done'; s.blocks.when = 'current'; s.bg = true; }],
  [9400, (s) => { s.partial = 'partial'; }],
];

function callLangFor(ins) { return INS[ins].lang || state.lang; }

function initCall() {
  const sub = state.sub;
  const phase = { before: 'before', connecting: 'connecting', incall: 'incall', backup: 'incall', last30: 'incall', dropped: 'dropped', ended: 'ended', decided: 'ended', unavailable: 'unavailable', mic: 'mic' }[sub] || 'before';
  const call = {
    phase, lang: callLangFor(state.ins), backup: sub === 'backup', decided: sub === 'decided',
    remaining: sub === 'last30' ? 30 : 134, lines: [], partial: null, agent: 'listening', latency: null,
    blocks: Object.fromEntries(BLOCK_KEYS.map((k) => [k, 'pending'])), bg: false, tab: 'conversation', live: false,
  };
  if (phase === 'incall') CALL_EVENTS.forEach(([, apply]) => apply(call));
  state.call = call;
}

function piiTag(type) {
  const label = PII_LABEL[state.lang][type];
  const redacted = state.lang === 'es' ? 'redactado' : 'redacted';
  return `<span class="pii"><span aria-hidden="true">[${label}]</span><span class="sr-only">${label} ${redacted}</span></span>`;
}
function talk(key) {
  const call = state.call;
  const raw = fill(CALL_TALK[call.lang][key], { ins: INS[state.ins].name });
  return raw.replace(/\{pii:(\w+)\}/g, (_, type) => piiTag(type));
}
const clock = (secs) => `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;

function renderConsole() {
  if (!state.call) initCall();
  const t = c().console;
  const call = state.call;
  const d = INS[state.ins];
  const insOptions = INSURER_IDS.map((id) => `<option value="${id}"${id === state.ins ? ' selected' : ''}>${INS[id].name}</option>`).join('');
  const langOptions = ['en', 'es'].map((l) => `<option value="${l}" lang="${l}"${call.lang === l ? ' selected' : ''}>${c().common[l]}</option>`).join('');
  const policy = `${fill(t.policyLine, { policy: d.policy })}${d.holder ? `, ${d.holder}, ${d.vehicle}` : `, ${t.policyIssued}`}`;
  const open = (inner) => `<div class="screen shell ${surf()}" lang="${state.lang}">${skip()}${inner}<p class="sr-only" role="status" id="call-announce"></p></div>`;

  if (['before', 'unavailable', 'mic', 'connecting'].includes(call.phase)) {
    let body;
    if (call.phase === 'connecting') {
      body = `<section class="end-card"><h1 class="t-title" role="status">${t.connecting}</h1><div class="end-actions"><button type="button" class="btn btn-secondary" id="call-cancel" data-act="call-cancel">${t.cancel}</button></div></section>`;
    } else if (call.phase === 'unavailable') {
      body = `<section><h1 class="t-title">${t.unavailableTitle}</h1><p class="muted" style="margin-top:6px">${t.unavailableText}</p></section>
        <div><button type="button" class="btn btn-primary" data-go="m2:fresh:${state.ins}">${icon('chat')}<span>${fill(t.goChat, { ins: d.name })}</span></button></div>`;
    } else {
      const mic = call.phase === 'mic'
        ? `<div class="inline-alert bad" role="alert">${icon('mic')}<div><strong>${t.micTitle}</strong><p class="t-small">${t.micText}</p></div></div>`
        : `<section><h1 class="t-title">${t.availableTitle}</h1><p class="muted" style="margin-top:6px">${t.availableText}</p></section>`;
      body = `${mic}
        <div class="call-selects">
          <div><label class="field-label" for="call-ins">${t.insurer}</label><select id="call-ins" class="select" data-change="call-ins">${insOptions}</select></div>
          <div><label class="field-label" for="call-lang">${t.language}</label><select id="call-lang" class="select" data-change="call-lang">${langOptions}</select></div>
        </div>
        <p class="policy-line">${policy}</p>
        <p class="t-small">${fill(t.dictate, { policy: d.policy })}</p>
        <section><h2 class="section-title">${t.tryTitle}</h2><ul class="try-list">${t.tryItems.map((x) => `<li>${x}</li>`).join('')}</ul></section>
        <p class="t-small muted">${t.micNote}</p>
        <div class="end-actions"><button type="button" class="btn btn-primary" id="call-start" data-act="call-start">${icon('phone')}<span>${t.call}</span></button>
        ${call.phase === 'mic' ? `<button type="button" class="btn btn-secondary" data-go="m2:fresh:${state.ins}">${fill(t.goChat, { ins: d.name })}</button>` : ''}</div>`;
    }
    return open(`${appbar(t.title)}<div class="notice-band" role="note">${t.notice}</div><main class="console-pre" id="main-content" tabindex="-1"><div class="console-pre-inner">${body}</div></main>`);
  }

  if (call.phase === 'dropped' || call.phase === 'ended') {
    const say = CALL_TALK[call.lang];
    const card = call.phase === 'dropped'
      ? `<section class="end-card" aria-labelledby="end-title"><h1 id="end-title" class="t-title">${t.droppedTitle}</h1>
          <p class="muted">${t.caseLabel} <span class="mono">${d.caseNo}</span></p><p><span class="tag warn">${t.waitingInsured}</span></p><p>${t.droppedText}</p>

const CLAIM_TEXT = { es: 'Choqué ayer y quiero reportarlo.', en: 'I crashed yesterday and want to report it.' };

function resolvedColumns(q) {
  const answers = c().compare.answers[q];
  return Object.fromEntries(INSURER_IDS.map((id) => [id, answers[id] ? 'answer' : 'noclause']));
}
function initCompare() {
  const sub = state.sub;
  const q = sub === 'noclause' ? 'hail' : 'rental';
  const cols = sub === 'loading'
    ? { stonecroft: 'loading', sunmeadow: 'loading', knotwell: 'loading' }
    : sub === 'answered' ? { stonecroft: 'answer', sunmeadow: 'answer', knotwell: 'failed' } : resolvedColumns(q);
  state.cmp = { q, text: sub === 'claim' ? CLAIM_TEXT[state.lang] : c().compare.questions[q], cols, expanded: new Set(), claim: sub === 'claim' };
}

function cmpColumn(id) {
  const t = c().compare;
  const cmp = state.cmp;
  const st = cmp.cols[id];
  const d = INS[id];
  const policy = id === 'knotwell' ? t.issued : fill(t.policy, { p: `<span class="mono">${d.policy}</span>` });
  let body;
  if (st === 'loading') {
    body = `<p class="t-small muted" role="status">${t.loading}</p><span class="skel" style="height:18px"></span><span class="skel" style="height:18px;width:80%"></span><span class="skel" style="height:18px;width:55%"></span>`;
  } else if (st === 'failed') {
    body = `<div class="inline-alert warn">${icon('warning')}<span>${t.failed}</span></div><div><button type="button" class="btn btn-secondary btn-sm" data-act="cmp-retry" data-ins="${id}">${icon('retry', 'i-16')}<span>${t.retry}</span></button></div>`;
  } else if (st === 'noclause') {
    body = `<p class="cmp-answer">${t.noClause}</p>`;
  } else {
    const sources = COMPARE_SOURCES[cmp.q][id];
    const first = CLAUSE_TEXT[sources[0][0]];
    const open = cmp.expanded.has(id);
    const cross = first && first.lang !== state.lang;
    body = `<p class="cmp-answer">${t.answers[cmp.q][id]}</p>
      ${sources.map(([sid, v]) => `<p class="src-row"><span class="mono">${sid}</span><span class="mono">${v}</span><span class="tag ok">${c().chat.current}</span></p>`).join('')}
      <div><button type="button" class="btn btn-secondary btn-sm" data-act="cmp-clause" data-ins="${id}" aria-expanded="${open}" aria-controls="cmp-clause-${id}">${open ? t.hideClause : t.viewClause}</button></div>
      <div class="clause" id="cmp-clause-${id}"${open ? '' : ' hidden'}>${cross ? `<p class="clause-note">${c().chat.originalIn}</p>` : ''}<p lang="${first.lang}">${first.text}</p></div>`;
  }
  return `<section class="cmp-col ins-${id}" aria-labelledby="cmp-h-${id}" aria-busy="${st === 'loading'}" lang="${state.lang}">
    <div class="cmp-col-head">${mono(id)}<div><h2 id="cmp-h-${id}" class="sub">${d.name}</h2><p class="t-small muted">${policy}</p></div></div>
    ${body}
  </section>`;
}

function renderCompare() {
  if (!state.cmp) initCompare();
  const t = c().compare;
  const cmp = state.cmp;
  const chips = ['hail', 'fence'].map((q) => `<button type="button" class="chip" data-act="cmp-suggest" data-q="${q}">${t.questions[q]}</button>`).join('');
  const claim = cmp.claim
    ? `<div class="inline-alert" role="status">${icon('info')}<div><p>${t.claimNotice}</p><p style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 16px">${INSURER_IDS.map((id) => `<a href="#" data-go="m2:fresh:${id}">${INS[id].name}</a>`).join('')}</p></div></div>`
    : '';
  return `<div class="screen ${surf()}" lang="${state.lang}">
    ${skip()}${appbar(t.title)}
    <main id="main-content" tabindex="-1">
      <div class="cmp-top">
        <p class="muted" style="max-width:70ch">${t.intro}</p>
        <form class="ask" data-form="compare" novalidate>
          <label class="field-label" for="cmp-q">${t.label}</label>
          <input id="cmp-q" class="input" type="text" value="${esc(cmp.text)}" autocomplete="off">
          <button type="submit" class="btn btn-primary">${t.ask}</button>
        </form>
        <div class="suggest"><span>${t.tryLabel}</span>${chips}</div>
        <p class="t-small faint">${t.limitNote}</p>
        ${claim}
      </div>
      ${cmp.claim ? '' : `<div class="cmp-cols">${INSURER_IDS.map(cmpColumn).join('')}</div>`}
    </main>
  </div>`;
}

function initInbox() {
  const sub = state.sub;
  state.inbox = {
    tab: ['waiting', 'closed'].includes(sub) ? sub : 'derived',
    channel: 'all', lang: sub === 'nomatch' ? 'en' : 'all', prio: sub === 'nomatch' ? 'high' : 'all',
    loading: sub === 'loading', denied: sub === 'denied',
  };
}
function inboxRows() {
  const ib = state.inbox;
  return ROWS[ib.tab]
    .filter((r) => (ib.channel === 'all' || r.channel === ib.channel) && (ib.lang === 'all' || r.lang === ib.lang) && (ib.tab !== 'derived' || ib.prio === 'all' || r.prio === ib.prio))
    .sort((a, b) => (ib.tab === 'derived' ? (PRIO_ORDER[a.prio] - PRIO_ORDER[b.prio]) || (b.mins - a.mins) : (b.mins || 0) - (a.mins || 0)));
}

function caseSubFor(tab, row) {
  if (tab === 'waiting') return 'waiting';

}
