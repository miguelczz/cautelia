# The "How it works" guide (/how-it-works): the journey step by step and the
# instructions for whoever wants to try the demo. Each step is drawn only if what it
# describes is mounted (BR4.1).
guide:
  title:
    text: How it works
    surface: system
  about:
    what:
      text: "Cautelia is a demo of an AI agent for auto insurance. It helps someone who has just had a crash: it gathers what happened, builds the case and answers policy questions, showing the clause it relies on."
      surface: system
    limit:
      text: "The agent does not decide coverage or payments: an adjuster signs that. In this demo, the adjuster is you."
      surface: system
    sample:
      text: "Everything is sample data: the insurers are fictional, and the policies and details are made up."
      surface: system
  steps:
    title:
      text: The path
      surface: system
    choose:
      title:
        text: Pick an insurer
        surface: system
      body:
        text: Each one comes with its sample policy. You can try several.
        surface: system
    report:
      title:
        text: Tell what happened
        surface: system
      both:
        text: By chat or by voice, in your own words.
        surface: system
      chat:
        text: By chat, in your own words.
        surface: system
      voice:
        text: By voice, in your own words.
        surface: system
      policy:
        text: When it asks for your policy, use the sample one.
        surface: system
    link:
      title:
        text: Get your case
        surface: system
      body:
        text: The agent asks for what is missing and gives you the link to your case.
        surface: system
    decide:
      title:
        text: Decide as the adjuster
        surface: system
      body:
        text: With that link you decide your own case, as an adjuster would.
        surface: system
  try:
    title:
      text: What else you can try
      surface: system
    ask_coverage:
      text: Ask whether your policy covers something and open the clause it cites.
      surface: system
    interrupt:
      text: On the call, interrupt the agent while it is speaking.
      surface: system
    compare:
      text: Ask all the insurers the same question at once.
      surface: system
    cases:
      text: See sample cases the way an adjuster sees them.
      surface: system
    telemetry:
      text: See what each conversation costs and how well the agent answers.
      surface: system
  differences:
    title:
      text: What changes between insurers
      surface: system
    same:
      text: They all ask the same questions. What changes is who helps you and what happens to your report.
      surface: system
    agent:
      text: "{agent} helps you."
      surface: system
    tip:
      text: To notice it, report the same crash to two of them.
      surface: system
  start:
    text: Choose an insurer
    surface: system

insurer:
  # The name the assistant introduces herself with. One name for all three, by
  # Miguel's decision of 2026-09-28, consistent with the already-taken decision of
  # a single bilingual voice (D-016). It is a recorded deviation from AC1.1.1's
  # example, which named "Valentina" for Stonecroft: the criterion is met in
  # substance —the first message says who is speaking and that it is an
  # artificial intelligence— and not in the name its example used.
  #
  # It lives in the catalogue and not in configuration because it is visible text.
  agent:
    name:
      text: Catalina
      surface: chat
  character:
    conservative:
      text: "Cautious: an adjuster reviews every case before it is closed."
      surface: system
    flexible:
      text: "Agile: closes simple reports on its own, like a crash with no injuries, and also offers quotes."
      surface: system
    agency:
      text: "Agency: it does not decide cases, it passes them to the insurer that issued the policy."
      surface: system

status:
  unavailable:
