problem:
  validation_failed:
    text: Check the details you sent and try again.
    surface: system
  not_found:
    text: We couldn't find what you were looking for.
    surface: system
  forbidden_origin:
    text: We couldn't complete the action from this page. Reload it and try again.
    surface: system
  link_invalid:
    text: This link isn't valid. Ask for a new one in the conversation where you created the case.
    surface: system
  conflict:
    text: This action had already been recorded.
    surface: system
  # El estado de lo que se pidio no admite la accion: un caso ya decidido,
  # uno cerrado, una accion que esa aseguradora no ofrece. Distinto de
  # `conflict`, que es una clave de idempotencia reusada: aquella dice "ya lo
  # hiciste" y esta dice "esto ya no se puede".
  conflict_state:
    text: This case no longer accepts that action. Reload to see how it ended up.
    surface: system
  unverifiable:
    text: We couldn't check this right now. Try again in a few minutes.
    surface: system
  service_unavailable:
