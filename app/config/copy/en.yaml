# Copy catalog, English.
#
# Every phrase a person reads comes from here. None is written inline in a node,
# an adapter or a screen (BR3.3).
#
# U1 ships the catalog with its checks, not with its content: each unit adds its
# phrases when it builds the behaviour that uses them. Today there is a single
# key, the one U1 actually consumes.

evals:
  scripted_insured:
    unknown_field:
      text: I don't know, I don't have that.
      surface: system

# The redaction labels (U3, BR3.2, BR3.4). The type's label appears in place of
# the datum, **never its digits or any part of them**: no prefix, no suffix and
# no length is left behind.
#
# They are written in the language of the conversation and stored **already
# written**, so that a log line or an exported trace can be read outside the
# application, with no catalog to resolve.
#
# The number tells apart two different data of the same type within the same
# text -- the insured's phone and the witness's -- and starts over on every call:
# keeping it across turns would require storing the correspondence between the
# real value and its number, which is exactly the vault this unit forbids.
redaction:
  label:
    license_plate:
      text: "[PLATE {n}]"
      surface: system
    national_id:
      text: "[ID {n}]"
      surface: system
    phone:
      text: "[PHONE {n}]"
      surface: system
    policy_number:
      text: "[POLICY {n}]"
      surface: system
    person:
      text: "[NAME {n}]"
      surface: system
    email:
      text: "[EMAIL {n}]"
      surface: system
    location:
      text: "[LOCATION {n}]"
      surface: system
    unclassified:
      text: "[DATA {n}]"
      surface: system
    vin:
      text: "[VIN {n}]"
      surface: system
  # What is said aloud in place of a label (2026-10-13). A label is read on a screen;
  # on a speaker it would sound like whatever the synthesizer decides. Only used when a
  # phrase about to be spoken still carries one -- a comment an adjuster wrote and was
  # stored masked, an explanation with a place the detector mistook for personal data.
  # It unmasks nothing: "that name" does not say which.
  spoken:
    license_plate:
      text: that plate
      surface: system
    national_id:
      text: that ID
      surface: system
    phone:
      text: that phone number
      surface: system
    policy_number:
      text: that policy
      surface: system
    person:
      text: that name
      surface: system
    email:
      text: that email address
      surface: system
    location:
      text: that place
      surface: system
    unclassified:
      text: that detail
      surface: system
    vin:
      text: that serial number
      surface: system
  # What an output point answers with when redaction could not run. The
  # unredacted text does not come out: this does. Failing closed is the only
  # option allowed here.
  degraded:
    text: I can't show this text right now.
    surface: system

# Case labels (U4, SEC-U4.15, BR3.6, AC4.10.2). No output ever prints the
# internal value of a state, a resolution, a record type or a derivation
# reason: `awaiting_insured` is not text for a person to read.
#
# The mapping from each enum value to its key lives in a single file of the
# code, next to the enum definition, so there are never two lists that can say
# different things.
case:
  # `waiting` **no esta aqui, y su ausencia es la decision**: el diseno listaba
  # "un momento" como un cuarto estado, y el protocolo no tiene tal estado. Lo que
  # ese cuarto estado queria --que la frase de espera se lea y no solo se oiga--
  # ya se cumple, porque cada cosa que la agente dice viaja tambien como
  # transcripcion. Una etiqueta generica en su lugar diria menos que la frase.
  state:
    open:
      text: Open
      surface: inbox
    capturing:
      text: Taking details
      surface: inbox
    verifying:
      text: Checking the policy
      surface: inbox
    deciding:
      text: Under review
      surface: inbox
    derived:
      text: With an adjuster
      surface: inbox
    awaiting_insured:
      text: Waiting on the insured
      surface: inbox
    closed:
      text: Closed
      surface: inbox
  resolution:
    registered:
      text: Registered
      surface: inbox
    approved:
      text: Approved
      surface: inbox
    rejected:
      text: Rejected
      surface: inbox
    sent_to_insurer:
      text: Sent to the insurer
      surface: inbox
  record_type:
    claim:
      text: Claim
      surface: inbox
    coverage_inquiry:
      text: Coverage question
      surface: inbox
    quote_request:
      text: Quote request
      surface: inbox
  derivation_reason:
    demo_limit:
      text: The demo reached its limit
      surface: inbox
    person_requested:
      text: The person asked to speak with someone
      surface: inbox
    rule:
      text: A rule sent this for review
      surface: inbox
  # Shown in place of a field that could not be decrypted. The case still
  # opens and the field is marked: a case that will not open only says that
  # something happened; one with a flagged gap can still be worked on.
  field_unavailable:
    text: Unavailable — encrypted with a key this server does not have
    surface: inbox
  # The labels of the eight case fields, shown by the inbox in its completeness
  # block (U14, BR2.1). The map from each field key to its copy key lives in
  # `case_record/labels.py`, beside the ones for the enums, and its test compares
  # both sets in both directions.
  field:
    identity_and_policy:
      text: Name and policy
      surface: inbox
    incident_datetime:
      text: When it happened
      surface: inbox
    location:
      text: Where it happened
      surface: inbox
    description:
      text: What happened
      surface: inbox
    vehicle_and_driver:
      text: Vehicle and driver
      surface: inbox
    other_parties:
      text: Other parties
      surface: inbox
    injuries:
      text: Injuries
      surface: inbox
    question_asked:
      text: The question that was asked
      surface: inbox
    driver_name:
      text: Driver's name
      surface: inbox
    driver_birth_date:
      text: Driver's date of birth
      surface: inbox
    license_years:
      text: Years licensed
      surface: inbox
    license_jurisdiction:
      text: City where the license was issued
      surface: inbox
    vehicle_year:
      text: Vehicle year
      surface: inbox
    vehicle_make:
      text: Vehicle make
      surface: inbox
    vehicle_model:
      text: Vehicle model
      surface: inbox
    vin:
      text: VIN
      surface: inbox
    salvage_title:
      text: Declared a total loss
      surface: inbox
    vehicle_age_years:
      text: Vehicle age in years
      surface: inbox
    use_type:
      text: Vehicle use
      surface: inbox
    annual_mileage_band:
      text: Annual mileage
      surface: inbox
    garaging_jurisdiction:
      text: City where the vehicle is kept
      surface: inbox
    at_fault_losses_3y:
      text: At-fault accidents in three years
      surface: inbox
    claims_3y:
      text: Claims reported in three years
      surface: inbox
    prior_coverage_active:
      text: Active insurance today
      surface: inbox
    lapse_months:
      text: Months without coverage
      surface: inbox
  # The channel the case came in through. It is the same token that names the node
  # and the trace label; what is read here comes from the catalogue, never the enum.
  channel:
    voice:
      text: Call
      surface: inbox
    chat:
      text: Chat
      surface: inbox

# Quota and budget rejection reasons (U5, BR5.3, BR4.4, AC5.14.3). No surface
# ever prints the enum value: `rate_limited_site` is not text for a person to
# read. The mapping from each reason to its key lives in a single file of the
# code, next to the enum definition.
#
# `budget_exhausted` carries the English side of the sentence AC5.14.3 fixes,
# which is at once the quota reason and the message the voice cuts with before
# asking for the microphone. One key for both: two entries with the same text is
# how they stop saying the same thing.
spend:
  quota:
    rate_limited_session:
      text: This conversation reached its message limit. Start a new one to keep going.
      surface: chat
    rate_limited_daily:
      text: You reached today's limit. Come back tomorrow and we'll pick it up.
      surface: chat
    rate_limited_site:
      text: The demo reached today's call quota. Come back tomorrow and we'll pick it up.
      surface: voice
    budget_exhausted:
      text: The voice demo reached its budget and is not taking calls. Chat is still available.
      surface: voice

# The three states of the trace summary the chat shows next to each answer (U5,
# BR6.7). `lost` is a value, not a failure: its sentence says the trace never
# arrived, not that something broke.
trace:
  summary:
    recording:
      text: Recording…
      surface: chat
    ready:
      text: Ready
      surface: chat
    lost:
      text: The trace for this answer never arrived
      surface: chat
  page:
    title:
      text: How this was answered
      surface: chat
    nodes:
      text: Steps taken
      surface: chat
    clauses:
      text: Clauses retrieved and verified
      surface: chat
    latency:
      text: Response time
      surface: chat
    cost:
      text: Cost
      surface: chat
    not_measured:
      text: Not measured
      surface: chat
    recording_hint:
      text: This is still being recorded. The page refreshes on its own.
      surface: chat
    nothing_here:
      text: There is nothing to show here.
      surface: chat
    milliseconds:
      text: "{value} ms"
      surface: chat
    back:
      text: Back to the conversation
      surface: chat
  # Cada paso con lo que hizo, sin su nombre interno (fase 3, 2026-10-08).
  node:
    intake:
      text: Understand what you said and record it
      surface: chat
    policy_verification:
      text: Search and check your policy
      surface: chat
    decision:
      text: Prepare the case for the adjuster
      surface: chat
    compliance:
      text: Check compliance
      surface: chat

