  # surface's disclosure (`comparison.disclosure`).
  disclosure:
    assistant:
      text: "Answered by {agent}"
      surface: system
    demo:
      text: "Demo with sample policies; AI assistants answer. Please do not type real personal data. Each question counts as three messages."
      surface: system
    incomplete:
      text: "We could not load each insurer's sample policy, so you cannot ask a question yet."
      surface: system
  # The question already asked. It is remembered in this browser for 24 hours,
  # because the demo's data resets every night.
  asked:
    label:
      text: "Your question"
      surface: system
    meta:
      text: "Asked: {when}. Saved in this browser for 24 hours."
      surface: system
    new:
      text: "New question"
      surface: system
  examples:
    title:
      text: "Example questions"
      surface: system
    rental_car:
      text: "Will you pay for a rental car while mine is being repaired?"
      surface: system
    hail:
      text: "Does my policy cover hail damage?"
      surface: system
    uninsured_driver:
      text: "What happens if I am hit by someone with no insurance?"
      surface: system
    stolen_keys:
      text: "Am I covered if my car is stolen with the keys inside?"
      surface: system
    ride_app:
      text: "Am I covered if I use my car for a ride-hailing app?"
      surface: system
    blown_tire:
