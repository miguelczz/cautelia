  language:
    es:
      text: Español
      surface: system
    en:
      text: Inglés
      surface: system
  not_measured:
    text: No medida
    surface: system
  cause:
    no_baseline:
      text: Todavía no se ha publicado ninguna línea base.
      surface: system
    criterion_absent:
      text: La línea base vigente no trae el criterio que produce esta cifra.
      surface: system
    criterion_not_built:
      text: "Todavía no existe un criterio que mida esto: falta cablear su medición."
      surface: system
    measured_per_milestone:
      text: Se mide por hito, contra proveedores reales, y todavía no hay una medición publicada.
      surface: system
    not_connected:
      text: Esta cifra todavía no está conectada al panel.
      surface: system
    latency_not_in_baseline:
      text: La línea base publicada no trae latencias.
      surface: system
    too_few_turns:
      text: Se midieron muy pocos turnos para dar una cifra confiable.
      surface: system
  source:
    date:
      text: Fecha
      surface: system
    commit:
      text: Commit
      surface: system
    run:
      text: Corrida
      surface: system
  latency:
    voice:
      text: Voz
      surface: system
    chat:
      text: Chat
      surface: system
    between:
      text: Entre {start} y {end}
      surface: system
    dataset:
      text: Sobre {dataset}
      surface: system
    percentiles:
      text: La mitad y 95 de cada 100 (p50 y p95)
      surface: system
    half:
      text: "La mitad de los turnos, en {time}"
      surface: system
    most:
      text: "95 de cada 100 turnos, en {time}"
      surface: system
    turns:
      text: "Turnos medidos: {count}"
      surface: system
    environment_chat:
      text: "Se mide en la corrida de pruebas, desde que el servidor recibe el mensaje; no cuenta la red de quien escribe."
      surface: system
    event:
      speech_end:
        text: el fin del habla
        surface: system
      first_audio:
        text: el primer audio
        surface: system
      message_sent:
        text: el envío del mensaje
        surface: system
      first_word:
        text: la primera palabra
        surface: system

# La pestana de polizas (fase 2, 2026-10-08): las polizas de ejemplo y que preguntar.
policies:
  # En la barra: vuelve al inicio para elegir otra aseguradora desde el chat o la
