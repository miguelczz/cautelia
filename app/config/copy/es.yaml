# El caracter de cada aseguradora. Lo consume su `tenant.yaml` por
# `character_key`, no el codigo: la diferencia entre aseguradoras vive en su
# configuracion (convencion 9).
insurer:
  # El nombre con el que la agente se presenta. Uno solo para las tres, por
  # decisión de Miguel del 2026-09-28, coherente con la decisión ya tomada de una
  # sola voz bilingüe (D-016). Es una desviación anotada del ejemplo de AC1.1.1,
  # que nombraba "Valentina" para Stonecroft: el criterio se cumple en sustancia
  # —el primer mensaje dice quién habla y que es una inteligencia artificial— y
  # no en el nombre de su ejemplo.
  #
  # Vive en el catálogo y no en la configuración porque es texto visible.
  # Si algún día se quiere un nombre por aseguradora, el patrón ya existe:
  # `character_key` en su `tenant.yaml`, igual que el carácter de abajo.
  agent:
    name:
      text: Catalina
      surface: chat
  character:
    conservative:
      text: "Prudente: un ajustador revisa todos los casos antes de cerrarlos."
      surface: system
    flexible:
      text: "Ágil: cierra por su cuenta los reportes simples, como un choque sin heridos, y también ofrece cotizaciones."
      surface: system
    agency:
      text: "Agencia: no decide los casos, los pasa a la aseguradora que emitió la póliza."
      surface: system

# Las seis paginas de estado de M11, con una sola plantilla (BR5.5). Ninguna
