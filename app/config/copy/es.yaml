# Catalogo de textos en espanol.
#
# Toda frase que lee una persona sale de aqui. Ninguna se escribe en linea en un
# nodo, un adaptador o una pantalla (BR3.3).
#
# U1 entrega el catalogo con sus chequeos, no con su contenido: cada unidad
# agrega sus frases cuando construye la conducta que las usa. Hoy hay una sola
# clave, la que U1 consume de verdad.
#
# Cada clave existe tambien en `en.yaml` (BR3.1) y tiene al menos un consumidor
# literal en el codigo (BR3.2).

evals:
  scripted_insured:
    unknown_field:
      text: No sé, eso no lo tengo.
      surface: system

# Las etiquetas de la redacción (U3, BR3.2, BR3.4). En lugar del dato aparece la
# etiqueta de su tipo, **nunca sus dígitos ni una parte de ellos**: no se deja un
# prefijo, un sufijo ni una longitud.
#
# Se escriben en el idioma de la conversación y se guardan **ya escritas**, para
# que un renglón de log o una traza exportada se entiendan fuera del aplicativo,
# sin catálogo que resolver.
#
# El número distingue dos datos distintos del mismo tipo dentro del mismo texto
# --el teléfono del asegurado y el del testigo-- y empieza de nuevo en cada
# llamada: mantenerlo entre turnos exigiría guardar la correspondencia entre el
# valor real y su número, que es justo la bóveda que la unidad prohíbe.
redaction:
  label:
    license_plate:
      text: "[PLACA {n}]"
      surface: system
    national_id:
      text: "[CÉDULA {n}]"
      surface: system
    phone:
      text: "[TELÉFONO {n}]"
      surface: system
    policy_number:
      text: "[PÓLIZA {n}]"
      surface: system
    person:
      text: "[NOMBRE {n}]"
      surface: system
    email:
      text: "[CORREO {n}]"
      surface: system
    location:
      text: "[LUGAR {n}]"
      surface: system
    unclassified:
      text: "[DATO {n}]"
      surface: system
    vin:
      text: "[VIN {n}]"
      surface: system
  # Lo que se dice en voz alta en lugar de una etiqueta (2026-10-13). Una etiqueta se lee
  # en pantalla; en un altavoz sonaría a lo que el sintetizador decida. Solo se usa si una
  # frase que se va a decir todavía trae alguna --un comentario que un ajustador escribió y
  # se guardó tapado, una explicación con un lugar que el detector confundió con un dato--.
  # No destapa nada: "ese nombre" no dice cuál.
  spoken:
    license_plate:
      text: esa placa
      surface: system
    national_id:
      text: ese documento
      surface: system
    phone:
      text: ese teléfono
      surface: system
    policy_number:
      text: esa póliza
      surface: system
    person:
      text: ese nombre
      surface: system
    email:
      text: ese correo
      surface: system
    location:
      text: ese lugar
      surface: system
    unclassified:
      text: ese dato
      surface: system
    vin:
      text: ese número de serie
      surface: system
  # Lo que responde un punto de salida cuando la redacción no se pudo ejecutar.
  # No sale el texto sin tapar: sale esto. Fallar cerrado es la única opción.
  degraded:
    text: No puedo mostrar este texto ahora mismo.
    surface: system

# Las etiquetas del caso (U4, SEC-U4.15, BR3.6, AC4.10.2). Ninguna salida
# imprime el valor interno de un estado, una resolución, un tipo de registro o
# un motivo de derivación: `awaiting_insured` no es texto para una persona.
#
# La correspondencia entre cada valor del enum y su clave vive en un solo
# archivo del código, junto a la definición del enum, para que no haya dos
# listas que puedan decir cosas distintas.
case:
  # `waiting` **no esta aqui, y su ausencia es la decision**: el diseno listaba
  # "un momento" como un cuarto estado, y el protocolo no tiene tal estado. Lo que
  # ese cuarto estado queria --que la frase de espera se lea y no solo se oiga--
  # ya se cumple, porque cada cosa que la agente dice viaja tambien como
  # transcripcion. Una etiqueta generica en su lugar diria menos que la frase.
  state:
    open:
      text: Abierto
      surface: inbox
    capturing:
      text: Tomando datos
      surface: inbox
    verifying:
      text: Verificando la póliza
      surface: inbox
    deciding:
      text: Evaluando
      surface: inbox
    derived:
      text: Con un ajustador
      surface: inbox
    awaiting_insured:
      text: Esperando al asegurado
      surface: inbox
    closed:
      text: Cerrado
      surface: inbox
  resolution:
    registered:
      text: Registrado
      surface: inbox
    approved:
      text: Aprobado
      surface: inbox
    rejected:
      text: Rechazado
      surface: inbox
    sent_to_insurer:
      text: Enviado a la aseguradora
      surface: inbox
  record_type:
    claim:
      text: Siniestro
      surface: inbox
    coverage_inquiry:
      text: Consulta de cobertura
      surface: inbox
    quote_request:
      text: Solicitud de cotización
      surface: inbox
  derivation_reason:
    demo_limit:
      text: Se alcanzó el límite de la demostración
      surface: inbox
    person_requested:
      text: La persona pidió hablar con alguien
      surface: inbox
    rule:
      text: Una regla lo envió a revisión
      surface: inbox
  # Lo que se muestra en lugar de un campo que no se pudo descifrar. El caso se
  # abre igual y el campo aparece marcado: un caso que no abre solo dice que
  # algo pasó; uno con un hueco señalado se puede seguir trabajando.
  field_unavailable:
    text: No disponible — cifrado con una clave que este servidor no tiene
    surface: inbox
  # Las etiquetas de los ocho campos del caso, que la bandeja muestra en su
  # bloque de completitud (U14, BR2.1). La correspondencia entre cada clave de
  # campo y su clave de catalogo vive en `case_record/labels.py`, junto a las de
  # los enums, y su prueba compara los dos conjuntos en los dos sentidos.
  field:
    identity_and_policy:
      text: Nombre y póliza
      surface: inbox
    incident_datetime:
      text: Cuándo ocurrió
      surface: inbox
    location:
      text: Dónde ocurrió
      surface: inbox
    description:
      text: Qué pasó
      surface: inbox
    vehicle_and_driver:
      text: Vehículo y conductor
      surface: inbox
    other_parties:
      text: Otras partes
      surface: inbox
    injuries:
      text: Heridos
      surface: inbox
    question_asked:
      text: La pregunta que se hizo
      surface: inbox
    driver_name:
      text: Nombre del conductor
      surface: inbox
    driver_birth_date:
      text: Fecha de nacimiento del conductor
      surface: inbox
    license_years:
      text: Años con licencia
      surface: inbox
    license_jurisdiction:
      text: Ciudad donde sacó la licencia
      surface: inbox
    vehicle_year:
      text: Año del vehículo
      surface: inbox
    vehicle_make:
      text: Marca del vehículo
      surface: inbox
    vehicle_model:
      text: Modelo del vehículo
      surface: inbox
    vin:
      text: VIN
      surface: inbox
    salvage_title:
      text: Declarado pérdida total
      surface: inbox
    vehicle_age_years:
      text: Antigüedad del vehículo en años
      surface: inbox
    use_type:
      text: Uso del vehículo
      surface: inbox
    annual_mileage_band:
      text: Recorrido anual
      surface: inbox
    garaging_jurisdiction:
      text: Ciudad donde se guarda el vehículo
      surface: inbox
    at_fault_losses_3y:
      text: Siniestros con culpa en tres años
      surface: inbox
    claims_3y:
      text: Siniestros reportados en tres años
      surface: inbox
    prior_coverage_active:
      text: Seguro vigente hoy
      surface: inbox
    lapse_months:
      text: Meses sin cobertura
      surface: inbox
  # El canal por el que llegó el caso. Es el mismo token que nombra el nodo y la
  # etiqueta de la traza; lo que se lee aquí sale del catálogo, nunca el enum.
  channel:
    voice:
      text: Llamada
      surface: inbox
    chat:
      text: Chat
      surface: inbox

# Los motivos de rechazo de cuota y del techo (U5, BR5.3, BR4.4, AC5.14.3).
# Ninguna superficie imprime el valor del enum: `rate_limited_site` no es texto
# para una persona. La correspondencia entre cada motivo y su clave vive en un
# solo archivo del código, junto a la definición del enum.
#
# `budget_exhausted` lleva **la frase literal de AC5.14.3**, que es a la vez el
# motivo de cuota y el mensaje con el que la voz corta antes de pedir el
# micrófono. Una sola clave para las dos cosas: dos entradas con el mismo texto
# es como un día dejan de decir lo mismo.
spend:
  quota:
    rate_limited_session:
      text: Esta conversación llegó a su límite de mensajes. Abre una nueva para seguir.
      surface: chat
    rate_limited_daily:
      text: Llegaste al límite de hoy. Vuelve mañana y seguimos.
      surface: chat
    rate_limited_site:
      text: La demostración llegó a su cupo de llamadas de hoy. Vuelve mañana y seguimos.
      surface: voice
    budget_exhausted:
      text: La demostración de voz llegó a su presupuesto y no está recibiendo llamadas. El chat sigue disponible.
      surface: voice

# Los tres estados del resumen de traza que el chat enseña junto a cada
# respuesta (U5, BR6.7). `lost` es un valor y no un fallo: su frase dice que el
# rastro no llegó, no que algo se rompió.
trace:
  summary:
    recording:
      text: Registrándose…
      surface: chat
    ready:
      text: Listo
      surface: chat
    lost:
      text: El rastro de esta respuesta no llegó
      surface: chat
  # La pagina del resumen (BR4.3, BR4.4). Sin credencial y solo de la propia
  # conversacion: lo inexistente y lo ajeno dicen exactamente lo mismo.
  page:
    title:
      text: Cómo se respondió
      surface: chat
    nodes:
      text: Pasos recorridos
      surface: chat
    clauses:
      text: Cláusulas recuperadas y verificadas
      surface: chat
    latency:
      text: Tiempo de respuesta
      surface: chat
    cost:
      text: Costo
      surface: chat
    not_measured:
      text: No medido
      surface: chat
    recording_hint:
      text: Todavía se está registrando. Esta página se actualiza sola.
      surface: chat
    nothing_here:
      text: No hay nada que mostrar aquí.
      surface: chat
    milliseconds:
      text: "{value} ms"
      surface: chat
    back:
      text: Volver a la conversación
      surface: chat
  # Cada paso con lo que hizo, sin su nombre interno (fase 3, 2026-10-08).
  node:
    intake:
      text: Entender lo que contaste y anotarlo
      surface: chat
    policy_verification:
      text: Buscar y verificar en tu póliza
      surface: chat
    decision:
      text: Preparar el caso para el ajustador
      surface: chat
    compliance:
      text: Revisar el cumplimiento
      surface: chat

# --- La base de la interfaz (U6) ----------------------------------------------
#
# El marco comun, el inicio, las seis paginas de estado y los errores de la API
# dichos en palabras. Todo lo que se ve en esas pantallas sale de aqui (BR2.3).
#
# Las frases del inicio **solo describen lo construido** (BR4.1, BR4.3): hay una
# version del titulo, de "Como funciona" y de "Que puedes probar" por canal, y la
# interfaz dibuja solo la que corresponde a lo que el servidor declara montado.

shell:
  skip_to_content:
    text: Saltar al contenido
    surface: system
  brand_name:
    text: Cautelia
    surface: system
  nav_label:
    text: Navegación principal
    surface: system
  nav:
    # El boton de la barra que vuelve a la landing: la pagina de presentacion del
    # proyecto, en la raiz del sitio. "Sitio" y no "landing", que es jerga.
    landing:
      text: Volver al sitio
      surface: system
  # El boton que, en telefono, abre la navegacion y los dos selectores (2026-10-08).
  menu:
    button:
      text: Menú
      surface: system
  loading:
    text: Cargando
    surface: system
  # Cada idioma se nombra en su propia lengua, en los dos catalogos: quien no
  # lee espanol encuentra "English" sin tener que adivinar (U-04).
  language:
    group:
      text: Idioma
      surface: system
    es:
      text: Español
      surface: system
    en:
      text: English
      surface: system
    # Se anuncia una vez, en el idioma nuevo (BR2.5).
    changed:
      text: "Idioma: español"
      surface: system
  theme:
    group:
      text: Modo de color
      surface: system
    light:
      text: Claro
      surface: system
    dark:
      text: Oscuro
      surface: system
  footer:
    demo:
      text: Demostración de portafolio con datos sintéticos.
      surface: system
    # El nombre llega como dato (`shared/site/author.ts`): es el mismo en los dos idiomas.
    made_by:
      text: Creado por {name}
      surface: system
    linkedin:
      text: LinkedIn
      surface: system
    linkedin_label:
      text: "{name} en LinkedIn (se abre en una pestaña nueva)"
      surface: system
    github:
      text: GitHub
      surface: system
    github_label:
      text: "{name} en GitHub (se abre en una pestaña nueva)"
      surface: system

# La telemetria (2026-10-09): un solo enlace con dos pestanas, el gasto y los
# resultados. El tablero de gasto es publico y describe los casos sin su numero.
# Un importe sin precio nunca lleva un cero (BR1.2) y cada total dice cuantas
# consultas no se pudieron medir (BR3.5).
telemetry:
  title:
    text: "Telemetría"
    surface: system
  lead:
    text: "Cuánto cuesta atender a cada persona y qué tan bien lo hace la agente, con las cifras reales de esta demostración."
    surface: system
  tab_cost:
    text: "Cuánto cuesta"
    surface: system
  tab_quality:
    text: "Qué tan bien funciona"
    surface: system

# El tablero "Que tan bien funciona" (2026-10-11): la ultima corrida completa de
