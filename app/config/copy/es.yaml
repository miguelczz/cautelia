# La página pública "Casos" (2026-10-11): el caso propio del visitante y los casos de
# ejemplo de cada aseguradora. Solo esos dos: ningún caso de otro visitante se muestra.
cases:
  nav:
    text: Casos
    surface: system
  title:
    text: Casos
    surface: system
  intro:
    text: "Un caso es lo que la agente arma con lo que le cuentas: tus datos, la conversación y lo que encontró en tu póliza, para que un ajustador lo revise y lo decida. Aquí ves el tuyo y casos de ejemplo de cada aseguradora."
    surface: system
  start:
    text: Empezar un caso
    surface: system
  mine:
    title:
      text: Tus casos
      surface: system
    hint:
      text: Los que abriste desde este navegador, uno por aseguradora.
      surface: system
    empty:
      text: Todavía no tienes ningún caso. Cuéntale a la agente de una aseguradora qué te pasó y aquí aparece.
      surface: system
    chat:
      text: Seguir en el chat
      surface: system
    chat_with:
      text: "Seguir en el chat de {insurer}"
      surface: system
    view:
      text: Ver el caso
      surface: system
    view_of:
      text: "Ver el caso {case_number} de {insurer}"
      surface: system
    number:
      text: "Número de tu caso: {case_number}. Sirve para retomarlo o consultarlo."
      surface: system
  examples:
    title:
      text: Casos de ejemplo
      surface: system
    hint:
      text: Son casos inventados que ya trae cada aseguradora, tal como los ve un ajustador. Ábrelos para ver cómo queda un caso.
      surface: system
    insurer_label:
      text: Elige una aseguradora
      surface: system
    empty:
      text: Esta aseguradora no tiene casos de ejemplo por ahora.
      surface: system
  # Qué significa cada estado, en una línea bajo su título. Solo los que la lista ofrece:
  # un caso recién abierto, sin nada dentro, no se muestra.
  group:
    capturing:
      text: La agente todavía está preguntando los datos.
      surface: system
    verifying:
      text: La agente está comprobando la póliza.
      surface: system
    deciding:
      text: La agente está evaluando qué sigue.
      surface: system
    derived:
      text: Ya pasó a un ajustador, que decide qué sigue.
      surface: system
    awaiting_insured:
      text: El caso espera una respuesta del asegurado.
      surface: system
    closed:
      text: El caso ya tiene una resolución.
      surface: system
  example:
    title:
      text: Caso de ejemplo {case_number}
      surface: system
    note:
      text: "Este es un caso de ejemplo: se puede leer, pero no decidir. Para decidir un caso como ajustador, crea el tuyo en el chat."
      surface: system
    back:
      text: Volver a Casos
      surface: system

