  title:
    text: "Pólizas de ejemplo"
    surface: system
  intro:
    text: "Las pólizas de ejemplo de cada aseguradora. Elige una y pregunta por ella en el chat."
    surface: system
  loading:
    text: "Cargando las pólizas…"
    surface: system
  example:
    text: "Póliza de ejemplo"
    surface: system
  holder:
    text: "Titular: {name}"
    surface: system
  issued_by:
    text: "Emitida por {issuer}"
    surface: system
  period:
    text: "Vigente del {start} al {end}"
    surface: system
  vehicles:
    text: "Vehículos"
    surface: system
  coverage_title:
    text: "Qué cubre"
    surface: system
  money_note:
    text: "Montos en pesos colombianos."
    surface: system
  endorsements_title:
    text: "Condiciones especiales de esta póliza"
    surface: system
  no_endorsements:
    text: "Esta póliza no tiene condiciones especiales."
    surface: system
  questions_title:
    text: "Preguntas para probar"
    surface: system
  questions_hint:
    text: "Cada botón abre el chat con esta póliza y la pregunta ya enviada."
    surface: system
  ask_chat:
    text: "Preguntar en el chat con esta póliza"
