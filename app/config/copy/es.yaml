  # El mismo texto para un enlace manipulado y para un caso que no existe
  # (BR5.6): la diferencia permitiria adivinar que casos existen.
  link_invalid:
    title:
      text: Este enlace no es válido
      surface: system
    body:
      text: Revisa que lo copiaste completo o pide uno nuevo en la conversación donde creaste el caso.
      surface: system
  link_expired:
    title:
      text: Este enlace venció
      surface: system
    body:
      text: Tu caso sigue guardado hasta el reinicio de esta noche. Pide un enlace nuevo en la misma conversación, desde el navegador donde lo creaste.
      surface: system
  data_reset:
    title:
      text: Estos datos ya no existen
      surface: system
    body:
      text: Los datos de la demostración se borran cada noche.
      surface: system
  not_found:
    title:
      text: No encontramos esta página
      surface: system
    body:
      text: Revisa la dirección o vuelve al inicio de la demo.
      surface: system
  service_unavailable:
    title:
      text: El servicio no está disponible en este momento
      surface: system
