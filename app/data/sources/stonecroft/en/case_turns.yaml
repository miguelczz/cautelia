# Turnos de los casos sembrados de Seguros Aburrá en ingles (U7, FD-U7-7, CG-U7-2).
# Escritos a mano. Los datos personales van como marcador ({insured_name}, {plate}...) y
# los llena el generador con la persona y el vehiculo de una poliza emitida (BR7.2).
# Ningun turno de la agente copia una frase fija aprobada: solo preguntas de captura.
format_version: 1
tenant_id: stonecroft
language: en
part_key: case_turns
