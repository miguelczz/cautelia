  kind: case_turns
  version: '2026.1'
  text: 'agent: Could you tell me your full name and your policy number?'
  case:
    name: open
    state: open
  reviewed_at: '2026-09-21'
  reviewed_by: conductor
  drafted_with: hand
- source_id: SA-CASE-EN-CAPTURING
  kind: case_turns
  version: '2026.1'
  text: |-
    agent: Could you tell me your full name and your policy number?
    insured: I'm {insured_name}, the policy is {policy_number}.
    agent: When was the accident?
    insured: Yesterday, around six forty in the evening.
    agent: Where did it happen?
    insured: At Harbor Avenue and 12th Street.
    agent: I'm noting Harbor Avenue and 12th Street. Is that right?
    insured: Yes, that's right.
    agent: Which vehicle was it, and who was driving?
  case:
    name: capturing
    state: capturing
    fields: &id009
      identity_and_policy:
        value: '{insured_name}, policy {policy_number}'
        status: confirmed
      incident_datetime:
        value: 2026-09-14 18:40
        status: stated
      location:
        value: Harbor Avenue and 12th Street, Corvane
        status: confirmed
    used_by:
    - AC1.6.2
    - AC1.9.1
    - AC4.7.2
    - AC1.10.2
  reviewed_at: '2026-09-21'
  reviewed_by: conductor
  drafted_with: hand
- source_id: SA-CASE-EN-VERIFYING
  kind: case_turns
  version: '2026.1'
  text: |-
    insured: Good morning, I want to report a crash. I'm {insured_name}, policy {policy_number}.
    agent: Was anyone hurt?
    insured: No, nobody.
    agent: When and where did it happen?
    insured: Today at a quarter past seven in the morning, at 5th Avenue and 40th Street.
    agent: What happened?
    insured: Another car ran a red light and hit my driver's door.
    agent: Which vehicle were you driving?
    insured: My {vehicle}, plate {plate}. I was driving.
    agent: Do you have the other driver's details?
    insured: Yes, the name is {other_name_1} and the car's plate is {other_plate_1}.
  case:
    name: verifying
    state: verifying
    fields: &id007
      identity_and_policy: &id001
        value: '{insured_name}, policy {policy_number}'
        status: confirmed
      incident_datetime: &id002
        value: 2026-09-12 07:15
        status: confirmed
      location: &id003
        value: 5th Avenue and 40th Street, Corvane
        status: confirmed
      description:
        value: Another car ran a red light and hit the driver's door.
        status: stated
      vehicle_and_driver: &id004
        value: '{vehicle}, plate {plate}, driven by {insured_first_name}'
        status: confirmed
      other_parties:
        value: One driver, {other_name_1}, in a vehicle with plate {other_plate_1}
        status: stated
      injuries: &id005
        value: No one injured
        status: confirmed
    used_by:
    - AC1.14.1
    - AC4.8.1
  reviewed_at: '2026-09-21'
  reviewed_by: conductor
  drafted_with: hand
