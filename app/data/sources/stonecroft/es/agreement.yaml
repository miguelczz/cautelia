- source_id: SA-PAP-2026-AGREEMENT.1
  kind: clause
  clause_key: AGREEMENT.1
  part: Objeto del seguro y vigencia
  version: '2026.1'
  text: Seguros Aburrá se compromete a pagar, en los términos de este contrato, los amparos que la carátula
    muestra como contratados, cuando el siniestro ocurre dentro del territorio que fijan las condiciones
    generales. Un siniestro es el hecho que causa el daño o la pérdida. Este seguro es voluntario y no
    reemplaza el SOAT.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-AGREEMENT.2
  kind: clause
  clause_key: AGREEMENT.2
  part: Objeto del seguro y vigencia
  version: '2026.1'
  text: El seguro rige durante la vigencia que muestra la carátula, mientras la prima esté pagada. Para
    mantenerlo, usted atiende las obligaciones que le asigna este contrato, en especial las de la sección
    «Obligaciones en caso de siniestro».
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
