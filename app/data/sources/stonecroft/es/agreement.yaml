  part: Acuerdo
  version: '2026.1'
  text: La protección rige durante el periodo que muestra la carátula de la póliza. Para mantenerla vigente,
    el asegurado atiende las obligaciones que le asigna este contrato, en especial las de la Parte E.
  reviewed_at: '2026-09-21'
