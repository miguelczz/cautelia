- source_id: SA-PAP-2025-DEF.COVERED_AUTO
  kind: distractor
  clause_key: DEF.COVERED_AUTO
  part: Definiciones
  version: '2025.1'
  text: «Vehículo cubierto» es el vehículo que figura en la carátula. Un vehículo comprado durante la
    vigencia solo queda cubierto desde que se incluye en la carátula mediante un endoso.
  distractor_of: SA-PAP-2026-DEF.COVERED_AUTO
  distractor_reason: superseded_version
  reviewed_at: '2026-09-21'
  reviewed_by: conductor
  drafted_with: hand
