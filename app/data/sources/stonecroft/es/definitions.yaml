# Textos fuente revisados de Seguros Aburrá, en español (U7, F2).
# Redacción propia con la estructura de una póliza de automóviles colombiana
# (docs/reference/estructura-poliza-autos-colombia.md); ningún texto de ISO, de ACORD
# ni de una aseguradora real (P8). Se edita a mano y se regenera con `mise run synthetic:generate`.
format_version: 1
tenant_id: stonecroft
language: es
part_key: definitions
texts:
- source_id: SA-PAP-2026-DEF.YOU
  kind: clause
  clause_key: DEF.YOU
  part: Definiciones
  version: '2026.1'
  text: «Usted» es el tomador, la persona que contrató el seguro y aparece como asegurada en la carátula.
    También lo es su cónyuge o compañero permanente, mientras viva con usted. El beneficiario de la indemnización
    por los daños al vehículo es usted, salvo que la carátula nombre a otro, como el banco que tiene una
    prenda sobre el vehículo.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-DEF.WE
  kind: clause
  clause_key: DEF.WE
  part: Definiciones
  version: '2026.1'
  text: «Nosotros» es Seguros Aburrá, el asegurador que emite este contrato y responde por él.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-DEF.BODILY_INJURY
  kind: clause
  clause_key: DEF.BODILY_INJURY
  part: Definiciones
  version: '2026.1'
  text: '«Lesión personal» es todo daño a la salud de una persona causado por el accidente: las heridas,
    la enfermedad que se derive de ellas y, si ocurre, la muerte.'
  defines_terms:
  - lesión personal
  - lesiones personales
  - lesiones a una persona
  - lesiones a dos o más personas
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-DEF.PROPERTY_DAMAGE
  kind: clause
  clause_key: DEF.PROPERTY_DAMAGE
  part: Definiciones
  version: '2026.1'
  text: «Daño a bienes de terceros» es la rotura, la destrucción o la imposibilidad de usar un objeto
    que se puede tocar, como un vehículo, una cerca o una fachada. Un tercero es cualquier persona distinta
    de usted, de su cónyuge o compañero permanente y de quien conduce con su permiso.
  defines_terms:
  - daño a bienes
  - daños a bienes
  - bienes de terceros
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-DEF.COVERED_AUTO
  kind: clause
  clause_key: DEF.COVERED_AUTO
  part: Definiciones
  version: '2026.1'
  text: «Vehículo asegurado» es el automóvil de uso particular que figura en la carátula.
    También lo es el vehículo que usted compre durante la vigencia, si nos avisa dentro de los diez días
    siguientes a recibirlo.
  defines_terms:
  - vehículo asegurado
  - vehículos asegurados
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-DEF.TEMPORARY_SUBSTITUTE
  kind: clause
  clause_key: DEF.TEMPORARY_SUBSTITUTE
  part: Definiciones
  version: '2026.1'
  text: «Vehículo de reemplazo» es el que usted maneja de forma temporal, sin ser su dueño, mientras su
    vehículo asegurado está fuera de servicio por reparación, avería, hurto o pérdida total. Mientras
    dure esa situación, recibe la misma protección que el vehículo asegurado.
  defines_terms:
  - vehículo de reemplazo
  - vehículos de reemplazo
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-DEF.COMMERCIAL_VALUE
  kind: clause
  clause_key: DEF.COMMERCIAL_VALUE
  part: Definiciones
  version: '2026.1'
  text: «Valor comercial» es lo que vale su vehículo asegurado en el mercado el día del siniestro, según
    la Guía de Valores de Fasecolda. Esa guía se consulta con el código del vehículo y su año modelo.
    El valor comercial es la base del valor asegurado.
  defines_terms:
  - valor comercial
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-DEF.FAMILY_MEMBER
  kind: clause
  clause_key: DEF.FAMILY_MEMBER
  part: Definiciones
  version: '2026.1'
  text: «Familiar» es la persona que vive en su hogar y es su pariente de sangre, por matrimonio o unión,
    o por adopción, incluidos los hijos bajo su cuidado legal.
  defines_terms:
  - familiar
  - familiares
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-DEF.OCCUPYING
  kind: clause
  clause_key: DEF.OCCUPYING
  part: Definiciones
  version: '2026.1'
  text: «Ocupante» es quien va dentro del vehículo o está subiendo o bajando de él. También lo es quien
    está junto al vehículo cargándolo o empujándolo con las manos.
  defines_terms:
  - ocupante
  - ocupantes
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2025-DEF.YOU.ALT
  kind: distractor
  clause_key: DEF.YOU.ALT
  part: Definiciones
  version: '2025.1'
  text: «Usted» es solamente el tomador que aparece como asegurado en la carátula; su cónyuge o compañero
    permanente no queda incluido aunque viva con esa persona.
  distractor_of: SA-PAP-2026-DEF.YOU
  distractor_reason: near_duplicate
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2025-DEF.COVERED_AUTO
  kind: distractor
  clause_key: DEF.COVERED_AUTO
  part: Definiciones
  version: '2025.1'
  text: «Vehículo asegurado» es el automóvil que figura en la carátula. Un vehículo comprado durante la
    vigencia solo queda asegurado desde que se incluye en la carátula mediante un endoso.
  distractor_of: SA-PAP-2026-DEF.COVERED_AUTO
  distractor_reason: superseded_version
