texts:
- source_id: SA-PAP-2026-END-1-DEF.FAMILY_MEMBER
  kind: endorsement
  clause_key: DEF.FAMILY_MEMBER
  part: Endosos
  version: '2026.1'
  text: Para esta póliza, también es familiar su hijo o hija menor de 25 años que estudia en otra ciudad
    y vive allí durante el periodo de estudios, aunque no viva en su hogar.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-END-2-A.EXCL.A.5
  kind: endorsement
  clause_key: A.EXCL.A.5
  part: Endosos
  version: '2026.1'
  text: La exclusión de transporte a cambio de un pago no se aplica mientras el vehículo asegurado presta
    servicio por una plataforma de viajes registrada en Colombia, desde que el conductor acepta el viaje
    hasta que el pasajero se baja. Rigen los mismos límites de la sección de responsabilidad civil.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-END-3-D.EXCL.3
  kind: endorsement
  clause_key: D.EXCL.3
  part: Endosos
  version: '2026.1'
  text: La exclusión de equipos electrónicos no instalados de fábrica no se aplica a los equipos que usted
    haya declarado con su factura, hasta $1.500.000 por pérdida y con el deducible de pérdida parcial
    por hurto.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-END-4-C.ARBITRATION
  kind: endorsement
  clause_key: C.ARBITRATION
  part: Endosos
  version: '2026.1'
  text: 'El arbitraje de la sección de accidentes personales lo decide un tribunal de tres árbitros: uno
    nombrado por cada parte y el tercero elegido por los dos primeros. Cada parte paga su árbitro y la
    mitad del tercero.'
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-END-5-F.PERIOD_TERRITORY
  kind: endorsement
  clause_key: F.PERIOD_TERRITORY
  part: Endosos
  version: '2026.1'
  text: El territorio de la póliza se amplía a los viajes de hasta 30 días seguidos por los países vecinos
    de Colombia, siempre que el vehículo asegurado vuelva a Colombia al terminar el viaje.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
