texts:
- source_id: SA-PAP-2026-END-1-DEF.FAMILY_MEMBER
  kind: endorsement
  clause_key: DEF.FAMILY_MEMBER
  part: Endosos
  version: '2026.1'
  text: Para esta póliza, también es familiar su hijo o hija menor de 25 años que estudia en otra ciudad
    y vive allí durante el periodo de estudios, aunque no viva en su hogar.
  reviewed_at: '2026-09-21'
  reviewed_by: conductor
  drafted_with: hand
- source_id: SA-PAP-2026-END-2-A.EXCL.A.5
  kind: endorsement
  clause_key: A.EXCL.A.5
  part: Endosos
  version: '2026.1'
  text: La exclusión de transporte a cambio de un pago no se aplica mientras el vehículo cubierto presta
    servicio por una plataforma de viajes registrada en Corvane, desde que el conductor acepta el viaje
    hasta que el pasajero se baja. Rigen los mismos límites de la Parte A.
  reviewed_at: '2026-09-21'
  reviewed_by: conductor
  drafted_with: gemini-3.1-flash-lite
- source_id: SA-PAP-2026-END-3-D.EXCL.3
  kind: endorsement
  clause_key: D.EXCL.3
  part: Endosos
  version: '2026.1'
  text: La exclusión de equipos electrónicos no instalados de fábrica no se aplica a los equipos que usted
    haya declarado con su factura, hasta $1.500 por pérdida y con el deducible de los daños que no vienen
    de un choque.
  reviewed_at: '2026-09-21'
  reviewed_by: conductor
  drafted_with: hand
- source_id: SA-PAP-2026-END-4-C.ARBITRATION
  kind: endorsement
  clause_key: C.ARBITRATION
  part: Endosos
  version: '2026.1'
  text: 'El arbitraje de la Parte C lo decide un tribunal de tres árbitros: uno nombrado por cada parte
    y el tercero elegido por los dos primeros. Cada parte paga su árbitro y la mitad del tercero.'
  reviewed_at: '2026-09-21'
  reviewed_by: conductor
  drafted_with: gemini-3.1-flash-lite
- source_id: SA-PAP-2026-END-5-F.PERIOD_TERRITORY
  kind: endorsement
  clause_key: F.PERIOD_TERRITORY
  part: Endosos
  version: '2026.1'
  text: El territorio de la póliza se amplía a los viajes de hasta 30 días seguidos por las jurisdicciones
    vecinas de Corvane, siempre que el vehículo cubierto vuelva a Corvane al terminar el viaje.
  reviewed_at: '2026-09-21'
  reviewed_by: conductor
  drafted_with: gemini-3.1-flash-lite
