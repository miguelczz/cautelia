# Textos fuente revisados de Seguros Aburrá, en español (U7, F2).
# Redacción propia con la estructura de una póliza de automóviles colombiana
# (docs/reference/estructura-poliza-autos-colombia.md); ningún texto de ISO, de ACORD
# ni de una aseguradora real (P8). Se edita a mano y se regenera con `mise run synthetic:generate`.
format_version: 1
tenant_id: stonecroft
language: es
part_key: part_a
texts:
- source_id: SA-PAP-2026-A.INS
  kind: clause
  clause_key: A.INS
  part: Responsabilidad civil extracontractual
  version: '2026.1'
  text: Si usted o un conductor autorizado causan con el vehículo asegurado, o con un vehículo de reemplazo,
    un accidente de tránsito por el que deben responder ante la ley frente a un tercero, Seguros Aburrá
    paga los perjuicios por daños a bienes de terceros, por muerte o lesiones a una persona y por muerte
    o lesiones a dos o más personas. Pagamos hasta los límites de esta sección y en exceso de lo que cubra
    el SOAT. Conductor autorizado es quien maneja con su permiso y con licencia de conducción vigente.
    También asumimos la defensa frente a esas reclamaciones, con abogados que elegimos nosotros, y podemos
    llegar a un acuerdo con la víctima cuando lo consideremos conveniente. Dejamos de defenderlo cuando
    lo pagado alcanza el límite.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-A.SUPP
  kind: clause
  clause_key: A.SUPP
  part: Responsabilidad civil extracontractual
  version: '2026.1'
  text: Además del límite de esta sección, y sin descontarlo de él, Seguros Aburrá paga los costos del
    proceso que la víctima inicie contra usted o contra nosotros por un accidente cubierto (Código de
    Comercio, art. 1128), las fianzas judiciales que se le exijan y los gastos razonables en que usted
    incurra cuando le pedimos ayuda con el caso, incluido su transporte a las audiencias. No los pagamos
    si el accidente se causó a propósito o está excluido, ni si usted enfrenta el proceso en contra de
    una instrucción nuestra por escrito.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-A.EXCL.A.1
  kind: clause
  clause_key: A.EXCL.A.1
  part: Responsabilidad civil extracontractual
  version: '2026.1'
  text: No hay cobertura para las lesiones o daños que usted o un conductor autorizado causen a propósito,
    ni para los que cause otra persona siguiendo sus órdenes.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-A.EXCL.A.2
  kind: clause
  clause_key: A.EXCL.A.2
  part: Responsabilidad civil extracontractual
  version: '2026.1'
  text: No cubrimos los daños a bienes que sean suyos o que usted esté transportando.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-A.EXCL.A.3
  kind: clause
  clause_key: A.EXCL.A.3
  part: Responsabilidad civil extracontractual
  version: '2026.1'
  text: No cubrimos los daños a bienes que usted tenga alquilados, prestados o bajo su cuidado.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-A.EXCL.A.4
  kind: clause
  clause_key: A.EXCL.A.4
  part: Responsabilidad civil extracontractual
  version: '2026.1'
  text: 'No cubrimos las lesiones de un trabajador suyo ocurridas mientras trabaja para usted: esas lesiones
    las atienden el régimen laboral y el de riesgos laborales.'
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-A.EXCL.A.5
  kind: clause
  clause_key: A.EXCL.A.5
  part: Responsabilidad civil extracontractual
  version: '2026.1'
  text: No cubrimos la responsabilidad que surja mientras el vehículo presta servicio público o transporta
    personas o mercancías a cambio de un pago, incluidos los viajes contratados por una aplicación. Compartir
    entre conocidos los gastos de un viaje no se considera un pago.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-A.EXCL.A.6
  kind: clause
  clause_key: A.EXCL.A.6
  part: Responsabilidad civil extracontractual
  version: '2026.1'
  text: No cubrimos la responsabilidad que surja mientras el vehículo se usa en un negocio de venta, reparación,
    lavado, parqueo o custodia de vehículos.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-A.EXCL.A.7
  kind: clause
  clause_key: A.EXCL.A.7
  part: Responsabilidad civil extracontractual
  version: '2026.1'
  text: No cubrimos a quien conduzca un vehículo sin permiso de su dueño o sin motivos razonables para
    creer que lo tenía.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-A.EXCL.A.8
  kind: clause
  clause_key: A.EXCL.A.8
  part: Responsabilidad civil extracontractual
  version: '2026.1'
  text: No cubrimos los accidentes ocurridos durante carreras, competencias de velocidad o pruebas de
    rendimiento, ni durante la práctica para participar en ellas.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-A.EXCL.A.9
  kind: clause
  clause_key: A.EXCL.A.9
  part: Responsabilidad civil extracontractual
  version: '2026.1'
  text: No pagamos multas, comparendos, sanciones ni indemnizaciones que un juez imponga como castigo
    y no como reparación del daño.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-A.EXCL.B.1
  kind: clause
  clause_key: A.EXCL.B.1
  part: Responsabilidad civil extracontractual
  version: '2026.1'
  text: No hay cobertura mientras se conduce una moto, un triciclo motorizado u otro vehículo de dos o
    tres ruedas.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-A.EXCL.B.2
  kind: clause
  clause_key: A.EXCL.B.2
  part: Responsabilidad civil extracontractual
  version: '2026.1'
  text: No cubrimos el uso de un vehículo que sea suyo y que no figure en la carátula, salvo el vehículo
    recién comprado que incluye la definición de vehículo asegurado.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-A.EXCL.B.3
  kind: clause
  clause_key: A.EXCL.B.3
  part: Responsabilidad civil extracontractual
  version: '2026.1'
  text: No cubrimos el uso de un vehículo que sea de un familiar, o que un familiar tenga a su disposición
    de forma habitual, si ese vehículo no figura en la carátula.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-A.LIMIT
  kind: clause
  clause_key: A.LIMIT
  part: Responsabilidad civil extracontractual
  version: '2026.1'
  text: La carátula fija tres límites. El de muerte o lesiones a una persona es lo máximo que pagamos
    por cada víctima en un accidente. El de muerte o lesiones a dos o más personas es lo máximo por todas
    las víctimas de ese accidente. El de daños a bienes de terceros es lo máximo por todos los bienes
    dañados. Esos límites no crecen porque haya más asegurados, más vehículos o más reclamaciones.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-A.OUT_OF_COUNTRY
  kind: clause
  clause_key: A.OUT_OF_COUNTRY
  part: Responsabilidad civil extracontractual
  version: '2026.1'
  text: Cuando un endoso de territorio extiende la póliza a otro país y la ley de ese país exige un seguro
    obligatorio para circular, ese seguro paga primero y esta sección paga el exceso, hasta el límite de
    la carátula. Nunca pagamos dos veces por el mismo daño.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-A.SOAT
  kind: clause
  clause_key: A.SOAT
  part: Responsabilidad civil extracontractual
  version: '2026.1'
  text: Esta sección no reemplaza el SOAT, que la ley exige a todo vehículo que circula. Primero responde
    lo que cubra el SOAT, y esta póliza paga el exceso, con al menos los mínimos que establece el documento
    «Marco legal».
  refers_to:
  - SA-JUR-2026-J.1
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-A.OTHER
  kind: clause
  clause_key: A.OTHER
  part: Responsabilidad civil extracontractual
  version: '2026.1'
  text: Si otro seguro de responsabilidad civil también responde por el accidente, repartimos el pago
    en proporción a los límites de cada seguro. Cuando el vehículo no es suyo, paga primero el seguro
    de ese vehículo y nosotros cubrimos lo que falte.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2025-A.INS
  kind: distractor
  clause_key: A.INS
  part: Responsabilidad civil extracontractual
  version: '2025.1'
  text: 'Seguros Aburrá paga los perjuicios que usted cause a terceros con el vehículo asegurado, hasta
