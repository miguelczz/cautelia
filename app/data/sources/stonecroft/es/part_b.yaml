texts:
- source_id: SA-PAP-2026-B.INS
  kind: clause
  clause_key: B.INS
  part: Gastos médicos de los ocupantes
  version: '2026.1'
  text: Seguros Aburrá paga los gastos médicos, de hospitalización y funerarios razonables de los ocupantes
    del vehículo asegurado cuando sufren un accidente de tránsito, siempre que se causen dentro de los
    dos años siguientes. Pagamos en exceso de lo que cubra el SOAT.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-B.EXCL.1
  kind: clause
  clause_key: B.EXCL.1
  part: Gastos médicos de los ocupantes
  version: '2026.1'
  text: No pagamos gastos médicos por lesiones sufridas en una moto u otro vehículo de dos o tres ruedas.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-B.EXCL.2
  kind: clause
  clause_key: B.EXCL.2
  part: Gastos médicos de los ocupantes
  version: '2026.1'
  text: No pagamos gastos médicos por lesiones sufridas mientras el vehículo presta servicio público o
    transporta pasajeros a cambio de un pago.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-B.EXCL.3
  kind: clause
  clause_key: B.EXCL.3
  part: Gastos médicos de los ocupantes
  version: '2026.1'
  text: No pagamos gastos médicos de lesiones ocurridas mientras el vehículo se usaba como vivienda o
    como lugar de trabajo fijo.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-B.EXCL.4
  kind: clause
  clause_key: B.EXCL.4
  part: Gastos médicos de los ocupantes
  version: '2026.1'
  text: No pagamos gastos médicos de lesiones sufridas en carreras, competencias de velocidad o pruebas
    de rendimiento.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-B.LIMIT
  kind: clause
  clause_key: B.LIMIT
  part: Gastos médicos de los ocupantes
  version: '2026.1'
  text: El límite por persona que muestra la carátula es lo máximo que pagamos por los gastos médicos
    de cada ocupante lesionado en un mismo accidente, sin importar cuántas personas o vehículos intervengan.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-B.OTHER
  kind: clause
  clause_key: B.OTHER
  part: Gastos médicos de los ocupantes
  version: '2026.1'
  text: Si el SOAT u otro seguro de gastos médicos cubre los mismos gastos, pagamos solo lo que quede
    sin pagar después de ese seguro, hasta nuestro límite.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
