# (docs/reference/estructura-poliza-autos-colombia.md); ningún texto de ISO, de ACORD
# ni de una aseguradora real (P8). Se edita a mano y se regenera con `mise run synthetic:generate`.
format_version: 1
tenant_id: stonecroft
language: es
part_key: part_c
texts:
- source_id: SA-PAP-2026-C.INS
  kind: clause
  clause_key: C.INS
  part: Accidentes personales del conductor
  version: '2026.1'
  text: Si el conductor autorizado del vehículo asegurado muere, o queda con una incapacidad permanente,
    a causa de un accidente de tránsito ocurrido mientras conduce, Seguros Aburrá paga el valor asegurado
    de accidentes personales que muestra la carátula. En la incapacidad permanente pagamos según el porcentaje
    de pérdida de capacidad que dictamine la autoridad competente. Si el conductor muere, pagamos a sus
    beneficiarios.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-C.EXCL.1
  kind: clause
  clause_key: C.EXCL.1
  part: Accidentes personales del conductor
  version: '2026.1'
  text: No cubrimos el accidente del conductor cuando conduce un vehículo que no es el vehículo asegurado
    ni un vehículo de reemplazo.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-C.EXCL.2
  kind: clause
  clause_key: C.EXCL.2
  part: Accidentes personales del conductor
  version: '2026.1'
  text: No cubrimos la muerte o la incapacidad que el conductor se cause a sí mismo a propósito.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-C.EXCL.3
  kind: clause
  clause_key: C.EXCL.3
  part: Accidentes personales del conductor
  version: '2026.1'
  text: No hay cobertura mientras el vehículo presta servicio público o transporta personas o mercancías
    a cambio de un pago.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-C.EXCL.4
  kind: clause
  clause_key: C.EXCL.4
  part: Accidentes personales del conductor
  version: '2026.1'
  text: No cubrimos a quien conduzca el vehículo sin permiso de su dueño o sin motivos razonables para
    creer que lo tenía.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-C.LIMIT
  kind: clause
  clause_key: C.LIMIT
  part: Accidentes personales del conductor
  version: '2026.1'
  text: Lo máximo que pagamos por esta sección es el valor asegurado de accidentes personales que muestra
    la carátula, una sola vez por accidente, sin importar cuántos vehículos o personas intervengan. Lo
    que el responsable del accidente pague a la víctima no se descuenta.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-C.OTHER
  kind: clause
  clause_key: C.OTHER
  part: Accidentes personales del conductor
  version: '2026.1'
  text: 'Si el conductor tiene otros seguros de accidentes personales, cada uno paga su valor asegurado:
    lo que paguen los demás no reduce lo que pagamos nosotros.'
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-C.ARBITRATION
  kind: clause
  clause_key: C.ARBITRATION
  part: Accidentes personales del conductor
  version: '2026.1'
  text: Si no estamos de acuerdo con usted o con los beneficiarios sobre si hay derecho a la indemnización,
    sobre el grado de la incapacidad o sobre su monto, cualquiera de los dos puede pedir que lo decida
    un árbitro en Colombia. Cada parte paga sus propios gastos y la mitad de los honorarios del árbitro.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2025-C.INS.ALT
  kind: distractor
  clause_key: C.INS.ALT
  part: Accidentes personales del conductor
  version: '2025.1'
  text: Seguros Aburrá paga el valor asegurado de accidentes personales si el conductor autorizado muere
    o queda con una incapacidad permanente total a causa de un accidente de tránsito. La incapacidad permanente
    parcial no queda cubierta.
  distractor_of: SA-PAP-2026-C.INS
  distractor_reason: near_duplicate
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
