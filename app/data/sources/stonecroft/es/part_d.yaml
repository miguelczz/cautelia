    el deducible de pérdida parcial por daños, solo si el choque lo causó otra persona.
  distractor_of: SA-PAP-2026-D.INS.COLLISION
  distractor_reason: near_duplicate
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2025-D.TRANSPORT
  kind: distractor
  clause_key: D.TRANSPORT
  part: Pérdida del vehículo por daños y por hurto
  version: '2025.1'
  text: Si su vehículo asegurado sufre una pérdida total por daños o por hurto, le reembolsamos los gastos
    de transporte hasta $30.000 por día y $900.000 en total, a partir del tercer día.
  distractor_of: SA-PAP-2026-D.TRANSPORT
  distractor_reason: superseded_version
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
