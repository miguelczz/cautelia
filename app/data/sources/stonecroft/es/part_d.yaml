# Textos fuente revisados de Seguros Aburrá, en español (U7, F2).
# Redacción propia con la estructura de una póliza de automóviles colombiana
# (docs/reference/estructura-poliza-autos-colombia.md); ningún texto de ISO, de ACORD
# ni de una aseguradora real (P8). Se edita a mano y se regenera con `mise run synthetic:generate`.
format_version: 1
tenant_id: stonecroft
language: es
part_key: part_d
texts:
- source_id: SA-PAP-2026-D.INS.COLLISION
  kind: clause
  clause_key: D.INS.COLLISION
  part: Pérdida del vehículo por daños y por hurto
  version: '2026.1'
  text: 'Seguros Aburrá paga los daños directos y accidentales que sufra el vehículo asegurado por choque,
    vuelco, incendio, inundación, granizo, caída de objetos, vandalismo, rotura de vidrios o golpes con
    animales. Si reparar el vehículo cuesta menos del 75 % del valor asegurado, es una pérdida parcial:
    pagamos la reparación, menos el deducible de pérdida parcial por daños que muestra la carátula, que
    es la parte de la pérdida que paga usted. Si cuesta el 75 % o más, es una pérdida total y la pagamos
    según el límite de esta sección. Pagamos aunque usted haya causado el choque.'
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-D.INS.THEFT
  kind: clause
  clause_key: D.INS.THEFT
  part: Pérdida del vehículo por daños y por hurto
  version: '2026.1'
  text: También pagamos el hurto del vehículo asegurado, menos el deducible de pérdida parcial por hurto
    que muestra la carátula. Es pérdida total por hurto si el vehículo desaparece y no aparece después
    de la denuncia, y pérdida parcial por hurto si le roban partes o accesorios.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-D.TRANSPORT
  kind: clause
  clause_key: D.TRANSPORT
  part: Pérdida del vehículo por daños y por hurto
  version: '2026.1'
  text: Si su vehículo asegurado sufre una pérdida total por daños o por hurto, le reembolsamos los gastos
    de transporte que pague mientras tanto, hasta $50.000 por día y $1.500.000 en total, que son 30 días.
    El reembolso cuenta desde el día siguiente al siniestro.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-D.EXCL.1
  kind: clause
  clause_key: D.EXCL.1
  part: Pérdida del vehículo por daños y por hurto
  version: '2026.1'
  text: No cubrimos los daños ocurridos mientras el vehículo presta servicio público o transporta personas
    o mercancías a cambio de un pago.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-D.EXCL.2
  kind: clause
  clause_key: D.EXCL.2
  part: Pérdida del vehículo por daños y por hurto
  version: '2026.1'
  text: No cubrimos el desgaste por uso, el óxido, la falta de mantenimiento ni las fallas mecánicas o
    eléctricas, salvo que sean consecuencia de un hurto o de otro daño cubierto.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-D.EXCL.3
  kind: clause
  clause_key: D.EXCL.3
  part: Pérdida del vehículo por daños y por hurto
  version: '2026.1'
  text: No cubrimos equipos de sonido, pantallas, navegadores ni otros equipos electrónicos que no hayan
    venido instalados de fábrica.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-D.EXCL.4
  kind: clause
  clause_key: D.EXCL.4
  part: Pérdida del vehículo por daños y por hurto
  version: '2026.1'
  text: No cubrimos los objetos personales que estén dentro del vehículo, como ropa, herramientas, dinero
    o teléfonos.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-D.EXCL.5
  kind: clause
  clause_key: D.EXCL.5
  part: Pérdida del vehículo por daños y por hurto
  version: '2026.1'
  text: No cubrimos los daños que sufran solo las llantas, como pinchazos o reventones, salvo que vengan
    de un incendio, un hurto o un acto de vandalismo.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-D.EXCL.6
  kind: clause
  clause_key: D.EXCL.6
  part: Pérdida del vehículo por daños y por hurto
  version: '2026.1'
  text: No cubrimos la pérdida del vehículo por decomiso, inmovilización o destrucción que ordene una
    autoridad.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-D.EXCL.7
  kind: clause
  clause_key: D.EXCL.7
  part: Pérdida del vehículo por daños y por hurto
  version: '2026.1'
  text: No cubrimos los daños causados por guerra, rebelión, terrorismo organizado o energía nuclear.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-D.EXCL.8
  kind: clause
  clause_key: D.EXCL.8
  part: Pérdida del vehículo por daños y por hurto
  version: '2026.1'
  text: No cubrimos los daños sufridos en carreras, competencias de velocidad o pruebas de rendimiento,
    ni en la práctica para ellas.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-D.EXCL.9
  kind: clause
  clause_key: D.EXCL.9
  part: Pérdida del vehículo por daños y por hurto
  version: '2026.1'
  text: No cubrimos las piezas, accesorios o modificaciones que se hayan añadido al vehículo sin declararlos,
    como rines especiales, suspensiones modificadas o mejoras del motor.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-D.EXCL.10
  kind: clause
  clause_key: D.EXCL.10
  part: Pérdida del vehículo por daños y por hurto
  version: '2026.1'
  text: No cubrimos los daños que usted o un familiar causen a propósito al vehículo.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-D.EXCL.11
  kind: clause
  clause_key: D.EXCL.11
  part: Pérdida del vehículo por daños y por hurto
  version: '2026.1'
  text: No cubrimos los daños causados por llevar en el vehículo más peso del que permite su fabricante.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-D.EXCL.12
  kind: clause
  clause_key: D.EXCL.12
  part: Pérdida del vehículo por daños y por hurto
  version: '2026.1'
  text: No cubrimos el hurto si el vehículo quedó abierto con las llaves adentro o con el motor encendido
    en un lugar público.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-D.EXCL.13
  kind: clause
  clause_key: D.EXCL.13
  part: Pérdida del vehículo por daños y por hurto
  version: '2026.1'
  text: No cubrimos los daños por inundación si el conductor entró a una vía que las autoridades habían
    cerrado o señalado como inundada.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-D.LIMIT
  kind: clause
  clause_key: D.LIMIT
  part: Pérdida del vehículo por daños y por hurto
  version: '2026.1'
  text: Lo máximo que pagamos por un siniestro es el valor asegurado, que es el valor comercial del vehículo
    en la Guía de Valores de Fasecolda en la fecha del siniestro. Si reparar el vehículo cuesta el 75
    % o más de ese valor, es una pérdida total. Si cuesta menos, es una pérdida parcial y pagamos la reparación
    o la reposición de las piezas con otras equivalentes.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-D.PAYMENT
  kind: clause
  clause_key: D.PAYMENT
  part: Pérdida del vehículo por daños y por hurto
  version: '2026.1'
  text: Nosotros decidimos si pagamos la pérdida en dinero o si nos encargamos de la reparación o de la
    reposición. Pagamos dentro del mes siguiente al día en que usted demuestre el siniestro y su cuantía
    (Código de Comercio, art. 1080). Si la pérdida es total, el vehículo o sus restos, que son el salvamento,
    pasan a ser nuestros y usted firma el traspaso. Si el vehículo robado aparece antes de que paguemos,
    se lo devolvemos y pagamos los daños que haya sufrido.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-D.NO_BAILEE
  kind: clause
  clause_key: D.NO_BAILEE
  part: Pérdida del vehículo por daños y por hurto
  version: '2026.1'
  text: 'Esta cobertura no beneficia a quien tenga el vehículo a su cargo por negocio, como un taller,
    un parqueadero o una empresa de transporte de vehículos: si ellos causan el daño, podemos cobrárselo.'
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-D.OTHER_SOURCES
  kind: clause
  clause_key: D.OTHER_SOURCES
  part: Pérdida del vehículo por daños y por hurto
  version: '2026.1'
  text: Si otra póliza u otra fuente cubre la misma pérdida, pagamos solo nuestra parte, en proporción
    a nuestro límite frente al total.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-D.APPRAISAL
  kind: clause
  clause_key: D.APPRAISAL
  part: Pérdida del vehículo por daños y por hurto
  version: '2026.1'
  text: Si no estamos de acuerdo con usted sobre el monto de la pérdida, cada uno nombra un perito y los
    dos peritos eligen un tercero. Lo que acuerden dos de los tres es obligatorio para ambos. Cada uno
    paga su perito y la mitad del tercero.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2025-D.INS.COLLISION.ALT
  kind: distractor
  clause_key: D.INS.COLLISION.ALT
  part: Pérdida del vehículo por daños y por hurto
  version: '2025.1'
