    menos el deducible de colisión, solo si el choque lo causó otra persona.
  distractor_of: SA-PAP-2026-D.INS.COLLISION
  distractor_reason: near_duplicate
  reviewed_at: '2026-09-21'
  reviewed_by: conductor
  drafted_with: gemini-3.1-flash-lite
- source_id: SA-PAP-2025-D.TRANSPORT
  kind: distractor
  clause_key: D.TRANSPORT
  part: Parte D — Daños a su vehículo
  version: '2025.1'
