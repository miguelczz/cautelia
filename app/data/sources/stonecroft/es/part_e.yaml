format_version: 1
tenant_id: stonecroft
language: es
part_key: part_e
texts:
- source_id: SA-PAP-2026-E.DUTIES.A.1
  kind: clause
  clause_key: E.DUTIES.A.1
  part: Obligaciones en caso de siniestro
  version: '2026.1'
  text: Avísenos del siniestro dentro de los tres días hábiles siguientes a que lo conozca, como fija
    el marco legal (Código de Comercio, art. 1075).
  refers_to:
  - SA-JUR-2026-J.3
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-E.DUTIES.A.2
  kind: clause
  clause_key: E.DUTIES.A.2
  part: Obligaciones en caso de siniestro
  version: '2026.1'
  text: Cuéntenos cómo, cuándo y dónde pasó, y qué vehículos y personas estaban involucrados.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-E.DUTIES.A.3
  kind: clause
  clause_key: E.DUTIES.A.3
  part: Obligaciones en caso de siniestro
  version: '2026.1'
  text: Denos el nombre y un dato de contacto de los lesionados y de los testigos que conozca.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-E.DUTIES.B.1
  kind: clause
  clause_key: E.DUTIES.B.1
  part: Obligaciones en caso de siniestro
  version: '2026.1'
  text: Colabore con nosotros en la revisión del caso y en la defensa de cualquier reclamación contra
    usted.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-E.DUTIES.B.2
  kind: clause
  clause_key: E.DUTIES.B.2
  part: Obligaciones en caso de siniestro
  version: '2026.1'
  text: Envíenos enseguida copia de toda notificación, citación o demanda que reciba por el siniestro,
    incluida la citación a una audiencia de conciliación.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-E.DUTIES.B.3
  kind: clause
  clause_key: E.DUTIES.B.3
  part: Obligaciones en caso de siniestro
  version: '2026.1'
  text: Si la reclamación incluye lesiones, asista a los exámenes médicos que le pidamos, con médicos
    que nosotros pagamos, tantas veces como sea razonable.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-E.DUTIES.B.4
  kind: clause
  clause_key: E.DUTIES.B.4
  part: Obligaciones en caso de siniestro
  version: '2026.1'
  text: Entréguenos las pruebas de que el siniestro ocurrió y de cuánto costó (Código de Comercio, art.
    1077), la relación escrita de la pérdida si se la pedimos y la autorización para obtener su historia
    clínica si hubo lesiones.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-E.DUTIES.C.1
  kind: clause
  clause_key: E.DUTIES.C.1
  part: Obligaciones en caso de siniestro
  version: '2026.1'
  text: Si el accidente deja lesionados o muertos, o el responsable huyó sin identificarse, avise a la
    autoridad de tránsito dentro de las 24 horas siguientes y pida el informe del accidente.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-E.DUTIES.C.2
  kind: clause
  clause_key: E.DUTIES.C.2
  part: Obligaciones en caso de siniestro
  version: '2026.1'
  text: No reconozca responsabilidad, no concilie ni pague nada al tercero sin nuestra autorización por
    escrito.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-E.DUTIES.D.1
  kind: clause
  clause_key: E.DUTIES.D.1
  part: Obligaciones en caso de siniestro
  version: '2026.1'
  text: Tome las medidas razonables para evitar que el vehículo sufra más daños (Código de Comercio, art.
    1074); le devolvemos lo que gaste en ellas.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-E.DUTIES.D.2
  kind: clause
  clause_key: E.DUTIES.D.2
  part: Obligaciones en caso de siniestro
  version: '2026.1'
  text: Si le hurtaron el vehículo o alguna de sus partes, denúncielo de inmediato ante la autoridad competente.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-E.DUTIES.D.3
  kind: clause
  clause_key: E.DUTIES.D.3
  part: Obligaciones en caso de siniestro
  version: '2026.1'
  text: Permítanos ver y tasar el vehículo antes de repararlo o de deshacerse de él.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2025-E.DUTIES.A.1.ALT
  kind: distractor
  clause_key: E.DUTIES.A.1.ALT
  part: Obligaciones en caso de siniestro
  version: '2025.1'
  text: Avísenos de cualquier siniestro dentro de los treinta días siguientes; pasado ese plazo, el aviso
    ya no se recibe.
  distractor_of: SA-PAP-2026-E.DUTIES.A.1
  distractor_reason: near_duplicate
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
