texts:
- source_id: SA-PAP-2026-F.BANKRUPTCY
  kind: clause
  clause_key: F.BANKRUPTCY
  part: Condiciones generales
  version: '2026.1'
  text: Si usted entra en insolvencia, Seguros Aburrá sigue respondiendo por lo que cubre esta póliza.
    En la responsabilidad civil, la indemnización es para la víctima (Código de Comercio, art. 1127).
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-F.CHANGES
  kind: clause
  clause_key: F.CHANGES
  part: Condiciones generales
  version: '2026.1'
  text: Este contrato solo cambia por escrito, mediante un endoso que emitimos nosotros. Usted nos avisa
    por escrito de todo cambio que modifique el riesgo, como un cambio de uso del vehículo, y ajustamos
    la prima desde la fecha del cambio. Las comunicaciones se envían a la dirección o al correo que usted
    nos dio.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-F.FRAUD
  kind: clause
  clause_key: F.FRAUD
  part: Condiciones generales
  version: '2026.1'
  text: Usted declaró el estado del riesgo al contratar y debe haberlo hecho con sinceridad. No damos
    cobertura a quien haya mentido u ocultado a propósito un hecho importante sobre el accidente, la pérdida
    o el estado del riesgo; si la inexactitud fue de buena fe, el pago puede reducirse según la ley (Código
    de Comercio, art. 1058).
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-F.LEGAL_ACTION
  kind: clause
  clause_key: F.LEGAL_ACTION
  part: Condiciones generales
  version: '2026.1'
  text: Los derechos que nacen de esta póliza prescriben en los plazos que fija la ley (Código de Comercio,
    art. 1081), y no se puede reclamar judicialmente sin haber atendido antes las obligaciones que ella
    impone.
  refers_to:
  - SA-JUR-2026-J.5
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-F.RECOVERY
  kind: clause
  clause_key: F.RECOVERY
  part: Condiciones generales
  version: '2026.1'
  text: Cuando pagamos por un daño que causó otra persona, pasamos a ocupar su lugar para cobrarle lo
    que pagamos, hasta ese monto (Código de Comercio, art. 1096). Usted nos ayuda a hacerlo y no hace
    nada que perjudique ese cobro.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-F.PERIOD_TERRITORY
  kind: clause
  clause_key: F.PERIOD_TERRITORY
  part: Condiciones generales
  version: '2026.1'
  text: La póliza cubre los siniestros ocurridos durante la vigencia que muestra la carátula y dentro del
    territorio de Colombia. Fuera de Colombia no hay cobertura, salvo que un endoso de territorio la extienda
    a otro país.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-F.TERMINATION
  kind: clause
  clause_key: F.TERMINATION
  part: Condiciones generales
  version: '2026.1'
  text: Usted puede revocar la póliza en cualquier momento avisándonos por escrito. Nosotros solo podemos
    revocarla con el aviso previo que fija el marco legal, y devolvemos la prima del tiempo que no alcanzó
    a correr. Si la prima no se paga a tiempo, la póliza termina automáticamente (Código de Comercio,
    art. 1068).
  refers_to:
  - SA-JUR-2026-J.2
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-F.TRANSFER
  kind: clause
  clause_key: F.TRANSFER
  part: Condiciones generales
  version: '2026.1'
  text: Si usted vende el vehículo asegurado, o traspasa sus derechos por esta póliza, el seguro no pasa
    al comprador ni a otra persona sin nuestro consentimiento escrito.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: SA-PAP-2026-F.TWO_POLICIES
  kind: clause
  clause_key: F.TWO_POLICIES
  part: Condiciones generales
  version: '2026.1'
  text: Si dos o más seguros cubren el mismo siniestro, usted debe avisarnos de todos. Si son pólizas
    de Seguros Aburrá, lo máximo que pagamos es el límite más alto de una sola de ellas.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
