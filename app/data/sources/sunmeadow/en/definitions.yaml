texts:
- source_id: AP-PAP-2026-DEF.YOU
  kind: clause
  clause_key: DEF.YOU
  part: Definitions
  version: '2026.1'
  text: '"You" means the policyholder, the person who bought the insurance and is listed as the insured
    on the declarations page. It also includes that person''s spouse or permanent partner while the two
    share a home. The beneficiary of the payment for damage to the vehicle is you, unless the declarations
    page names someone else, such as a bank holding a pledge on the vehicle.'
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-DEF.WE
  kind: clause
  clause_key: DEF.WE
  part: Definitions
  version: '2026.1'
  text: '"We" means Autos Poblado, the insurer that issues this policy and stands behind it.'
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-DEF.BODILY_INJURY
  kind: clause
  clause_key: DEF.BODILY_INJURY
  part: Definitions
  version: '2026.1'
  text: '"Personal injury" means any harm to a person''s health caused by the accident, including wounds,
    illness that follows from them and, when it happens, death.'
  defines_terms:
  - personal injury
  - personal injuries
  - injury to one person
  - injury to two or more people
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-DEF.PROPERTY_DAMAGE
  kind: clause
  clause_key: DEF.PROPERTY_DAMAGE
  part: Definitions
  version: '2026.1'
  text: '"Property damage" means breaking, destroying or making unusable a physical object that belongs
    to a third party, such as another car, a fence or a storefront. A third party is anyone other than
    you, your spouse or permanent partner, and whoever drives with your permission.'
  defines_terms:
  - property damage
  - third-party property
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-DEF.COVERED_AUTO
  kind: clause
  clause_key: DEF.COVERED_AUTO
  part: Definitions
  version: '2026.1'
  text: '"Covered auto" means the private passenger car listed on the declarations page. A vehicle you buy during the policy period is also a covered auto if you tell us about it within
    20 days of taking delivery.'
  defines_terms:
  - covered auto
  - covered autos
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-DEF.COMMERCIAL_VALUE
  kind: clause
  clause_key: DEF.COMMERCIAL_VALUE
  part: Definitions
  version: '2026.1'
  text: '"Commercial value" means what your covered auto is worth on the market on the day of the loss
    event, according to the Fasecolda Value Guide. The guide is read with the vehicle''s code and model
    year. The commercial value is the basis of the insured value.'
  defines_terms:
  - commercial value
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-DEF.FAMILY_MEMBER
  kind: clause
  clause_key: DEF.FAMILY_MEMBER
  part: Definitions
  version: '2026.1'
  text: '"Family member" means someone who lives in your home and is related to you by birth, marriage,
    permanent partnership or adoption, including children in your legal care.'
  defines_terms:
  - family member
  - family members
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-DEF.OCCUPYING
  kind: clause
  clause_key: DEF.OCCUPYING
  part: Definitions
  version: '2026.1'
  text: '"Occupant" means someone inside a vehicle, climbing in or out of it, or standing next to it while
    loading it or pushing it by hand.'
  defines_terms:
  - occupant
  - occupants
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
