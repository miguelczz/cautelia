texts:
- source_id: SUN-PAP-2026-DEF.YOU
  kind: clause
  clause_key: DEF.YOU
  part: Definitions
  version: '2026.1'
  text: '"You" means the policyholder listed on the declarations page. It also includes that person''s
    spouse or partner while the two share a home.'
  reviewed_at: '2026-09-21'
  reviewed_by: conductor
  drafted_with: hand
- source_id: SUN-PAP-2026-DEF.WE
  kind: clause
  clause_key: DEF.WE
  part: Definitions
  version: '2026.1'
  text: '"We" means Autos Poblado, the company that issues this policy and stands behind it.'
  reviewed_at: '2026-09-21'
  reviewed_by: conductor
  drafted_with: hand
- source_id: SUN-PAP-2026-DEF.BODILY_INJURY
  kind: clause
  clause_key: DEF.BODILY_INJURY
  part: Definitions
  version: '2026.1'
  text: '"Bodily injury" means any harm to a person''s health caused by an accident, including wounds,
    illness that follows from them and, when it happens, death.'
  defines_terms:
  - bodily injury
  reviewed_at: '2026-09-21'
  reviewed_by: conductor
  drafted_with: hand
- source_id: SUN-PAP-2026-DEF.PROPERTY_DAMAGE
  kind: clause
  clause_key: DEF.PROPERTY_DAMAGE
  part: Definitions
  version: '2026.1'
  text: '"Property damage" means breaking, destroying or making unusable a physical object that belongs
    to someone else, such as another car, a fence or a storefront.'
  defines_terms:
  - property damage
  reviewed_at: '2026-09-21'
  reviewed_by: conductor
  drafted_with: hand
- source_id: SUN-PAP-2026-DEF.COVERED_AUTO
  kind: clause
  clause_key: DEF.COVERED_AUTO
  part: Definitions
  version: '2026.1'
  text: '"Covered auto" means the vehicle listed on the declarations page and any trailer listed there.
    A vehicle you buy during the policy period is also a covered auto if you tell us about it within 20
    days of taking delivery.'
  defines_terms:
  - covered auto
  - covered autos
  reviewed_at: '2026-09-21'
  reviewed_by: conductor
  drafted_with: hand
- source_id: SUN-PAP-2026-DEF.TRAILER
  kind: clause
  clause_key: DEF.TRAILER
  part: Definitions
  version: '2026.1'
  text: '"Trailer" means an unpowered vehicle built to be towed by a private passenger car, such as a
    small cargo trailer or a compact camper.'
  defines_terms:
  - trailer
  - trailers
  reviewed_at: '2026-09-21'
  reviewed_by: conductor
  drafted_with: hand
- source_id: SUN-PAP-2026-DEF.FAMILY_MEMBER
  kind: clause
  clause_key: DEF.FAMILY_MEMBER
  part: Definitions
  version: '2026.1'
  text: '"Family member" means someone who lives in your home and is related to you by birth, marriage,
    civil union or adoption, including children in your legal care.'
  defines_terms:
  - family member
  - family members
  reviewed_at: '2026-09-21'
  reviewed_by: conductor
  drafted_with: hand
- source_id: SUN-PAP-2026-DEF.OCCUPYING
  kind: clause
  clause_key: DEF.OCCUPYING
  part: Definitions
  version: '2026.1'
  text: '"Occupying" means being inside a vehicle, climbing in or out of it, or standing next to it while
    loading it or pushing it by hand.'
  defines_terms:
  - occupying
  reviewed_at: '2026-09-21'
  reviewed_by: conductor
  drafted_with: hand
