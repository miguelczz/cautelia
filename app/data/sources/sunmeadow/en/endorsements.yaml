# Textos fuente revisados de Autos Poblado, en inglés (U7, F2).
# Redacción propia con la estructura de una póliza de automóviles colombiana
# (docs/reference/estructura-poliza-autos-colombia.md); ningún texto de ISO, de ACORD
# ni de una aseguradora real (P8). Se edita a mano y se regenera con `mise run synthetic:generate`.
format_version: 1
tenant_id: sunmeadow
language: en
part_key: endorsements
texts:
- source_id: AP-PAP-2026-END-1-DEF.COVERED_AUTO
  kind: endorsement
  clause_key: DEF.COVERED_AUTO
  part: Endorsements
  version: '2026.1'
  text: For this policy, a vehicle you buy during the policy period is a covered auto if you tell us about
    it within 45 days of taking delivery, instead of 20.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-END-2-D.EXCL.5
  kind: endorsement
  clause_key: D.EXCL.5
  part: Endorsements
  version: '2026.1'
  text: The tire exclusion does not apply to road hazard damage, such as a puncture or a blowout caused
    by a pothole. We pay up to COP 400,000 per tire, minus the partial-loss-by-damage deductible.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-END-3-D.TRANSPORT
  kind: endorsement
  clause_key: D.TRANSPORT
  part: Endorsements
  version: '2026.1'
  text: Transportation expense reimbursement rises to COP 90,000 a day and COP 2,700,000 in total, which
    is 30 days, and it starts on the day of the loss event.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-END-4-B.INS
  kind: endorsement
  clause_key: B.INS
  part: Endorsements
  version: '2026.1'
  text: This section also covers pedestrians struck by your covered auto, for their reasonable medical
    and funeral costs, up to the per-person limit of this section.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-END-5-F.TERMINATION
  kind: endorsement
  clause_key: F.TERMINATION
  part: Endorsements
  version: '2026.1'
  text: When we revoke this policy for any reason other than unpaid premium, we give at least 45 days
    of written notice, more than the legal minimum of ten days.
  refers_to:
  - AP-JUR-2026-J.2
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
