texts:
- source_id: AP-JUR-2026-J.1
  kind: jurisdiction
  clause_key: J.1
  part: Legal framework
  version: '2026.1'
  text: 'In Colombia, every vehicle on a public road must carry the SOAT. The civil liability insurance
    of this policy is voluntary and adds to the SOAT. Autos Poblado does not issue it with limits below
    these minimums: COP 25,000,000 for the death or injury of one person, COP 50,000,000 for all victims
    of one accident and COP 20,000,000 for third-party property damage.'
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-JUR-2026-J.2
  kind: jurisdiction
  clause_key: J.2
  part: Legal framework
  version: '2026.1'
  text: An insurer that decides to revoke a policy must notify the policyholder in writing at least ten
    days in advance and refund the unearned premium (Commercial Code, art. 1071). If the premium is not
    paid, the contract ends automatically (Commercial Code, art. 1068).
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-JUR-2026-J.3
  kind: jurisdiction
  clause_key: J.3
  part: Legal framework
  version: '2026.1'
  text: Anyone who suffers a loss event must report it to their insurer within three business days of
    learning about it. The parties may extend that period but not shorten it (Commercial Code, arts. 1075
    and 829).
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-JUR-2026-J.4
  kind: jurisdiction
  clause_key: J.4
  part: Legal framework
  version: '2026.1'
  text: Drivers must have a current SOAT, which traffic authorities check in the national registry. The
    law does not require the voluntary insurance of this policy to drive.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-JUR-2026-J.5
  kind: jurisdiction
  clause_key: J.5
  part: Legal framework
  version: '2026.1'
  text: Actions arising from the insurance contract expire two years after the interested party learned,
    or should have learned, of the event that gives rise to them, and in any case five years after the
    right arises (Commercial Code, art. 1081).
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
