# (docs/reference/estructura-poliza-autos-colombia.md); ningún texto de ISO, de ACORD
# ni de una aseguradora real (P8). Se edita a mano y se regenera con `mise run synthetic:generate`.
format_version: 1
tenant_id: sunmeadow
language: en
part_key: part_a
texts:
- source_id: AP-PAP-2026-A.INS
  kind: clause
  clause_key: A.INS
  part: Third-party civil liability (responsabilidad civil extracontractual)
  version: '2026.1'
  text: When you or an authorized driver cause, with the covered auto, a traffic accident for which they
    must answer to a third party under the law, Autos Poblado pays the damages for property damage, for
    death or injury to one person and for death or injury to two or more people. We pay up to the limits
    of this section and in excess of what the SOAT covers. An authorized driver is someone who drives
    with your permission and a valid driver's license. We also handle your defense against those claims
    with lawyers we choose, and we may settle with the victim whenever we think it wise. Our defense duty
    stops once our payments reach the limit.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-A.SUPP
  kind: clause
  clause_key: A.SUPP
  part: Third-party civil liability (responsabilidad civil extracontractual)
  version: '2026.1'
  text: In addition to the limit of this section, and without reducing it, we pay the costs of the lawsuit
    that the victim files against you or against us over a covered accident (Commercial Code, art. 1128),
    any court bond needed, and your reasonable out-of-pocket costs when we ask for help with the case,
    including travel to hearings and up to COP 120,000 for each day of work missed. We do not pay them
    if the accident was caused on purpose or is excluded, or if you face the lawsuit against our written
    instruction.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-A.EXCL.A.1
  kind: clause
  clause_key: A.EXCL.A.1
  part: Third-party civil liability (responsabilidad civil extracontractual)
  version: '2026.1'
  text: This section does not cover harm that you or an authorized driver cause on purpose, or harm someone
    else causes following your instructions.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-A.EXCL.A.2
  kind: clause
  clause_key: A.EXCL.A.2
  part: Third-party civil liability (responsabilidad civil extracontractual)
  version: '2026.1'
  text: This section does not cover damage to things you own or are carrying in the vehicle.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-A.EXCL.A.3
  kind: clause
  clause_key: A.EXCL.A.3
  part: Third-party civil liability (responsabilidad civil extracontractual)
  version: '2026.1'
  text: This section does not cover damage to things you have rented, borrowed or are looking after for
    someone else.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-A.EXCL.A.4
  kind: clause
  clause_key: A.EXCL.A.4
  part: Third-party civil liability (responsabilidad civil extracontractual)
  version: '2026.1'
  text: This section does not cover injuries to your own employees that happen while they are working;
    those are handled by the labor and occupational risk systems.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-A.EXCL.A.5
  kind: clause
  clause_key: A.EXCL.A.5
  part: Third-party civil liability (responsabilidad civil extracontractual)
  version: '2026.1'
  text: This section does not cover accidents that happen while the vehicle provides public transport
    service or carries people or goods for pay, including trips booked through a ride app. Friends splitting
    the cost of a trip is not considered pay.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-A.EXCL.A.6
  kind: clause
  clause_key: A.EXCL.A.6
  part: Third-party civil liability (responsabilidad civil extracontractual)
  version: '2026.1'
  text: This section does not cover liability that arises while the vehicle is used in a business that
    sells, repairs, washes, parks or stores vehicles.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-A.EXCL.A.7
  kind: clause
  clause_key: A.EXCL.A.7
  part: Third-party civil liability (responsabilidad civil extracontractual)
  version: '2026.1'
  text: This section does not cover anyone driving a vehicle without the owner's permission or without
    a sound reason to believe they had it.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-A.EXCL.A.8
  kind: clause
  clause_key: A.EXCL.A.8
  part: Third-party civil liability (responsabilidad civil extracontractual)
  version: '2026.1'
  text: This section does not cover accidents during races, speed contests or performance tests, or while
    practicing for them.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-A.EXCL.A.9
  kind: clause
  clause_key: A.EXCL.A.9
  part: Third-party civil liability (responsabilidad civil extracontractual)
  version: '2026.1'
  text: This section does not pay fines, traffic tickets, penalties or damages that a court imposes to
    punish rather than to repair harm.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-A.EXCL.B.1
  kind: clause
  clause_key: A.EXCL.B.1
  part: Third-party civil liability (responsabilidad civil extracontractual)
  version: '2026.1'
  text: This section does not cover driving a motorcycle, a motorized three-wheeler or any other two-
    or three-wheeled vehicle.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-A.EXCL.B.2
  kind: clause
  clause_key: A.EXCL.B.2
  part: Third-party civil liability (responsabilidad civil extracontractual)
  version: '2026.1'
  text: This section does not cover using a vehicle you own that is not listed on the declarations page,
    except a newly bought vehicle that the covered auto definition includes.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-A.EXCL.B.3
  kind: clause
  clause_key: A.EXCL.B.3
  part: Third-party civil liability (responsabilidad civil extracontractual)
  version: '2026.1'
  text: This section does not cover using a vehicle that a family member owns, or that a family member
    has on hand for regular use, unless that vehicle is listed on the declarations page.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-A.LIMIT
  kind: clause
  clause_key: A.LIMIT
  part: Third-party civil liability (responsabilidad civil extracontractual)
  version: '2026.1'
  text: The declarations page sets three limits. The limit for death or injury to one person is the most
    we pay for each victim in one accident. The limit for death or injury to two or more people is the
    most for all victims of that accident. The property damage limit is the most for all third-party property
    damaged. Adding insureds, vehicles or claims does not raise these limits.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-A.OUT_OF_COUNTRY
  kind: clause
  clause_key: A.OUT_OF_COUNTRY
  part: Third-party civil liability (responsabilidad civil extracontractual)
  version: '2026.1'
  text: When a territory endorsement extends the policy to another country and the law there requires compulsory
    insurance to drive, that insurance pays first and this section pays the excess, up to the limit on the
    declarations page. We never pay twice for the same loss.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-A.SOAT
  kind: clause
  clause_key: A.SOAT
  part: Third-party civil liability (responsabilidad civil extracontractual)
  version: '2026.1'
  text: This section does not replace the SOAT, which the law requires of every vehicle on the road. What
    the SOAT covers responds first, and this policy pays the excess, with at least the minimum limits
    set in the "Legal framework" document.
  refers_to:
  - AP-JUR-2026-J.1
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-A.OTHER
  kind: clause
  clause_key: A.OTHER
  part: Third-party civil liability (responsabilidad civil extracontractual)
  version: '2026.1'
  text: If another liability policy also responds to the accident, we split the payment in proportion
    to each policy's limits. For a vehicle you do not own, that vehicle's own insurance pays first and
    we pay what remains.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2025-A.EXCL.A.3.ALT
  kind: distractor
  clause_key: A.EXCL.A.3.ALT
  part: Third-party civil liability (responsabilidad civil extracontractual)
  version: '2025.1'
  text: This section does not cover damage to things you have rented or are looking after for someone
    else; things you borrowed are covered.
  distractor_of: AP-PAP-2026-A.EXCL.A.3
  distractor_reason: near_duplicate
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2025-A.EXCL.B.3
  kind: distractor
  clause_key: A.EXCL.B.3
  part: Third-party civil liability (responsabilidad civil extracontractual)
  version: '2025.1'
  text: This section does not cover using any vehicle that a family member owns, whether or not it is
    listed on the declarations page.
  distractor_of: AP-PAP-2026-A.EXCL.B.3
  distractor_reason: superseded_version
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
