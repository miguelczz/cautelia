# Textos fuente revisados de Autos Poblado, en inglés (U7, F2).
# Redacción propia con la estructura de una póliza de automóviles colombiana
# (docs/reference/estructura-poliza-autos-colombia.md); ningún texto de ISO, de ACORD
# ni de una aseguradora real (P8). Se edita a mano y se regenera con `mise run synthetic:generate`.
format_version: 1
tenant_id: sunmeadow
language: en
part_key: part_b
texts:
- source_id: AP-PAP-2026-B.INS
  kind: clause
  clause_key: B.INS
  part: Medical expenses of occupants
  version: '2026.1'
  text: If you, the authorized driver or another occupant of the covered auto is injured in a traffic accident,
    Autos Poblado pays their reasonable medical, hospital and funeral expenses, in excess of what the SOAT
    covers. The expenses must arise within two years of the accident.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-B.EXCL.1
  kind: clause
  clause_key: B.EXCL.1
  part: Medical expenses of occupants
  version: '2026.1'
  text: This section does not pay for injuries suffered on a motorcycle or any other two- or three-wheeled
    vehicle.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-B.EXCL.2
  kind: clause
  clause_key: B.EXCL.2
  part: Medical expenses of occupants
  version: '2026.1'
  text: This section does not pay for injuries suffered while the vehicle provides public transport service
    or carries passengers for pay.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-B.EXCL.3
  kind: clause
  clause_key: B.EXCL.3
  part: Medical expenses of occupants
  version: '2026.1'
  text: This section does not pay for injuries that happen while the vehicle is being used as a home or
    as a fixed workplace.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-B.EXCL.4
  kind: clause
  clause_key: B.EXCL.4
  part: Medical expenses of occupants
  version: '2026.1'
  text: This section does not pay for injuries suffered in races, speed contests or performance tests.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-B.LIMIT
  kind: clause
  clause_key: B.LIMIT
  part: Medical expenses of occupants
  version: '2026.1'
  text: The per-person limit on the declarations page is the most we pay toward each injured occupant's
    medical costs from one accident, however many people or vehicles are involved.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-B.OTHER
  kind: clause
  clause_key: B.OTHER
  part: Medical expenses of occupants
  version: '2026.1'
  text: If the SOAT or another medical expenses policy covers the same costs, we pay only what is left
    unpaid after it, up to our limit.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
