texts:
- source_id: AP-PAP-2026-C.INS
  kind: clause
  clause_key: C.INS
  part: Personal accident cover for the driver
  version: '2026.1'
  text: If the authorized driver of the covered auto dies, or is left with a permanent disability, because
    of a traffic accident that happens while driving, Autos Poblado pays the personal accident insured
    value shown on the declarations page. For a permanent disability we pay according to the percentage
    of lost capacity determined by the competent authority. If the driver dies, we pay the driver's beneficiaries.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-C.EXCL.1
  kind: clause
  clause_key: C.EXCL.1
  part: Personal accident cover for the driver
  version: '2026.1'
  text: This section does not cover an accident of the driver while driving a vehicle that is not the
    covered auto.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-C.EXCL.2
  kind: clause
  clause_key: C.EXCL.2
  part: Personal accident cover for the driver
  version: '2026.1'
  text: This section does not cover death or disability that the driver causes to themselves on purpose.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-C.EXCL.3
  kind: clause
  clause_key: C.EXCL.3
  part: Personal accident cover for the driver
  version: '2026.1'
  text: This section does not apply while the vehicle provides public transport service or carries people
    or goods for pay.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-C.EXCL.4
  kind: clause
  clause_key: C.EXCL.4
  part: Personal accident cover for the driver
  version: '2026.1'
  text: This section does not cover anyone driving the vehicle without the owner's permission or without
    a sound reason to believe they had it.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-C.LIMIT
  kind: clause
  clause_key: C.LIMIT
  part: Personal accident cover for the driver
  version: '2026.1'
  text: The most we pay under this section is the personal accident insured value shown on the declarations
    page, once per accident, however many vehicles or people are involved. What the at-fault party pays
    the victim is not subtracted.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-C.OTHER
  kind: clause
  clause_key: C.OTHER
  part: Personal accident cover for the driver
  version: '2026.1'
  text: 'If the driver has other personal accident insurance, each policy pays its own insured value:
    what the others pay does not reduce what we pay.'
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-C.ARBITRATION
  kind: clause
  clause_key: C.ARBITRATION
  part: Personal accident cover for the driver
  version: '2026.1'
  text: If we disagree with you or the beneficiaries about whether a payment is owed, about the degree
    of disability or about the amount, either side may ask for the question to be decided by a single
    arbitrator in Colombia. Each side pays its own costs and half of the arbitrator's fee.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2025-C.INS.ALT
  kind: distractor
  clause_key: C.INS.ALT
  part: Personal accident cover for the driver
  version: '2025.1'
  text: Autos Poblado pays the personal accident insured value only if the authorized driver dies because
