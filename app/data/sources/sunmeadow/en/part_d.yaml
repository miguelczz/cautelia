# Redacción propia con la estructura de una póliza de automóviles colombiana
# (docs/reference/estructura-poliza-autos-colombia.md); ningún texto de ISO, de ACORD
# ni de una aseguradora real (P8). Se edita a mano y se regenera con `mise run synthetic:generate`.
format_version: 1
tenant_id: sunmeadow
language: en
part_key: part_d
texts:
- source_id: AP-PAP-2026-D.INS.COLLISION
  kind: clause
  clause_key: D.INS.COLLISION
  part: Loss of the vehicle by damage and by theft
  version: '2026.1'
  text: 'Autos Poblado pays for damage to the covered auto if you collide with another vehicle or an object,
    or if the vehicle rolls over, even if you caused the crash. It also pays for damage from fire, flood,
    hail, falling objects, vandalism, broken glass or hitting an animal. In a partial loss, you pay the
    partial-loss-by-damage deductible on the declarations page: the deductible is the share of the loss
    that you bear.'
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-D.INS.THEFT
  kind: clause
  clause_key: D.INS.THEFT
  part: Loss of the vehicle by damage and by theft
  version: '2026.1'
  text: We also pay for theft of the covered auto, minus the partial-loss-by-theft deductible on the declarations
    page. It is a total loss by theft if the vehicle disappears and does not turn up after the report,
    and a partial loss by theft if parts or accessories are stolen.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-D.TRANSPORT
  kind: clause
  clause_key: D.TRANSPORT
  part: Loss of the vehicle by damage and by theft
  version: '2026.1'
  text: If your covered auto suffers a total loss by damage or theft, we reimburse what you spend getting
    around in the meantime, up to COP 60,000 a day and COP 1,800,000 in total, which is 30 days. Reimbursement
    starts on the third day after the loss event.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-D.EXCL.1
  kind: clause
  clause_key: D.EXCL.1
  part: Loss of the vehicle by damage and by theft
  version: '2026.1'
  text: This section does not cover damage that happens while the vehicle provides public transport service
    or carries people or goods for pay.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-D.EXCL.2
  kind: clause
  clause_key: D.EXCL.2
  part: Loss of the vehicle by damage and by theft
  version: '2026.1'
  text: This section does not cover wear from use, rust, lack of maintenance, or mechanical or electrical
    failure, unless it results from a theft or another covered loss.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-D.EXCL.3
  kind: clause
  clause_key: D.EXCL.3
  part: Loss of the vehicle by damage and by theft
  version: '2026.1'
  text: This section does not cover sound systems, screens, navigation units or other electronics that
    were not installed at the factory.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-D.EXCL.4
  kind: clause
  clause_key: D.EXCL.4
  part: Loss of the vehicle by damage and by theft
  version: '2026.1'
  text: This section does not cover personal belongings inside the vehicle, such as clothing, tools, cash
    or phones.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-D.EXCL.5
  kind: clause
  clause_key: D.EXCL.5
  part: Loss of the vehicle by damage and by theft
  version: '2026.1'
  text: This section does not cover damage limited to the tires, such as flats or blowouts, unless it
    comes from fire, theft or vandalism.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-D.EXCL.6
  kind: clause
  clause_key: D.EXCL.6
  part: Loss of the vehicle by damage and by theft
  version: '2026.1'
  text: This section does not cover losing the vehicle to seizure, impoundment or destruction ordered
    by an authority.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-D.EXCL.7
  kind: clause
  clause_key: D.EXCL.7
  part: Loss of the vehicle by damage and by theft
  version: '2026.1'
  text: This section does not cover damage caused by war, rebellion, organized terrorism or nuclear energy.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-D.EXCL.8
  kind: clause
  clause_key: D.EXCL.8
  part: Loss of the vehicle by damage and by theft
  version: '2026.1'
  text: This section does not cover damage suffered in races, speed contests or performance tests, or
    while practicing for them.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-D.EXCL.9
  kind: clause
  clause_key: D.EXCL.9
  part: Loss of the vehicle by damage and by theft
  version: '2026.1'
  text: This section does not cover parts, accessories or modifications added to the vehicle without telling
    us, such as custom wheels, altered suspension or engine upgrades.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-D.EXCL.10
  kind: clause
  clause_key: D.EXCL.10
  part: Loss of the vehicle by damage and by theft
  version: '2026.1'
  text: This section does not cover damage that you or a family member cause to the vehicle on purpose.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-D.EXCL.11
  kind: clause
  clause_key: D.EXCL.11
  part: Loss of the vehicle by damage and by theft
  version: '2026.1'
  text: This section does not cover damage caused by loading the vehicle beyond the weight its manufacturer
    allows.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-D.EXCL.12
  kind: clause
  clause_key: D.EXCL.12
  part: Loss of the vehicle by damage and by theft
  version: '2026.1'
  text: This section does not cover theft when the vehicle was left unlocked with the keys inside or with
    the engine running in a public place.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-D.EXCL.13
  kind: clause
  clause_key: D.EXCL.13
  part: Loss of the vehicle by damage and by theft
  version: '2026.1'
  text: This section does not cover flood damage when the driver entered a road that authorities had closed
    or marked as flooded.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-D.LIMIT
  kind: clause
  clause_key: D.LIMIT
  part: Loss of the vehicle by damage and by theft
  version: '2026.1'
  text: The most we pay for a loss event is the insured value, which is the vehicle's commercial value
    in the Fasecolda Value Guide on the date of the loss event. If repairing the vehicle costs 75% or
    more of that value, it is a total loss. If it costs less, it is a partial loss and we pay the repair
    or the replacement of the parts with equivalent ones.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-D.PAYMENT
  kind: clause
  clause_key: D.PAYMENT
  part: Loss of the vehicle by damage and by theft
  version: '2026.1'
  text: We choose whether to pay the loss in cash or to arrange the repair or replacement ourselves. We
    pay within one month of the day you prove the loss event and its amount (Commercial Code, art. 1080).
    If the loss is total, the vehicle or what remains of it, which is the salvage, becomes ours and you
    sign the transfer. If a stolen vehicle turns up before we pay, we give it back to you and pay for
    any damage it suffered.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-D.NO_BAILEE
  kind: clause
  clause_key: D.NO_BAILEE
  part: Loss of the vehicle by damage and by theft
  version: '2026.1'
  text: This coverage does not benefit anyone who has the vehicle in their care as a business, such as
    a repair shop, a parking garage or a car transport company; if they caused the damage, we may recover
    it from them.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-D.OTHER_SOURCES
  kind: clause
  clause_key: D.OTHER_SOURCES
  part: Loss of the vehicle by damage and by theft
  version: '2026.1'
  text: If another policy or source covers the same loss, we pay only our share, in proportion to our
    limit against the total.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-D.APPRAISAL
  kind: clause
  clause_key: D.APPRAISAL
  part: Loss of the vehicle by damage and by theft
  version: '2026.1'
  text: If we and you disagree on the amount of a loss, each side names an appraiser and the two appraisers
    choose a third. What any two of the three agree on binds both sides. Each side pays its own appraiser
    and half of the third.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2025-D.EXCL.1.ALT
