# Textos fuente revisados de Autos Poblado, en inglés (U7, F2).
# Redacción propia con la estructura de una póliza de automóviles colombiana
# (docs/reference/estructura-poliza-autos-colombia.md); ningún texto de ISO, de ACORD
# ni de una aseguradora real (P8). Se edita a mano y se regenera con `mise run synthetic:generate`.
format_version: 1
tenant_id: sunmeadow
language: en
part_key: part_e
texts:
- source_id: AP-PAP-2026-E.DUTIES.A.1
  kind: clause
  clause_key: E.DUTIES.A.1
  part: Duties after a loss event
  version: '2026.1'
  text: Tell us about the loss event within three business days of learning about it, as the legal framework
    sets (Commercial Code, art. 1075).
  refers_to:
  - AP-JUR-2026-J.3
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-E.DUTIES.A.2
  kind: clause
  clause_key: E.DUTIES.A.2
  part: Duties after a loss event
  version: '2026.1'
  text: Tell us how, when and where it happened, and which vehicles and people were involved.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-E.DUTIES.A.3
  kind: clause
  clause_key: E.DUTIES.A.3
  part: Duties after a loss event
  version: '2026.1'
  text: Give us the name and a way to reach any injured person and any witness you know of.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-E.DUTIES.B.1
  kind: clause
  clause_key: E.DUTIES.B.1
  part: Duties after a loss event
  version: '2026.1'
  text: Work with us as we look into the claim and as we defend any claim made against you.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-E.DUTIES.B.2
  kind: clause
  clause_key: E.DUTIES.B.2
  part: Duties after a loss event
  version: '2026.1'
  text: Send us right away a copy of any notice, summons or lawsuit you receive about the loss event,
    including a summons to a conciliation hearing.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-E.DUTIES.B.3
  kind: clause
  clause_key: E.DUTIES.B.3
  part: Duties after a loss event
  version: '2026.1'
  text: If the claim involves injuries, attend the medical exams we request, with doctors we pay for,
    as often as is reasonable.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-E.DUTIES.B.4
  kind: clause
  clause_key: E.DUTIES.B.4
  part: Duties after a loss event
  version: '2026.1'
  text: Give us the evidence that the loss event happened and what it cost (Commercial Code, art. 1077),
    a written account of the loss if we ask for one, and your authorization to obtain your medical records
    if there were injuries.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-E.DUTIES.C.1
  kind: clause
  clause_key: E.DUTIES.C.1
  part: Duties after a loss event
  version: '2026.1'
  text: If the accident leaves injured or dead people, or the vehicle at fault drove off without being
    identified, tell the traffic authority within 24 hours and ask for the accident report.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-E.DUTIES.C.2
  kind: clause
  clause_key: E.DUTIES.C.2
  part: Duties after a loss event
  version: '2026.1'
  text: Do not admit liability, settle or pay anything to the third party without our written authorization.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-E.DUTIES.D.1
  kind: clause
  clause_key: E.DUTIES.D.1
  part: Duties after a loss event
  version: '2026.1'
  text: Take reasonable steps to keep the vehicle from further damage (Commercial Code, art. 1074); we
    pay back what you spend doing so.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-E.DUTIES.D.2
  kind: clause
  clause_key: E.DUTIES.D.2
  part: Duties after a loss event
  version: '2026.1'
  text: If the vehicle or any of its parts was stolen, report it to the competent authority immediately.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-E.DUTIES.D.3
  kind: clause
  clause_key: E.DUTIES.D.3
  part: Duties after a loss event
  version: '2026.1'
  text: Let us see and appraise the vehicle before you repair it or get rid of it.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2025-E.DUTIES.A.1.ALT
  kind: distractor
  clause_key: E.DUTIES.A.1.ALT
  part: Duties after a loss event
  version: '2025.1'
  text: Tell us about any loss event within 30 days; after that, the notice is no longer accepted.
  distractor_of: AP-PAP-2026-E.DUTIES.A.1
  distractor_reason: near_duplicate
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
