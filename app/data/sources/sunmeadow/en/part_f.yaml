# Textos fuente revisados de Autos Poblado, en inglés (U7, F2).
# Redacción propia con la estructura de una póliza de automóviles colombiana
# (docs/reference/estructura-poliza-autos-colombia.md); ningún texto de ISO, de ACORD
# ni de una aseguradora real (P8). Se edita a mano y se regenera con `mise run synthetic:generate`.
format_version: 1
tenant_id: sunmeadow
language: en
part_key: part_f
texts:
- source_id: AP-PAP-2026-F.BANKRUPTCY
  kind: clause
  clause_key: F.BANKRUPTCY
  part: General conditions
  version: '2026.1'
  text: If you become insolvent, Autos Poblado still owes what this policy covers. For civil liability,
    the payment is for the victim (Commercial Code, art. 1127).
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-F.CHANGES
  kind: clause
  clause_key: F.CHANGES
  part: General conditions
  version: '2026.1'
  text: This contract changes only in writing, through an endorsement we issue. You tell us in writing
    about any change that alters the risk, such as a change in how the vehicle is used, and we adjust
    the premium from the date of the change. Notices are sent to the address or email you gave us.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-F.FRAUD
  kind: clause
  clause_key: F.FRAUD
  part: General conditions
  version: '2026.1'
  text: You described the state of the risk when buying the policy, and you must have done so truthfully.
    We give no coverage to anyone who knowingly lied about or hid an important fact about the accident,
    the loss or the state of the risk; if the inaccuracy was in good faith, the payment may be reduced
    as the law provides (Commercial Code, art. 1058).
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-F.LEGAL_ACTION
  kind: clause
  clause_key: F.LEGAL_ACTION
  part: General conditions
  version: '2026.1'
  text: The rights arising from this policy expire within the periods the law sets (Commercial Code, art.
    1081), and no one may sue without first meeting the duties the policy sets.
  refers_to:
  - AP-JUR-2026-J.5
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-F.RECOVERY
  kind: clause
  clause_key: F.RECOVERY
  part: General conditions
  version: '2026.1'
  text: When we pay for harm that someone else caused, we take your place to collect what we paid from
    that person, up to that amount (Commercial Code, art. 1096). You help us do so and do nothing to undermine
    it.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-F.PERIOD_TERRITORY
  kind: clause
  clause_key: F.PERIOD_TERRITORY
  part: General conditions
  version: '2026.1'
  text: The policy covers loss events that happen during the policy period shown on the declarations page
    and within the territory of Colombia. There is no coverage outside Colombia unless a territory endorsement
    extends it to another country.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-F.TERMINATION
  kind: clause
  clause_key: F.TERMINATION
  part: General conditions
  version: '2026.1'
  text: You may revoke the policy at any time by telling us in writing. We may revoke it only with the
    advance notice the legal framework requires, and we refund the premium for the time that had not yet
    run. If the premium is not paid on time, the policy ends automatically (Commercial Code, art. 1068).
  refers_to:
  - AP-JUR-2026-J.2
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-F.TRANSFER
  kind: clause
  clause_key: F.TRANSFER
  part: General conditions
  version: '2026.1'
  text: If you sell the covered auto, or transfer your rights under this policy, the insurance does not
    pass to the buyer or to anyone else without our written consent.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
- source_id: AP-PAP-2026-F.TWO_POLICIES
  kind: clause
  clause_key: F.TWO_POLICIES
  part: General conditions
  version: '2026.1'
  text: If two or more insurances cover the same loss event, you must tell us about all of them. If they
    are Autos Poblado policies, the most we pay is the highest limit of any single one of them.
  reviewed_at: '2026-11-02'
  reviewed_by: conductor
  drafted_with: claude-sonnet-5-5
