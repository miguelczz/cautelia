# Turnos de los casos sembrados de Autos Poblado en espanol (U7, FD-U7-7, CG-U7-2).
# Escritos a mano. Los datos personales van como marcador ({insured_name}, {plate}...) y
# los llena el generador con la persona y el vehiculo de una poliza emitida (BR7.2).
# Ningun turno de la agente copia una frase fija aprobada: solo preguntas de captura.
format_version: 1
tenant_id: sunmeadow
language: es
part_key: case_turns
texts:
- source_id: SUN-CASE-ES-OPEN
  kind: case_turns
  version: '2026.1'
  text: 'agent: ¿Me dices tu nombre completo y el número de tu póliza?'
  case:
    name: open
    state: open
  reviewed_at: '2026-09-21'
  reviewed_by: conductor
  drafted_with: hand
- source_id: SUN-CASE-ES-CAPTURING
  kind: case_turns
  version: '2026.1'
  text: |-
    agent: ¿Me dices tu nombre completo y el número de tu póliza?
    insured: Soy {insured_name}, la póliza es {policy_number}.
    agent: ¿Cuándo fue el accidente?
    insured: Ayer, como a las seis y cuarenta de la tarde.
    agent: ¿Dónde pasó?
    insured: En la Avenida del Puerto con calle 12.
    agent: Anoto Avenida del Puerto con calle 12. ¿Es correcto?
    insured: Sí, correcto.
    agent: ¿Qué vehículo manejaba y quién lo conducía?
  case:
    name: capturing
    state: capturing
    fields:
      identity_and_policy:
        value: '{insured_name}, póliza {policy_number}'
        status: confirmed
      incident_datetime:
        value: 2026-09-14 18:40
        status: stated
      location:
        value: Avenida del Puerto con calle 12, Corvane
        status: confirmed
    used_by:
    - AC1.6.2
    - AC1.9.1
    - AC4.7.2
    - AC1.10.1
  reviewed_at: '2026-09-21'
  reviewed_by: conductor
  drafted_with: hand
- source_id: SUN-CASE-ES-VERIFYING
  kind: case_turns
  version: '2026.1'
  text: |-
    insured: Buenos días, quiero reportar un choque. Soy {insured_name}, póliza {policy_number}.
    agent: ¿Alguien resultó herido?
    insured: No, nadie.
    agent: ¿Cuándo y dónde fue?
    insured: Hoy a las siete y cuarto de la mañana, en la carrera 5 con calle 40.
    agent: ¿Qué pasó?
    insured: Otro carro se pasó el semáforo en rojo y me pegó en la puerta del conductor.
    agent: ¿Qué vehículo manejaba?
    insured: Mi {vehicle}, placa {plate}. Lo manejaba yo.
    agent: ¿Tienes los datos del otro conductor?
    insured: Sí, se llama {other_name_1} y la placa de su carro es {other_plate_1}.
  case:
    name: verifying
    state: verifying
    fields: &id007
      identity_and_policy: &id001
        value: '{insured_name}, póliza {policy_number}'
        status: confirmed
      incident_datetime: &id002
        value: 2026-09-12 07:15
        status: confirmed
      location: &id003
        value: Carrera 5 con calle 40, Corvane
        status: confirmed
      description:
        value: Otro carro se pasó el semáforo en rojo y le pegó en la puerta del conductor.
        status: stated
      vehicle_and_driver: &id004
        value: '{vehicle}, placa {plate}, lo conducía {insured_first_name}'
        status: confirmed
      other_parties:
        value: Un conductor, {other_name_1}, en un vehículo de placa {other_plate_1}
        status: stated
      injuries: &id005
        value: Sin lesionados
        status: confirmed
    used_by:
    - AC1.14.1
    - AC4.8.1
  reviewed_at: '2026-09-21'
  reviewed_by: conductor
  drafted_with: hand
