# Correcting a fact already given (P4; BR2.1, BR5.1), English turn.
#
# Acceptance criterion: "sorry, it wasn't two but three" replaces the fact and the
# agent says so --"Corrected: three people hurt."-- without asking the corrected
# fact again or asking for confirmation; the sentence names the new value, asks
# nothing, carries no forbidden register and goes before whatever was due next.
#
# Expected verdict: `pass`.
#
# Miguel's decision of 2026-10-06: when the person says "sorry, it wasn't two but
# three", the chat corrects that fact. That the node replaces the value and does
# not ask again is covered by `tests/unit/intake/test_node.py`; this measures what
# the person reads.
#
# Its Spanish pair is `DS-2/es/intake-correction`: same criteria and same target,
# measured per language and never as a combined average (P12). Both turns are
# indexed by the corrected field (`injuries`).
case_key: DS-2/en/intake-correction
dataset: DS-2
language: en
tenant: stonecroft
requires_provider_key: false
axes:
  - intake
  - conversation
script:
  - field_key: injuries
    sequence: 1
    text: "Two people were slightly hurt."
  - field_key: injuries
    sequence: 2
    text: "Sorry, it wasn't two but three people hurt."
expected_verdicts:
  intake_correction: pass
