# Un saludo a secas (US1.1; BR1.1, BR5.1), turno en español.
#
# Criterio de aceptación: "Hola" se reconoce como saludo y como turno sin nada
# que extraer; la respuesta empieza por la frase de saludo del catálogo y sigue
# con la pregunta de seguridad, que es la primera de un siniestro nuevo (BR1.1).
# Ninguna llamada al modelo.
#
# Veredicto esperado: `pass`.
#
# No es compuerta dura por sí solo, pero corre en cada entrega y un caso que pasa a
# fallar es una regresión (definición de regresión de `team.md`). Decisión de
# Miguel del 2026-10-06: la agente contesta lo que le dijeron antes de seguir con
# lo pendiente, sin llamar a ningún modelo para ello.
#
# La pareja en inglés es `DS-2/en/intake-greeting-only`: los mismos criterios y la misma meta,
# medidos por idioma y nunca como promedio combinado (P12).
case_key: DS-2/es/intake-greeting-only
dataset: DS-2
language: es
tenant: stonecroft
requires_provider_key: false
axes:
  - intake
  - conversation
script:
# El turno se indexa por el campo que **estaba pendiente** cuando la persona lo dijo
# (`injuries`): el guion solo admite campos del esquema, y lo social no es un campo.
  - field_key: injuries
    text: "Hola"
expected_verdicts:
  intake_greeting_only: pass
