# The policy looked up in the corpus and the holder confirmed (P3; BR1.2, BR1.6, BR5.1), English turn.
#
# Acceptance criterion: given an issued policy (number, holder and vehicle from
# the synthetic corpus), the agent names all three in a single question, with no
# forbidden register; "Yes, that's me" counts as a yes and "No, that's not me" as
# a no. What the node writes on confirmation is covered by
# `tests/unit/intake/test_node.py`; here what the person reads is measured.
#
# Expected verdict: `pass`.
#
# Miguel's decision of 2026-10-06: the agent knows who the person is from the
# policy they gave, instead of asking for the name separately. Not a hard gate
# on its own, but it runs on every delivery.
#
# Its Spanish pair is `DS-2/es/intake-policy-holder-confirmed`: same criteria and
# same target, measured per language (P12). Turns are indexed by the pending
# field (`identity_and_policy`).
case_key: DS-2/en/intake-policy-holder-confirmed
dataset: DS-2
language: en
tenant: stonecroft
requires_provider_key: false
axes:
  - intake
  - conversation
script:
  - field_key: identity_and_policy
    sequence: 1
    text: "Yes, that's me"
  - field_key: identity_and_policy
    sequence: 2
    text: "No, that's not me"
expected_verdicts:
  intake_policy_holder_confirmed: pass
