# La póliza buscada en el corpus y el titular confirmado (P3; BR1.2, BR1.6, BR5.1), turno en español.
#
# Criterio de aceptación: con una póliza emitida (número, titular y vehículo del
# corpus sintético), la agente la nombra entera en una sola pregunta —número,
# titular y vehículo— sin registro prohibido; «Sí, soy yo» cuenta como sí, y
# «No, yo no soy» como no. Lo que escribe el nodo al confirmar lo prueba
# `tests/unit/intake/test_node.py`; aquí se mide lo que la persona lee.
#
# Veredicto esperado: `pass`.
#
# Decisión de Miguel del 2026-10-06: la agente sabe quién es la persona a partir
# de la póliza que dio, en vez de pedir el nombre aparte. No es compuerta dura
# por sí solo, pero corre en cada entrega.
#
# La pareja en inglés es `DS-2/en/intake-policy-holder-confirmed`: los mismos
# criterios y la misma meta, medidos por idioma (P12). Los turnos se indexan por
# el campo pendiente (`identity_and_policy`).
case_key: DS-2/es/intake-policy-holder-confirmed
dataset: DS-2
language: es
tenant: stonecroft
requires_provider_key: false
axes:
  - intake
  - conversation
script:
  - field_key: identity_and_policy
    sequence: 1
    text: "Sí, soy yo"
  - field_key: identity_and_policy
    sequence: 2
    text: "No, yo no soy"
expected_verdicts:
  intake_policy_holder_confirmed: pass
