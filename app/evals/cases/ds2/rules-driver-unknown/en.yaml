# Doubtful driver, from the case field to the category, English turn. A relative with no name, a single first name, an incomplete name, a negation, an "I don't know" or a policy that declares no drivers do not say clearly whether the driver is listed: the `unlisted_driver` input stays absent and the driver rule does not fire. It is the case that catches the costly error: saying the driver is listed (or not) without knowing.
#
# Criterio de aceptacion: sobre las filas `driver-unknown/*` de
# `app/evals/fixtures/rules/en.yaml`, el campo `vehicle_and_driver` del caso y los
# conductores que declara la poliza se derivan a `unlisted_driver` con la misma funcion del
# aplicativo, el insumo sale como `unknown` (ausente, ni falso ni verdadero) y el motor real de
# la aseguradora de cada fila da la categoria declarada en ella.
#
# Veredicto esperado: `pass`. Pasa tambien antes de que exista la derivacion (sin el insumo la
# regla no dispara), y por eso su trabajo no es fallar primero sino romperse si alguien amplia la
# derivacion hasta decir «figura» o «no figura» ante una duda.
#
# La pareja en espanol es `DS-2/es/rules-driver-unknown`:
# los mismos escenarios y la misma meta, medidos por idioma y nunca como promedio
# combinado (P12).
case_key: DS-2/en/rules-driver-unknown
dataset: DS-2
language: en
tenant: stonecroft
requires_provider_key: false
axes:
  - rules-engine
  - driver-derivation
expected_verdicts:
  triage_from_driver_unknown: pass
