# En el chat, con casi todo dicho, la agente pide solo lo que todavia falta.
#
# Ya estan anotados heridos, identidad, descripcion, carro y terceros; faltan solo cuando y donde. La respuesta nombra
# esos dos y no vuelve a pedir heridos, nombre ni poliza.
#
# Comprension de un mensaje (plan 09, punto 2, 2026-11-03). Decision de Miguel a partir de la revision
# de una persona externa: en el chat, la agente pide **todos los datos que faltan en un solo mensaje**,
# con naturalidad y con sus palabras, y acepta las respuestas en uno o en varios mensajes; cada turno
# pide lo que **todavia** falta. En la llamada sigue de a una pregunta, porque por voz una lista no se
# retiene. Lo hace el modelo, no el codigo: el intento de armar la lista en el codigo se revirtio
# (decision del 2026-10-12: la conversacion la lleva el modelo y el codigo solo valida). La sonda mide
# **cuantos temas nombra la respuesta** (`reply_topics`, con `reply_topics_min` y `reply_topics_max`),
# no que la redaccion sea buena.
# Escrito antes del cambio de la instruccion `conversation`; falla hasta que la instruccion lo pida.
# Lo corre `mise run evals:entender`, con la clave UNTANGLE_ANTHROPIC_API_KEY_EVALS.
# Veredicto esperado: `pass`.
case_key: DS-2/es/understand-claim-ask-only-whats-missing
dataset: DS-2
language: es
tenant: stonecroft
requires_provider_key: true
axes:
- understanding
understanding:
  record_type: claim
  captured:
  - injuries
  - identity_and_policy
  - description
  - vehicle_and_driver
  - other_parties
  last_agent_text: Gracias, ya tengo lo demás. Me falta saber cuándo y dónde fue.
  message: Listo, ya te dije lo que sé. ¿Qué más necesitas?
  wants:
  - continue
  - other
  absent_items:
  - incident_datetime
  - location
  reply_topics:
  - - cuando
    - fecha
  - - donde
    - lugar
    - ubicacion
  reply_topics_min: 2
  reply_avoids_any:
  - herid
  - lastim
  - póliza
  - nombre
expected_verdicts:
  understanding_claim_ask_only_whats_missing: pass
