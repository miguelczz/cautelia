# Si otra persona conducia y no se dice su nombre completo, la agente lo pregunta; no lo inventa.
#
# Comprension de un mensaje. La regla «conductor que no figura en la poliza» solo puede disparar
# cuando el caso trae nombre y apellido de quien conducia (`triage_inputs.unlisted_driver`), y
# «soy yo, pero manejaba mi hijo» a secas dejaba el dato sin poder leerse. Este caso mide la
# primera mitad: el dato queda anotado como lo dijo la persona (lo de C3 no cambia), **ningun
# nombre que nadie dijo** (lectura `unknown` del campo) y la respuesta es una pregunta por el
# nombre. La segunda mitad, el nombre ya dicho, es `understand-other-driver-name-given`.
# Escrito antes del cambio de la instruccion `conversation`; no se ha corrido contra el modelo.
# Lo corre `mise run evals:entender`, con la clave UNTANGLE_ANTHROPIC_API_KEY_EVALS.
# Veredicto esperado: `pass`.
