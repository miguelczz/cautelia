# una pausa, "referente a mi poliza". La primera mitad se entendio como pedir un
# ajustador y la llamada se cerro. Pedir una persona es pedir a **otro**: un asesor,
# un humano, el ajustador.
# Lo corre `mise run evals:entender`, con la clave UNTANGLE_ANTHROPIC_API_KEY_EVALS.
# Veredicto esperado: `pass`.
case_key: DS-2/en/understand-talking-to-you-is-not-a-person
dataset: DS-2
language: en
