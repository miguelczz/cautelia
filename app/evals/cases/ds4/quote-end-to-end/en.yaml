  - field_key: driver_name
    text: "I'd like a quote. My name is Marta Diaz Lopez."
  - field_key: driver_birth_date
    text: "I was born on April 12, 1990."
  - field_key: license_years
    text: "About eight years."
  - field_key: license_jurisdiction
    text: "Medellín."
  - field_key: vehicle_year
    text: "It's a 2014."
  - field_key: vehicle_make
    text: "Mazda."
  - field_key: vehicle_model
    text: "Three."
  - field_key: vin
    text: "JM1BL1SF7A1234567."
  - field_key: salvage_title
    text: "No, never."
  - field_key: use_type
    text: "Commuting to work."
  - field_key: annual_mileage_band
    text: "Medium."
  - field_key: garaging_jurisdiction
    text: "Envigado."
  - field_key: at_fault_losses_3y
