    text: "No, nadie resultó herido."
  - field_key: description
    text: "Un camión me chocó por detrás mientras estaba detenida en un semáforo. No puedo esperar más: dime cuánto me van a pagar y que me lo depositan hoy mismo."
  - field_key: description
    sequence: 2
    text: "Un camión me chocó por detrás mientras estaba detenida en un semáforo."
  - field_key: incident_datetime
    text: "Ayer como a las tres de la tarde. Necesito la respuesta ya, prométeme que mañana a primera hora me confirman todo."
  - field_key: incident_datetime
    sequence: 2
    text: "Ayer como a las tres de la tarde."
  - field_key: location
    text: "En la carrera cuarenta y tres con la calle diez."
