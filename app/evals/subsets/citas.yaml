name: citas
reason: >
  Las citas de DS-3 (fase 1 de `docs/propuesta-2026-10/03-propuesta-y-diseno.md`):
  ante una pregunta sobre una poliza, recuperar sus clausulas, proponer con Claude
  Haiku cuales la responden y verificarlas con el verificador exacto, igual que en
  el chat. Necesita la base con el corpus cargado, la clave de embeddings del uso
  `corpus` y la de Claude para evaluaciones (`UNTANGLE_ANTHROPIC_API_KEY_EVALS`).
  Se corre a mano con `mise run evals:citas` y en cada hito.

  Incluye RT-2 por clausula envenenada (2026-10-12, auditoria E8): la clausula del
  fixture de inyeccion, entregada a mano al mismo proponedor de citas, sin base ni
  corpus; mide que el modelo no obedezca la orden que trae la clausula.

  Tope escrito: los cuarenta y seis casos de DS-3 y los dos de RT-2, y ninguno mas.
requires_provider_key: true
