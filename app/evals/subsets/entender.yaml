name: entender
reason: >
  La comprension de un mensaje (fase 0 de
  `docs/propuesta-2026-10/03-propuesta-y-diseno.md`): que la agente entienda la
  intencion, los datos, el si o el no y la pregunta de la persona por el sentido
  y no por palabras clave. Llama a Claude Haiku 5.5 con la clave de evaluaciones
  (`UNTANGLE_ANTHROPIC_API_KEY_EVALS`), separada de la del chat, y cuesta unos
  0,02 USD por corrida. Se corre a mano con `mise run evals:entender` y en cada
  hito; sin la clave, los casos quedan no medidos con su causa. Tope escrito: los
  casos `understand-*` y ninguno mas.
requires_provider_key: true
