name: smoke
reason: >
  Camino de arranque de NFR21: la lista mas corta que demuestra que el sistema
  funciona, ejecutable SIN clave de ningun proveedor. La regla de admision es
  esa y solo esa: entra el caso que se resuelve sin llamar a ningun modelo.

  Arranca con los chequeos deterministas que U1 ya puede producir (decision CG-2
  del plan). Una lista vacia habria producido un reporte de cero casos, y el
  primer Bolt no podria demostrar su propio criterio de terminado.

  Tope escrito: un caso por chequeo y por idioma. Una lista que crece sin control
  deja de ser un arranque rapido, y el fallo seria silencioso -- se notaria como
  un cronometro que sube, meses despues.

  U10 anade sus veintiocho casos --catorce comprobaciones de los controles de
  cumplimiento, una por idioma-- porque cumplen la regla: se resuelven con
  reglas, sin modelo, sin base de datos y sin los modelos de lenguaje de la
  redaccion. Son compuertas duras (NFR9.1, NFR12.2), y por eso corren en cada
  entrega y no por hito.

  U9 anade sus doce casos --seis escenarios del motor de reglas, uno por
  idioma-- por la misma regla: la categoria de un caso la deciden reglas
  versionadas, sin modelo y sin base de datos, y una de ellas es compuerta dura
  (AC1.17.3: una regla de dinero nunca cierra directo).

  U11 anade sus dieciseis casos --ocho criterios de la captura, uno por
  idioma-- desde la tanda 2 (`code-generation-plan.md`, paso 9): el bloque que
  toca, la lectura de confirmacion, el tono y la composicion son codigo
  determinista sobre un caso simulado en memoria (`intake_probes.py`), sin
  modelo y sin base de datos. Tres son compuerta dura (BR5.4, BR1.5, BR5.3).
  El 2026-10-06 suma catorce mas --siete criterios de conversacion, uno por
  idioma--: saludo, agradecimiento, despedida, pregunta por el avance, el
  "no, asi esta bien" que confirma, lo social dicho en el otro idioma, y la
  poliza buscada en el corpus con su titular confirmado; todos
  reconocidos por reglas versionadas, sin modelo (decision de Miguel).

  U14 anade sus cuatro casos --la explicacion de un caso derivado y las acciones
  que ofrece un caso, uno por idioma-- por la misma regla: los dos se resuelven
  con funciones puras sobre escenarios estructurados
  (`app/evals/fixtures/inbox/`), la configuracion versionada de cada aseguradora
  y el catalogo de textos. **Sin base de datos**, que es lo que los deja entrar:
  lo que esta unidad prueba con base --el aislamiento, la decision, el enlace--
  vive en sus pruebas de integracion y no aqui.
  U19 anade sus doce casos --seis criterios de la cotizacion, uno por idioma-- por la misma
  regla: la elegibilidad, la derivacion con sus umbrales por los dos lados, la razon en
  lenguaje llano, la negativa a dar un precio y la cotizacion apagada son codigo y frases
  del catalogo sobre escenarios estructurados (`app/evals/fixtures/quote/`), con la
  guardia de salida de verdad y **sin base de datos ni modelo**. Dos son compuerta dura
  (AC6.2.2, AC6.2.4). Los dos casos de canal de DS-4 piden la clave del proveedor y no
  entran.

  El 2026-10-13 suman seis casos --tres criterios del recorrido del campo de heridos del
  caso a la categoria, uno por idioma--: la derivacion de `injuries_present` es una funcion
  pura sobre el texto guardado, y el motor es el real; sin modelo y sin base.

  El mismo dia suman otros cuatro --dos criterios del final del recorrido, uno por idioma:
  cerrar solo o dejar con un ajustador--: la decision de que hacer con el caso es una
  funcion pura sobre la categoria, la decision de cierre y las reglas disparadas.

  Y otros seis --tres criterios del conductor, uno por idioma: figura, no figura y no se
  sabe--: la derivacion de `unlisted_driver` es una funcion pura sobre el texto guardado y
  los conductores que declara la poliza, y el motor es el real; sin modelo y sin base.

  Los cuatro casos de la poliza que el reconocedor entrega mal (2026-10-13) entraron aqui y
  salieron el 2026-10-29: corren el nodo `intake` de verdad, que tapa lo que guarda, y por eso
  necesitan los modelos de la redaccion. Rompian la regla de arriba sin que nada lo avisara,
  porque `verify` instala los modelos; lo aviso `fresh-clone`, en rojo desde el 2026-10-19, y
  tambien fallaba el `mise run bootstrap` de cualquiera que clonara el repositorio. Viven en
  `captura-con-redaccion`, que la compuerta de cada entrega corre junto a este.
