run = "uv run --project app/backend pytest -c app/backend/pyproject.toml app/backend/tests/unit/intake app/backend/tests/integration/u11"

[tasks."test:u12"]
description = "Solo las pruebas de la unidad U12 (runtime del grafo: tablas, ejecutor, ritmos y puntos de control)"
# **Ninguna prueba llama al proveedor**: los fallos --tiempo agotado, cuota,
# caida, respuesta mal formada-- se inyectan con dobles deterministas (CG-U12-3).
# Un ejecutor que solo se pudiera probar con el proveedor real no se podria
# probar en rojo.
#
# La mitad de esta unidad es de integracion y no por gusto: los puntos de
# control, su aislamiento, los arrendamientos y la reanudacion tras el reinicio
# **no se pueden comprobar sin base de datos**, y es la razon por la que esta
# unidad se construye con Docker delante y no en una sesion de la nube
# (CG-U12-1). La otra mitad -- el estado tipado, la transicion y el ejecutor
# comun de paso 4 -- es unitaria, con dobles en vez de base: `tests/unit/orchestration`.
#
# No entra en el guion de verificacion, igual que las demas `test:uN`: el paso 5
# ya corre la suite entera con `mise run cov`.
run = "uv run --project app/backend pytest -c app/backend/pyproject.toml app/backend/tests/unit/orchestration app/backend/tests/integration/u12"

[tasks."corpus:ingest"]
