# `operations` va en plan gratuito, y la parada real es la cuota de su proyecto
# en el proveedor: si se agota, el comando se detiene y se retoma otro dia
# (CG-U7-7).
run = "uv run --env-file .env --project app/backend python -m untangle.server.synthetic_draft"

[tasks."synthetic:fingerprints"]
description = "Saca las huellas de los specimens de tmp/specimens/ y guarda solo sus hashes (BR5.1): mise run synthetic:fingerprints -- --specimen <ruta> <formulario> <edicion> <publicador> <AAAA-MM-DD> [--specimen ...]"
# A mano, cuando Miguel deja los specimens en `tmp/specimens/`, que git ignora.
# Sin `--specimen`, vuelve a sacarlas de los specimens que ya declara el archivo
# de huellas, buscandolos por el hash de cada archivo. Imprime recuentos, nunca
# texto de un specimen (SEC-U7.2). Vive en `untangle.workspace` y no en el
# generador: es el unico comando que sabe llegar a `tmp/specimens/`, y ningun
# modulo de la composicion puede conocer `tmp/` (BR2.3).
run = "uv run --project app/backend python -m untangle.workspace.synthetic_fingerprints"

[tasks."synthetic:sample"]
description = "Elige con semilla registrada las diez clausulas por emisora que revisa Miguel (BR5.4): mise run synthetic:sample -- --date AAAA-MM-DD"
# Escribe `app/data/sources/reviews/<aseguradora>-<fecha>.yaml` **sin veredicto**;
# Miguel anota el suyo, la fecha y el commit, y `synthetic:generate` lo copia al
# manifiesto. La fecha entra por argumento porque el generador no lee el reloj
# (BR1.1). Nunca sobrescribe una muestra que ya existe: puede llevar su veredicto.
run = "uv run --project app/backend python -m untangle.synthetic_data.cli sample"

[tasks."synthetic:seed"]
description = "Carga los casos sembrados por la API de U4 con origen generator (BR6.3)"
# Vive en la raiz de composicion y no en el generador (FD-U7-9): el generador esta
# debajo del registro del caso en el contrato de capas, y la raiz es la que puede
# usar la API de U4 y construir el cifrador. Cada turno se redacta antes de
# anexarlo, y nada se escribe con SQL directo. Es idempotente: un caso que ya
# esta en su estado se deja como esta, salvo que pase por la decision y no tenga
# evaluacion de reglas: esa se le completa (no borra nada ni cambia su numero).
# El que pasa por la decision queda con la evaluacion de las reglas reales de su
# aseguradora, hecha con los insumos del caso; lo que den las reglas es lo que
# se guarda, aunque no cuadre con como esta sembrado el caso.
#
# Necesita la base del proyecto y la clave de cifrado de los campos del caso
# (`UNTANGLE_DATABASE_URL` y `UNTANGLE_CASE_FIELD_ENCRYPTION_KEY`), que carga `uv`
# del `.env` local; el codigo no lo lee. Sin alguna de las dos falla nombrandola.
run = "uv run --env-file .env --project app/backend python -m untangle.server.synthetic_seed"

[tasks."voice:contract-live"]
description = "Prueba de contrato de la voz contra Deepgram y Cartesia de verdad (a mano, por hito)"
# **No es una compuerta y nunca corre en GitHub Actions** (BR6.2): gasta unos
# caracteres y segundos del saldo gratuito y depende de la red. Pasa por el techo
# y el registro de gasto como cualquier llamada de voz.
#
# `--record` vuelve a capturar las respuestas grabadas de `test:u15`: se corre una
# vez, cuando cambia el contrato de un proveedor, y el resultado se commitea
# (CG-U15-3).
#
# Lee las dos claves del uso `voice` del `.env` local, que carga `uv` al invocar
# el comando; el codigo no lo lee.
#
# **Sobre el libro de gasto de la base del proyecto** (2026-10-13), igual que el
# aplicativo servido: el techo lee el acumulado real y lo gastado queda anotado.
# Hasta entonces corria con `--ledger ephemeral`, un libro desechable que
# empezaba en cero y se borraba al terminar. Sin la base levantada el comando no
# llama: la voz falla cerrada. Imprime lo que gasto la corrida y el acumulado.
run = "uv run --env-file .env --project app/backend python -m untangle.server.voice_cli contract-live"

[tasks."voice:say"]
description = "Sintetiza una frase con la voz de una aseguradora: mise run voice:say -- --tenant <id> [--language es|en] [--mode primary|fallback] [--text '...'] [--no-play]"
# La demostracion de B18 (BR6.3): el camino real del aplicativo --configuracion,
# fabrica, techo, adaptador y gasto--. El audio queda en `tmp/voice/`, que git
# ignora, como WAV, y se reproduce si la maquina tiene reproductor; `--no-play`
# solo lo guarda. Gasta los caracteres de la frase, y los imprime con su precio.
#
# Sobre el libro de gasto de la base del proyecto, igual que `voice:contract-live`.
run = "uv run --env-file .env --project app/backend python -m untangle.server.voice_cli say"

[tasks."voice:call-live"]
description = "Corre un caso de DS-5 por el transporte de voz: mise run voice:call-live -- --case DS-5/en/003 --tenant <id> --recordings <carpeta>"
# **No es una compuerta y nunca corre en GitHub Actions.** DS-5 corre por hito y
# no por entrega (`team.md`): las grabaciones son de personas reales, viven fuera
# del repositorio y medirlas gasta saldo de voz. Pasa por el techo y el registro
# de gasto como cualquier llamada.
#
# Lo unico que sustituye del camino real es el socket: el reconocedor, la
# sintesis, el ritmo del turno y la transcripcion son los de produccion.
#
# Sobre el libro de gasto de la base del proyecto. Hasta el 2026-10-13 levantaba
# un libro desechable y nunca lo abria: el techo no se podia leer y la llamada se
# cerraba antes de empezar.
run = "uv run --env-file .env --project app/backend python -m untangle.server.voice_cli call-live"

[tasks."voice:simular"]
description = "Una llamada simulada por el camino real (cuesta unos centavos; no corre en GitHub): mise run voice:simular -- --tenant <id> --guion <archivo.json> [--language es|en] [--detalle]"
# **Gasta dinero y nunca corre en GitHub Actions ni en `verify`**: la voz de quien llama,
# la transcripcion, el modelo y la voz de la agente se pagan de verdad --unos centavos
# por un guion corto--, a nombre de la llamada simulada en el registro de gasto. No es una
# compuerta: es la forma de ver una llamada sin que Miguel tenga que llamar.
#
# Una persona que es un guion JSON (`app/evals/fixtures/voice-sim/`) habla con el reloj
# y el audio en tiempo real por el camino de la llamada de verdad --reconocedor, ciclo,
# grafo y voz--, con la muletilla encendida; lo unico que sustituye es el socket. Imprime
# cada cuadro con su tiempo y, si la llamada se cae, la traza completa; con `--detalle`,
# tambien cada parcial y cada senal de voz del reconocedor. Deja un caso y una
# llamada en la base local. Corre sobre la base y las claves del `.env`, como `dev`.
run = "uv run --env-file .env --project app/backend python -m untangle.server.voice_cli simular"

[tasks."spend:report"]
description = "Las cuatro agregaciones del gasto, cada una con su conteo de no medidas"
# **No es una compuerta y no entra en el guion** (INF-U5-4): es el productor del
# valor real de NFR14.1. Una compuerta que fallara porque el costo por caso subio
# seria una compuerta sobre una cifra que todavia no tiene linea base, y
# compararla contra la linea base versionada es trabajo de U21.
#
# Lee la base, asi que necesita `UNTANGLE_DATABASE_URL`; sin ella falla
# nombrandola en vez de reportar ceros, que se leerian como "no se ha gastado
# nada".
run = "uv run --project app/backend python -m untangle.workspace.spend_report"

[tasks."spend:reconcile"]
description = "Anota un ajuste conciliado: lo que el proveedor cobro y el libro no tiene. mise run spend:reconcile -- --provider anthropic --use evals_chat --amount 0.24 --note 'consola de Anthropic, 2026-10-13' [--date AAAA-MM-DD] [--dry-run]"
# **A mano, una vez por cifra que no cuadra, y nunca en GitHub Actions ni en el guion.**
# `--amount` es lo que FALTA en el libro, no el total de la consola. Escribe una fila
# de origen `reconciled_adjustment` en el libro de la base del proyecto, que cuenta
# contra el techo igual que el gasto que no quedo anotado. No se borra: `--dry-run`
# ensena el asiento sin escribir. Reintentar el mismo comando no duplica. Necesita
# `UNTANGLE_DATABASE_URL` y la base levantada; sin ellas se detiene sin escribir.
run = "uv run --env-file .env --project app/backend python -m untangle.server.spend_reconcile"

[tasks."activation:report"]
description = "El conteo de activacion por dia, aseguradora e hito (OBS-U6.3)"
# **No es una compuerta y no entra en el guion**, igual que `spend:report`: es el
# productor de una cifra. Solo lee el conteo diario, nunca el avance por sesion
# (BR8.5). Lee la base, asi que necesita `UNTANGLE_DATABASE_URL`; sin ella falla
# nombrandola en vez de reportar ceros, que se leerian como "nadie entro".
run = "uv run --project app/backend python -m untangle.workspace.activation_report"

[tasks."verify:rapido"]
description = "La parte barata del guion: lo que caza casi todo sin calentar la maquina"
# **Por que existe.** `scripts/verify.sh` es la compuerta y no baja: corre la suite
# entera con cobertura contra una base de verdad (2.377 pruebas, ~3 min de CPU
# sostenida) y el arnes de accesibilidad con **tres motores de navegador** en
# paralelo, cada uno con su propio proceso servido y su propia base efimera. Eso en
# un portatil es un ventilador a tope durante varios minutos, y la practica del
# equipo ya dice que correrlo en local es opcional: "la compuerta autoritativa, y la
# unica, es GitHub Actions".
#
# Esto es lo otro: los pasos que no necesitan base ni navegador y que cazan casi
# todo lo que se rompe al escribir codigo --formato, lint, contratos de importacion,
# tipos, las 1.874 pruebas unitarias y los chequeos del arbol--.
#
# **Medido en esta maquina: 2 min 10 s de reloj y 136 s de CPU** (81 s y 79 s antes de
# las once aserciones de arbol del 2026-10-03; casi todo lo que anaden es arranque de
# proceso, no trabajo). Sigue siendo **un nucleo de media**, sin un contenedor ni un
# navegador. La cifra que importa es la segunda: lo que calienta
# un portatil no es que algo tarde, es que gaste ocho nucleos mientras tarda. De ahi
# el techo de trabajadores de `vitest.config.ts`, que bajo su pico del 737 % al 247 %
# a cambio de cinco segundos.
#
# El reparto, por si alguna vez hay que recortar mas: 54 s las pruebas de Python (un
# solo proceso, 78 % de un nucleo), 12 s formato-lint-tipos, 12 s las de pantalla y
# los chequeos del arbol.
#
# **No sustituye al guion**: lo que este no mira --aislamiento por fila, migraciones,
# integracion con base, accesibilidad, cobertura, auditoria de dependencias-- lo
# sigue mirando GitHub Actions en cada entrega, y `scripts/verify.sh` cuando haga
# falta correrlo entero a mano.
#
# **Las once aserciones de arbol se anadieron el 2026-10-03, y las anadio un `main`
# en rojo.** Una prueba nueva fabricaba un valor sellado a mano --lo que PA-8
# prohibe, porque `NewType` se borra en tiempo de ejecucion y esos bytes acaban en
# la columna cifrada sin estarlo-- y `case:constructor` lo caza. No estaba aqui, y
# la lista que se corrio en local era una lista **de memoria**: el fallo no fue
# saltarse una compuerta, fue mantener dos listas de cuales son. Ahora hay una.
# Cuestan 13 s de reloj y 6 s de CPU entre las once, medio nucleo: no mueven el
# costo de este comando. Las que **no** entran siguen fuera por la misma razon que
# antes --`rls:check` y `migrate:check` necesitan base, `audit` necesita red-- y
# esas las sigue mirando GitHub Actions.
run = [
  "mise run fmt:check",
  "mise run lint",
  "mise run types",
  "uv run --project app/backend pytest -c app/backend/pyproject.toml app/backend/tests/unit -q",
  "pnpm --dir app/frontend exec vitest run",
  "mise run copy:check",
  "mise run chat:frases",
  "mise run voice:frases",
  "mise run content:check",
  "mise run tenancy:literals",
  "mise run case:constructor",
  "mise run case:transitions",
  "mise run schema:check",
  "mise run redaction:constructor",
  "mise run redaction:report",
  "mise run contracts:check",
  "mise run env:check",
  "mise run readme:check",
  "mise run synthetic:check",
  "mise run licenses:check",
  "mise run supply:check",
]

[tasks."chat:frases"]
description = "Cada frase que el servidor puede mandar al chat (degradacion, espera, derivacion, error), el chat sabe decirla"
# El chequeo que faltaba: la tabla del chat convierte una clave que no conoce en la
# frase de error, asi que un nodo cuya frase no este ahi le dice a la persona "tuve
# un problema" en vez de lo que el servidor queria decir. Lo vio Miguel usando el
# chat; ninguna prueba lo miraba. Desde el 2026-10-12 mira tambien las claves que
# declara `orchestration/turn.py` (una derivacion nueva se veia como error) y el
# mismo chequeo corre en la suite (`tests/unit/workspace/test_chat_phrases.py`).
run = "uv run --project app/backend python -m untangle.workspace.chat_phrases"

[tasks."voice:frases"]
description = "Cada aviso que el servidor manda por el socket, la consola sabe decirlo"
# El hermano del de arriba, en la misma direccion y con otra fuente: lo que puede
# llegar por el socket es el cuadro `notice`, cuyo vocabulario son los motivos de
# cuota de U5 y los de voz apagada de U15. Una clave que la consola no conozca se
# pierde **en silencio**, a proposito --una clave desconocida es un contrato roto,
# no un caso de ejecucion-- y esto es lo que convierte ese contrato roto en una
# compuerta en vez de un hueco en pantalla.
run = "uv run --project app/backend python -m untangle.workspace.voice_phrases"

[tasks."readme:gen"]
description = "Regenera las dos secciones del README (Como falla y el reporte de evaluacion) desde la linea base vigente"
# Un solo comando con dos modos, como `contracts:gen` y `contracts:check`: el
# arreglo de un README desactualizado es este comando y commitear, nunca editar
# lo que hay entre las marcas (U22, BR4.2).
run = "uv run --project app/backend python -m untangle.workspace.readme_check gen"

[tasks."readme:check"]
description = "Falla, nombrando la seccion, si el README difiere de lo que produce la linea base vigente"
# Sin linea base publicada las dos secciones dicen "no medida" con su causa y el
# chequeo compara contra eso: no se pone rojo por no haber medido todavia. Solo
# compara lo que hay entre las marcas; las seis secciones narrativas son de
# Miguel (FD-U22-9).
run = "uv run --project app/backend python -m untangle.workspace.readme_check check"

[tasks."case:transitions"]
description = "Regenera el diagrama del ciclo de vida y falla si no coincide con el escrito"
# La enmienda de ADR-005 hecha herramienta: un diagrama editado a mano describe
# un ciclo de vida que el codigo no aplica, y ese desacuerdo no lo nota nadie
# porque el dibujo se ve bien y las pruebas pasan.
run = "uv run --project app/backend python -m untangle.workspace.case_transitions"

[tasks."case:constructor"]
description = "Quien fabrica un valor sellado del caso"
# Analisis del arbol sintactico, sin base de datos y sin modelos. Hermano del de
# la redaccion: falla ante las **tres** formas de producir el tipo fuera del
# punto unico de cifrado --el constructor, `cast` y una anotacion con
# `type: ignore`--, porque `NewType` se borra en tiempo de ejecucion y sin esto
# "todo lo personal se cifra antes de persistir" habria que revisarlo a mano en
# cada cambio (PA-8, capa 2 del diseno de seguridad de U4).
run = "uv run --project app/backend python -m untangle.workspace.case_constructor"

[tasks."redaction:report"]
description = "Hallazgos de la redaccion por idioma, por tipo y por reconocedor"
# Por reconocedor, y no solo por tipo: sin esa columna un reconocedor roto se
# esconde detras del respaldo, que tapa el mismo dato y suma al mismo tipo
# (NFR-U3-5). La cifra del respaldo va aparte (NFR11.2) y nunca hay un promedio
# combinado de los dos idiomas (P12). Necesita los modelos.
run = "uv run --project app/backend python -m untangle.workspace.redaction_report"

[tasks."supply:check"]
description = "Comprueba que la espera de tres dias esta viva en los dos gestores (SEC-U1.4)"
# Le pregunta a cada herramienta que valor tiene de verdad, en vez de leer el
# archivo donde se escribio: un ajuste de pnpm en `.npmrc` se ignora en silencio
# desde pnpm 10, y asi el archivo se ve bien sin que el control exista.
run = "uv run --project app/backend python -m untangle.workspace.supply_chain_check"

# --- Cadena de suministro -----------------------------------------------------

[tasks.audit]
description = "Auditoria de dependencias contra vulnerabilidades conocidas"
# Se audita lo que fija el lockfile, no lo que quedo instalado: son la misma
# cosa mientras la instalacion sea reproducible, y auditar el lockfile lo sigue
# siendo el dia que alguien instale a mano.
#
# Excepcion escrita el 2026-10-06: CVE-2026-104873 (GHSA-fvww-7h3r-vfhp) en
# `langgraph-sdk` 0.3.15, que llega de forma transitiva por `langgraph`. La falla
# esta en los decoradores de autorizacion personalizada de un servidor de la API
# de LangGraph (`@auth.on.threads` y compania); el aplicativo no importa
# `langgraph_sdk` en ninguna parte ni levanta ese servidor, asi que el codigo
# vulnerable no se ejecuta. La version corregida (0.4.4) exige `websockets<17` y
# el adaptador de voz necesita `websockets>=17.1` (FD-U15-5), de modo que hoy no
# hay resolucion que la incluya. Se revisa cuando `langgraph-sdk` admita
# websockets 17 o cuando `langgraph` deje de arrastrarla. Un hallazgo nuevo sigue
# bloqueando.
#
# **Su razon y su fecha de revision (2026-11-13) viven en la fila de
# `app/frontend/DEPENDENCIES.md`, seccion "Avisos de seguridad aceptados"**, y
# `mise run supply:check` lee de aqui los `--ignore-vuln`: falla si uno no tiene su
# fila, si la fila ya no tiene aviso, o si su fecha paso. Quitar o anadir un
# `--ignore-vuln` sin tocar esa fila pone la compuerta en rojo.
run = [
  "uv export --project app/backend --format requirements-txt --all-groups --no-emit-project | uv run --project app/backend pip-audit --strict --disable-pip --ignore-vuln CVE-2026-104873 -r /dev/stdin",
  "pnpm --dir app/frontend audit --audit-level high",
]

[tasks."licenses:check"]
description = "La licencia de cada dependencia del arbol resuelto, contra la lista admitida (D-017)"
# Necesita los dos arboles instalados --incluidos los modelos de spaCy, que
# entran por un extra-- porque la licencia se lee del paquete y no de una lista
# escrita a mano. Si falta alguno, el chequeo falla diciendo cual: revisar medio
# arbol es lo que dejo pasar que el modelo de espanol sea GPL.
run = "uv run --project app/backend python -m untangle.workspace.license_check"

[tasks.secrets]
description = "Escaneo de secretos sobre el cambio"
run = "scripts/verify.sh --only secrets"

# --- Servicios locales --------------------------------------------------------

[tasks.dev]
description = "Levanta el aplicativo contra la base local, para usarlo a mano"
# **El proceso real**, no un servidor de desarrollo: la misma raiz de composicion que
# sirve la demo, con los estaticos compilados, la politica de contenido y las
# cabeceras de verdad. Sube las migraciones antes de servir, porque una base sin
# migrar deja la interfaz en "la demo esta despertando".
#
# **Imprime en que direccion escucha.** Sirve en el 8050 y no en el 8000, que es el
# que todo el mundo espera: en esta maquina el 8000 --y el 8001, 8002, 8003 y 8080--
# los tiene otro proyecto, y la demo aterrizaba en un puerto distinto en cada
# arranque, asi que habia que leer la salida para saber a donde ir y decirle a la
# prueba de humo cual era el de hoy. Con uno fijo, las dos apuntan al mismo sitio.
# Lo que **no** arregla: la conversacion del visitante sobrevive al cambio de puerto
# igualmente, porque las galletas no se aislan por puerto. Si el 8050 tambien se
# ocupa, toma el siguiente libre y lo dice; con `-- --port <n>` explicito, ocupado es
# un error
#
# El recorrido completo para usar la bandeja con las manos, en orden:
#
#   mise run services:up                               la base local
#   mise run web:build                                 la interfaz compilada
#   mise run synthetic:seed                            casos con los que trabajar
#   mise run tenancy:credential -- --tenant stonecroft --principal diana
#   mise run dev                                       y abrir la direccion que imprime
#
# La credencial del cuarto paso sale por la salida estandar y se pega como cookie
# `untangle_staff` en el navegador: no se publica y no se guarda en ningun archivo
# (D23). La bandeja vive en `/t/<aseguradora>/inbox` y **no se anuncia en el inicio**,
# porque una bandeja anunciada invitaria a probar credenciales.
#
# Para la pantalla del visitante --la del enlace, sin credencial-- hace falta un
# enlace, y nada lo emite todavia en produccion (es de U13 y U17):
#
#   mise run tenancy:case-link -- --tenant stonecroft --case <id del caso>
#
# Imprime la direccion con el token en el fragmento; se abre tal cual y vale una hora.
# Antes de servir, el reinicio de los datos si el ultimo esta por cumplir 24 horas: en
# local no hay disparador nocturno, y sin el la demo dejaba de aceptar casos nuevos
# al dia siguiente ("el ultimo reinicio de datos no se completo", visto el 2026-10-09).
run = [
  "uv run --env-file .env --project app/backend python -m untangle.server.demo_reset --if-stale",
  "uv run --env-file .env --project app/backend python scripts/servidor-local.py",
]

[tasks.migrate]
description = "Sube las migraciones contra la base local"
# El mismo camino que corre `dev` al arrancar, aparte para cuando solo hace falta
# migrar. `migrate:check` es otra cosa: sube, baja y vuelve a subir contra una base
# efimera, y es la que corre en la compuerta.
run = "uv run --env-file .env --project app/backend python scripts/servidor-local.py --migrate-only"

[tasks."test:u14"]
description = "Solo las pruebas de la unidad U14 (bandeja: cola, vista, correccion, decision y enlace)"
# Casi todas son de integracion y no por gusto: las tres compuertas duras de esta
# unidad --una credencial no ve casos de otra aseguradora, un enlace abre su caso y
# nunca la lista, una firma alterada se responde igual que un caso que no existe-- se
# comprueban **por el punto de entrada** y con la politica de fila delante, asi que no
# se pueden comprobar sin base de datos.
#
# Las pantallas van aparte, con el runner de la interfaz: son el otro extremo de la
# misma unidad y no comparten proceso.
#
# No entra en el guion de verificacion, igual que las demas `test:uN`: el paso 5 ya
# corre la suite entera con `mise run cov`.
run = [
  "uv run --project app/backend pytest -c app/backend/pyproject.toml app/backend/tests/integration/u14",
  "pnpm --dir app/frontend exec vitest run src/pages/inbox",
]

[tasks."services:up"]
description = "Levanta la base de datos local"
run = "docker compose up -d"

[tasks."services:down"]
description = "Detiene los servicios locales"
run = "docker compose down"

[tasks."images:digest"]
description = "Resuelve la huella digital de una etiqueta de imagen: mise run images:digest -- <etiqueta>"
# Anclamos por huella y no por etiqueta porque una etiqueta se puede reescribir
# en el registro. Este comando existe para que subir de version sea correrlo y
# commitear, no buscar la huella a mano.
run = 'docker buildx imagetools inspect "$1" --format "{{.Manifest.Digest}}"'

# --- La compuerta -------------------------------------------------------------

[tasks.verify]
description = "El guion unico de verificacion: los nueve pasos en orden"
run = "scripts/verify.sh"

[tasks."experimento:1"]
description = "Mide el turno de voz completo, tramo por tramo, y decide ADR-008 y ADR-009"
# **No es una compuerta y no entra en el guion de verificacion**: es una medicion
# de una sola vez contra proveedores en vivo, que cuesta saldo y depende de la
# red. Una compuerta que llamara a tres proveedores externos en cada corrida
# seria una compuerta sobre la conectividad y no sobre el codigo.
#
# Necesita `UNTANGLE_VOICE_DEEPGRAM_API_KEY`, `UNTANGLE_VOICE_CARTESIA_API_KEY` y
# `UNTANGLE_VOICE_MODEL_API_KEY` en el entorno; sin alguna falla nombrandola en
# vez de medir a medias. La voz de Catalina la lee de los `tenant.yaml`.
run = "uv run --project app/backend python scripts/experimento-1.py"

[tasks."claves:cifrado"]
description = "Genera la clave de cifrado de los campos del caso y la pone en tu .env sin imprimirla"
# Existe por lo mismo que `claves:voz` y con un motivo propio: la linea que
# documentaba `.env.example` **imprimia la clave**, asi que quedaba en la pantalla,
# en el historial de la terminal y en el registro de cualquier sesion que la viera
# pasar. Una clave impresa se considera comprometida, y aqui no hay proveedor donde
# rotarla: rotarla es generar otra, que es lo que hace este comando.
run = "uv run --project app/backend python scripts/poner-clave-de-cifrado.py"

[tasks."claves:voz"]
description = "Pide las claves de la voz y las pone en tu .env sin imprimirlas; --renombrar pasa las del experimento 1 a sus nombres del aplicativo"
# Existe en vez de un `echo >>` por tres razones que estan escritas en la cabecera
# del guion: comprueba que `.env` esta ignorado antes de escribir, actualiza la
# linea en su sitio en vez de duplicarla, y no imprime nunca el valor.
run = "uv run --project app/backend python scripts/poner-claves-de-voz.py"

[tasks."test:u18"]
description = "Solo las pruebas de la unidad U18 (el espanol y el cambio de idioma)"
# Es la unidad con **menos codigo y mas pruebas** del proyecto, y eso no es un
# accidente del reparto: la mitad de lo que U18 aporta es que lo ya construido se
# comporte igual en el segundo idioma, y eso son pruebas y no codigo nuevo.
#
# Aqui se cronometra PERF-U18.1, que es lo que reconocer el idioma anade al camino
# del turno. `-s` no hace falta: el numero se imprime y pytest lo muestra cuando
# la prueba falla, que es cuando importa leerlo.
#
# Las de la peticion de cambio son unitarias y viven con las de U16 porque son de
# la misma carpeta de codigo; se nombran una por una para que esta tarea no
# arrastre la unidad entera de al lado.
run = [
  "uv run --project app/backend pytest -c app/backend/pyproject.toml app/backend/tests/unit/test_language.py app/backend/tests/unit/voice/test_language_request.py app/backend/tests/unit/voice/test_retry.py app/backend/tests/integration/u18",
]

[tasks."test:u16"]
description = "Solo las pruebas de la unidad U16 (llamada de voz: transporte, sesion, turno y consola)"
# Toda esta unidad son temporizadores --fin del habla, silencios, parada,
# vencimiento del token, ventana de retoma-- y **ninguna prueba espera tiempo
# real**: el reloj entra por argumento. Una prueba que duerme es una que un dia
# falla en la tuberia por estar la maquina ocupada.
#
# Ninguna abre una conexion de red: los proveedores entran por los dobles que
# heredan de los `Protocol` de C-16, no por la red.
#
# No entra en el guion de verificacion, igual que las demas `test:uN`: el paso 5
# ya corre la suite entera con `mise run cov`.
run = [
  "uv run --project app/backend pytest -c app/backend/pyproject.toml app/backend/tests/unit/voice app/backend/tests/integration/u16",
]
