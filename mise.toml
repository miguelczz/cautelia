# que llama al proveedor de embeddings sin que nadie lo haya pedido (FD-U8-5,
# PERF-U8.4). Necesita la clave del uso `corpus` --el suyo propio, no la de
# `operations`, que apunta al modelo de generacion (PASO 0 de la tanda 3)-- y
