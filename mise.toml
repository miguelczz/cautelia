[tasks."ops:check"]
description = "Lee la salud y el gasto del sitio publicado y falla si el reinicio nocturno esta vencido o el gasto cruzo su alerta (a mano: mise run ops:check [-- --base-url <url>] [--tolerar-agotado])"
# Es el mismo archivo que corre cada dia `.github/workflows/chequeo-publico.yml`
# (convencion 10 del equipo): el flujo lo invoca con `python3` directo porque instalar
# el toolchain para correr un guion de biblioteca estandar gastaria mas minutos que el
# chequeo. Solo hace `GET` y no necesita .env, claves ni base de datos.
run = "python3 scripts/chequeo_publico.py"

[tasks."demo:reset"]
description = "El reinicio nocturno de los datos de demostracion: los nueve purgadores y su registro (US5.15)"
# **Ultimo paso del despliegue**, no solo tarea del disparador nocturno: sin
# ningun reinicio exitoso conocido las superficies publicas cierran, y sobre una
# base recien creada esta corrida no tiene nada que borrar y deja el reloj de las
# 24 horas en marcha (BR3.2).
#
# Llama a los nueve purgadores del registro escrito a mano de la raiz de
# composicion y no borra ninguna tabla por su cuenta (BR2.3). Con `-- --dry-run`
# cuenta lo que borraria y **no deja registro**: una corrida de ensayo guardada
# como exitosa reiniciaria el contador sin haber borrado nada.
#
# **Y despues de barrer devuelve los casos sembrados a su estado** (AC5.6.4): el
# que alguien movio decidiendolo en la bandeja vuelve a su sitio, y el que ya esta
# donde dice su archivo no se toca (solo se le completa la evaluacion de reglas
# si no tiene ninguna).
#
# Necesita la base del proyecto y la clave de cifrado de los campos del caso
# (`UNTANGLE_DATABASE_URL`, `UNTANGLE_CASE_FIELD_ENCRYPTION_KEY`), que carga `uv`
# del `.env` local; el codigo no lo lee. Sin la clave **barre igual** --lo que no
# puede faltar es que los datos del visitante se vayan-- y sale distinto de cero
# diciendo que la vitrina se quedo como estaba. Su codigo de salida es lo unico
# que mira el disparador: distinto de cero cuando la corrida no termino limpia.
run = "uv run --env-file .env --project app/backend python -m untangle.server.demo_reset"

[tasks."tenant:provision"]
description = "Da de alta una aseguradora desde su carpeta: valida, ingiere y siembra (US5.1): mise run tenant:provision -- <id>"
# Valida la carpeta **entera antes de crear nada** y nombra el archivo y el campo
# de cada falta (BR1.1): una aseguradora a medias no la borra nada y no la
# completa nada. Invoca `corpus:ingest` en vez de escribir su propia ingesta
# (BR1.3), y es idempotente de verdad: la ingesta pide al proveedor solo lo que
# falta y la siembra deja como esta el caso que ya existe (BR1.2).
#
# Necesita la base, la clave de cifrado de los campos del caso y la clave del uso
# `corpus` (`UNTANGLE_DATABASE_URL`, `UNTANGLE_CASE_FIELD_ENCRYPTION_KEY`,
# `UNTANGLE_CORPUS_MODEL_API_KEY`), que carga `uv` del `.env` local; el codigo no
# lo lee. **No publica ninguna credencial**: dice con que comando se emite cada
# una (D23).
run = "uv run --env-file .env --project app/backend python -m untangle.server.tenant_provision"

