run = "uv run --project app/backend python -m untangle.synthetic_data.cli generate"

[tasks."synthetic:check"]
description = "Regenera en un directorio temporal y compara byte a byte con app/data/ (TECH-U7.1)"
# Lo versionado tiene que ser exactamente lo que produce el generador: un JSON
# corregido a mano en `app/data/` hace fallar esta tarea nombrando el archivo.
# Publica su duracion (TECH-U7.4).
run = "uv run --project app/backend python -m untangle.synthetic_data.cli check"

[tasks."synthetic:draft"]
description = "Pide al modelo un borrador de texto fuente: mise run synthetic:draft -- --tenant <id> --part <parte> [--part ...] [--language es|en] [--variant <v>]"
# **A mano y nunca en GitHub Actions** (BR2.1): llama a Gemini con la clave del
# uso `operations`, por la fabrica, el techo y el registro de gasto de U5. El
# borrador queda en `tmp/synthetic-drafts/`, que git ignora, y ningun comando de
