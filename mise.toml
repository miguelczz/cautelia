# Herramientas y tareas del proyecto.
#
# Este archivo es el contrato entre lo que corre una persona en su maquina y lo
# que corre el flujo de GitHub Actions (convencion 10 del equipo): toda accion
# tiene un nombre aqui, y la tuberia invoca estos comandos en lugar de mantener
# su propia lista de pasos.
#
# Las versiones estan ancladas exactas a proposito: una version que se mueve
# sola cambia el tiempo de arranque entre maquinas sin que nadie tocara el
# proyecto (NFR21).

[tools]
python = "3.13.15"
uv = "0.12.16"
node = "24.21.0"
pnpm = "12.4.2"
# El escaneo de secretos se ancla como cualquier otra herramienta: es el primer
# trabajo del flujo y hoy el unico escaneo del proyecto, asi que su version no
# puede depender de lo que cada maquina tenga instalado.
gitleaks = "8.30.1"

[env]
# El prefijo unico del aplicativo. Toda herramienta declara su alcance como este
# prefijo, nunca como una lista de exclusiones (convencion 1 del equipo).
UNTANGLE_APP_PREFIX = "app"

[settings]
# Espera de versiones recien publicadas: una version publicada hace menos de tres
# dias no se instala (SEC-U1.4). La ventana cubre las primeras horas, que es
# cuando vive el ataque tipico de cadena de suministro, sin convertir cada
# actualizacion en una espera que empuje a saltarse la regla.
minimum_release_age = "3 days"

# --- Arranque -----------------------------------------------------------------

[tasks.bootstrap]
description = "Del clon al reporte: herramientas, dependencias y subconjunto de arranque"
# Tres pasos, no cinco: U1 no crea tablas (decision CG-1), asi que el camino de
# arranque no necesita la base de datos. `services:up` sigue existiendo como
# tarea propia para las unidades que si la necesitan.
run = [
  "mise install",
  "mise run deps:install",
  "mise run evals:run -- --subset smoke",
]

[tasks."deps:install"]
description = "Instala las dependencias de los dos proyectos en modo reproducible"
# Modo reproducible en los dos: falla si el lockfile no coincide, nunca una
# resolucion libre (SEC-U1.3).
#
# **No instala los modelos de lenguaje de U3**, y eso es deliberado: viven en un
# extra, y `--all-groups` no incluye extras. Este es el segundo paso de
# `bootstrap`, o sea el camino del clon al reporte que mide NFR21, y ahi es justo
# donde no queremos 72 MB de descarga (INF-U3-2).
#
# **Lo que sorprende no es que no los instale: es que los quita.** El modo
# reproducible reconcilia el entorno con el lockfile, y los modelos no estan en el
# lockfile --se instalan por URL--, asi que una corrida de esta tarea sobre un
# entorno que ya los tenia los desinstala. Lo que se ve despues son decenas de
# pruebas rojas con `ModelsMissingError`, que parecen codigo roto y no lo son.
# Se arregla con `mise run models:install`. Medido el 2026-09-30, al subir `pyjwt`.
run = [
  "uv sync --locked --project app/backend --all-groups",
  "pnpm --dir app/frontend install --frozen-lockfile",
]

[tasks."models:install"]
description = "Instala los dos modelos de spaCy que necesita la redaccion (U3)"
# Fijados por URL con su hash en el lockfile, como cualquier otra dependencia, y
# **nunca** con `spacy download`, que es la resolucion libre que la practica del
# equipo prohibe (INF-U3-1). `--locked` falla si la rueda cambia.
run = "uv sync --locked --project app/backend --extra models"

# --- Calidad ------------------------------------------------------------------

[tasks.fmt]
description = "Formatea los dos proyectos"
run = [
  "uv run --project app/backend ruff format app/backend",
  "pnpm --dir app/frontend exec prettier --write .",
]

[tasks."fmt:check"]
description = "Comprueba el formato sin escribir"
run = [
  "uv run --project app/backend ruff format --check app/backend",
  "pnpm --dir app/frontend exec prettier --check .",
]

[tasks.lint]
description = "Linters con sus reglas de seguridad activadas, y los contratos de importacion"
run = [
  "uv run --project app/backend ruff check app/backend",
  "uv run --project app/backend lint-imports --config app/backend/.importlinter --cache-dir tmp/import-linter",
  "pnpm --dir app/frontend exec eslint .",
]

[tasks.types]
description = "Comprobador de tipos de los dos proyectos"
run = [
  "uv run --project app/backend mypy --config-file app/backend/pyproject.toml",
  "pnpm --dir app/frontend exec tsc --noEmit",
]

# --- Pruebas ------------------------------------------------------------------

[tasks.test]
description = "Todas las pruebas de los dos proyectos"
# `-c` dice donde esta la configuracion **explicitamente**. Sin ella, pytest
# busca el archivo hacia arriba desde el directorio donde se invoca, no lo
# encuentra en la raiz del repositorio y corre con sus valores por defecto: el
# modo asincrono se apaga y toda prueba `async` falla con "no soportada". Es un
# fallo que solo aparece cuando la primera prueba asincrona existe, que fue U2.
run = [
  "uv run --project app/backend pytest -c app/backend/pyproject.toml app/backend/tests",
  "pnpm --dir app/frontend exec vitest run",
]

[tasks."test:u1"]
description = "Solo las pruebas de la unidad U1 (encadena los dos comandos acotados)"
run = [
  "uv run --project app/backend pytest app/backend/tests/unit/server app/backend/tests/unit/copy_catalog app/backend/tests/unit/evals app/backend/tests/integration/u1 -q",
  "pnpm --dir app/frontend exec vitest run src/shared/copy",
]

[tasks."test:u2"]
description = "Solo las pruebas de la unidad U2 (aislamiento, identidad y enlaces)"
# Levanta **una sola** base efimera para toda la corrida, con la imagen anclada
# por huella del entorno local y el rol del aplicativo. Con el superusuario, esta
# suite pasaria sin que exista aislamiento (BR1.7).
run = "uv run --project app/backend pytest app/backend/tests/unit/tenancy app/backend/tests/integration/u2 -q"

[tasks."test:u3"]
description = "Solo las pruebas de la unidad U3 (redaccion de datos personales)"
# Necesita los dos modelos instalados: lo que se prueba es que detecta el
# detector, y un doble no detecta nada. Si faltan, el cargador falla
# nombrandolos y nombrando `mise run models:install`, no con un ImportError de
# spaCy a mitad de la corrida.
#
# **No entra en el guion de verificacion**, igual que `test:u1` y `test:u2`: la
# compuerta ya corre estas mismas pruebas en su paso 5, con `mise run cov`.
# Meterlo tambien en el paso 6 las correria dos veces.
run = "uv run --project app/backend pytest -c app/backend/pyproject.toml app/backend/tests/unit/redaction app/backend/tests/integration/u3 -q"

[tasks."test:u6"]
description = "Solo las pruebas de la unidad U6 (servidor y componentes de la interfaz)"
# Dos comandos acotados, uno por proyecto, en las rutas que fija
# `unit-test-instructions.md`: la parte servida y la activacion en el servidor,
# y los componentes en la interfaz. Las de integracion levantan la base efimera
# de la suite, igual que U2, U4 y U5.
#
# No entra en el guion de verificacion, igual que `test:u1` a `test:u5`: el paso
# 5 ya corre la suite entera con `mise run cov`.
run = [
  "uv run --project app/backend pytest -c app/backend/pyproject.toml app/backend/tests/unit/web app/backend/tests/unit/activation app/backend/tests/integration/u6",
  "pnpm --dir app/frontend exec vitest run src/app src/pages src/shared/theme src/shared/i18n src/shared/api-client src/shared/ui",
]

[tasks."test:u17"]
description = "Solo las pruebas de la unidad U17 (los dos carriles, la retoma, los topes del proveedor y la consola publica; incluye PERF-U17.1)"
# La tanda 1 es toda sin base: la decision es pura y la consola se prueba con la
# disponibilidad declarada. La tanda 2 (los contadores y el cableado) suma aqui su
# carpeta de integracion, que si exige el motor de contenedores.
#
# No entra en el guion de verificacion: el paso 5 ya corre la suite entera.
run = [
  "uv run --project app/backend pytest -c app/backend/pyproject.toml app/backend/tests/unit/voice/test_admission.py app/backend/tests/unit/providers/test_config.py app/backend/tests/unit/telemetry/test_quota.py app/backend/tests/integration/u17 -q",
  "pnpm --dir app/frontend exec vitest run src/pages/voice",
]

[tasks."test:u22"]
description = "Solo las pruebas de la unidad U22 (las cinco cifras, el panel de gasto, el README generado y el resumen de la ultima corrida; incluye PERF-U22.1 y PERF-U22.2)"
# Las cinco cifras se prueban sin base (la linea base se siembra escribiendo su
# archivo); **el panel de gasto si la necesita**: `tests/integration/u22` levanta la
# base efimera, asi que este comando exige el motor de contenedores. El README
# generado (tanda 3) tampoco la necesita.
#
# No entra en el guion de verificacion, igual que `test:u1` a `test:u6`: el paso 5
# ya corre la suite entera con `mise run cov`.
run = [
  "uv run --project app/backend pytest -c app/backend/pyproject.toml app/backend/tests/unit/evals/evidence app/backend/tests/unit/workspace/test_readme_check.py app/backend/tests/unit/evals/gates/test_digest.py app/backend/tests/unit/evals/gates/test_baseline_cli.py app/backend/tests/unit/web/test_metrics_route.py app/backend/tests/unit/web/test_spend_routes.py app/backend/tests/integration/u22 -q",
  "pnpm --dir app/frontend exec vitest run src/pages/evidence src/pages/spend src/app/visitable-routes.test.ts",
]

[tasks."web:build"]
description = "Compila la interfaz a estaticos en app/frontend/dist (los sirve el proceso, CG-U6-5)"
run = "pnpm --dir app/frontend exec vite build"

[tasks."browsers:install"]
description = "Instala los tres navegadores del arnes de accesibilidad (una vez por maquina)"
# Tarea propia y **fuera** de `bootstrap` a proposito (NFR21.3): son cientos de
# megas, y el camino del clon al reporte no los necesita, igual que no necesita
# los modelos de lenguaje de U3. En la tuberia de Linux se le pasa `--with-deps`
# para que traiga tambien las bibliotecas del sistema.
run = "pnpm --dir app/frontend exec playwright install chromium firefox webkit"

[tasks.smoke]
description = "Prueba de humo de la bandeja contra el aplicativo que ya esta corriendo"
# Apunta a `UNTANGLE_SMOKE_URL` --por omision el `mise run dev` local-- y recorre la
# bandeja con los datos sembrados. Responde una pregunta que ninguna otra prueba
# responde: *lo que esta corriendo en esta maquina, ahora, con esta base, sirve?* Es la
# que encuentra la clave que falta, el puerto equivocado y la migracion sin subir.
#
# **De solo lectura por omision.** Decidir un caso lo cierra y no vuelve a derivado:
# con `UNTANGLE_SMOKE_DECIDE=1` tambien decide uno y comprueba que sale de la cola.
#
# No entra en el guion de verificacion: la compuerta no puede depender de que alguien
# tenga un servidor arriba.
run = "pnpm --dir app/frontend exec playwright test --config e2e/smoke.config.ts"

[tasks.a11y]
description = "Arnes de accesibilidad y escenarios de tiempo contra el proceso real (F9)"
# Tres pasos y en este orden. Primero la completitud del registro de pantallas
# (BR7.1): una ruta del enrutador sin registrar falla aqui, nombrandola, antes de
# gastar un minuto en navegadores. Despues compila: el arnes mide la interfaz que
# se sirve, no la de desarrollo. Y por ultimo el arnes, contra el proceso real
# sobre una base efimera propia (`scripts/servidor-del-arnes.py`), como la suite.
#
# Necesita los navegadores (`mise run browsers:install`) y el motor de
# contenedores, igual que `mise run test`.
#
# **Un motor en local, tres en la tuberia** (decision de Miguel, 2026-09-29). En
# local corre Chromium, que ejecuta **todas** las pruebas: 79 en 39 s. En la tuberia
# se suman Firefox y WebKit con las de dibujo, que es lo que comprueba que cada
# pantalla se ve igual fuera de Chromium: 109. Lo que se pierde en local se sigue
# comprobando en cada entrega, que es donde bloquea; lo que se gana es que el arnes
# deje de ser varios minutos de tres navegadores reales en un portatil.
run = [
  "pnpm --dir app/frontend exec vitest run src/app/visitable-routes.test.ts",
  "mise run web:build",
  "pnpm --dir app/frontend exec playwright test --config e2e/playwright.config.ts",
]

[tasks.cov]
description = "Cobertura agregada de los dos proyectos contra el piso del 80 %"
# Un solo numero ponderado por lineas, no un promedio de porcentajes: un proyecto
# de 200 lineas no puede pesar lo mismo que uno de 20.000 (NFR18.1).
#
# `--cov-config` dice donde esta la configuracion de cobertura **explicitamente**.
# Sin ella, la herramienta la busca en el directorio desde el que se invoca, no
# la encuentra en la raiz del repositorio y mide con sus valores por defecto: el
# alcance declarado y la lista de exclusion se ignoran, los archivos de prueba
# entran en el calculo --y estan cubiertos al 100 % por definicion-- y el
# porcentaje sale inflado. Un piso medido asi no es un piso.
run = [
  "uv run --project app/backend pytest -c app/backend/pyproject.toml app/backend/tests --cov --cov-config=app/backend/pyproject.toml --cov-report=xml:app/backend/coverage/coverage.xml --cov-report=term-missing",
  "pnpm --dir app/frontend exec vitest run --coverage",
  "uv run --project app/backend python -m untangle.workspace.coverage_gate",
]

# --- Evaluaciones -------------------------------------------------------------

[tasks."evals:run"]
description = "Corre las evaluaciones y escribe el reporte (el comando unico de BR1.1)"
run = "uv run --project app/backend python -m untangle.evals.cli"

[tasks."evals:entender"]
description = "Evalua la comprension de un mensaje contra Claude Haiku (a mano y por hito, ~0,02 USD)"
# Fase 0 de docs/propuesta-2026-10/03-propuesta-y-diseno.md (2026-10-07). Usa la
# clave UNTANGLE_ANTHROPIC_API_KEY_EVALS, separada de la del chat, y pasa por el
# techo y el registro de gasto. **No corre en GitHub Actions**: llama a un modelo
# de pago. **Sobre el libro de gasto de la base del proyecto** (2026-10-13), como
# todo lo que llama a un proveedor: hasta entonces corria sobre una base desechable
# y sus 33 corridas del 7 al 13 de octubre gastaron unos 0,24 USD que no quedaron en
# ningun libro ni contaron contra el techo. Necesita la base levantada
# (`mise run services:up`); sin ella no llama a nadie y dice que falta. La parada
# real, ademas del techo, es el saldo prepagado de Anthropic, sin recarga.
run = "uv run --env-file .env --project app/backend python -m untangle.server.understanding_cli --subset entender"

[tasks."evals:citas"]
description = "Evalua las citas de DS-3 contra Claude Haiku y el corpus (a mano y por hito, centavos)"
# Fase 1 de docs/propuesta-2026-10/03-propuesta-y-diseno.md (2026-10-08): recupera,
# propone las citas con Claude y las verifica, igual que el chat. **Sobre la base del
# proyecto**, que es la que tiene el corpus cargado (`mise run corpus:ingest`); una
# efimera esta vacia. Necesita las claves de embeddings (`corpus`) y de Claude para
# evaluaciones. No corre en GitHub Actions.
run = "uv run --env-file .env --project app/backend python -m untangle.server.understanding_cli --subset citas"

[tasks."evals:conversaciones"]
description = "Solo las conversaciones del chat contra Claude, leyendo lo que la agente dijo (a mano, centavos)"
# Arma la aplicacion igual que `evals:completa` y corre los casos con `channel: chat`
# de `app/evals/subsets/conversaciones.yaml`. Para ver una conversacion real tras
# cambiar un prompt o una regla del chat sin pagar la corrida completa. No escribe
# `app/evals/last-run.json`. No corre en GitHub Actions: llama a un modelo de pago.
run = "uv run --env-file .env --project app/backend python -m untangle.server.understanding_cli --subset conversaciones"

[tasks."evals:completa"]
description = "La corrida completa contra Claude y el corpus; deja su resumen versionado (centavos, a mano y por hito)"
# La unica corrida que arma la aplicacion con el modelo: comprension, citas y las
# conversaciones del chat de punta a punta. Escribe el reporte en `tmp/` y **el
# resumen en `app/evals/last-run.json`**, en verde o en rojo, que es lo que lee el
# tablero "Que tan bien funciona" (2026-10-11). Sobre la base del proyecto, que es
# la que tiene el corpus. No corre en GitHub Actions: llama a un modelo de pago, y
# el gasto lo decide Miguel.
run = "uv run --env-file .env --project app/backend python -m untangle.server.understanding_cli --subset completa"

[tasks."evals:gate"]
description = "Corre, compara contra la linea base y decide si la entrega pasa (U21, BR5.1)"
# El comando que cierra la compuerta: corre las evaluaciones, compara contra
# `app/evals/baselines/current.json`, aplica los inestables y las
# explicaciones de regresion, y devuelve codigo distinto de cero en rojo. Sin
# linea base vigente, corre y publica sin comparar (FD-U21-5).
run = "uv run --project app/backend python -m untangle.evals.gates.gate_cli"

[tasks."evals:baseline"]
description = "Publica la corrida completa como linea base vigente (U21, BR2.1)"
# Se niega a publicar si la corrida no esta en verde o no es comparable,
# nombrando el caso (BR2.1). Siempre corre la corrida completa: no acepta
# `--subset`.
#
# **Sin el modelo no mide las conversaciones del chat, y con ellas su latencia**: esta tarea no
# arma la aplicacion. Para que la linea base las traiga, se corre `mise run evals:completa` (que
# gasta centavos y deja su reporte en `tmp/evals/reports/`) y despues se publica ese reporte sin
# volver a gastar: `mise run evals:baseline -- --report tmp/evals/reports/<corrida>.json`.
run = "uv run --project app/backend python -m untangle.evals.gates.baseline_cli"

[tasks."evals:label"]
description = "Etiquetado humano de DS-7: muestra un turno con su criterio (U21, FD-U21-3)"
# Se puede dejar a medias: guarda cada etiqueta apenas se confirma. Necesita
# que Miguel haya llenado la cola en `app/evals/labels/queue.yaml`; con la
# cola vacia, no hace nada.
run = "uv run --project app/backend python -m untangle.evals.gates.label_cli"

[tasks."evals:label:queue"]
description = "Arma la cola de etiquetado de DS-7 con las transcripciones de una corrida ya hecha (sin gasto)"
# Lee `tmp/evals/transcripts/` --lo deja `mise run evals:conversaciones` o `evals:completa`,
# ya redactado-- y escribe `app/evals/labels/queue.yaml`, que lee `evals:label`. No llama
# a ningun modelo. Se puede correr otra vez: nunca toca lo etiquetado, solo agrega lo que
# falta para llegar a 20 por idioma. Opciones: --run <id>, --per-language <n>, --dry-run.
run = "uv run --project app/backend python -m untangle.evals.gates.label_queue_cli"

[tasks."evals:calibrate"]
description = "TPR y TNR del juez contra DS-7, con el limite de Wilson (U21, BR3.1)"
# Nunca llama al juez de verdad: lee las etiquetas humanas y los veredictos ya
# grabados para el modelo y la rubrica exactos que se le pasan. La corrida
# real que produce esos veredictos necesita la clave del proveedor y vive en
# la sesion local (CG-U21-4): mise run evals:calibrate --
# --judge-model <id> --rubric-version <version>
run = "uv run --project app/backend python -m untangle.evals.gates.calibrate_cli"

# --- Contratos generados ------------------------------------------------------

[tasks."contracts:gen"]
description = "Genera los JSON Schema, el esquema OpenAPI, el cliente de TypeScript y el modulo tipado de claves"
# Tres comandos y en este orden (C-28): los JSON Schema y el modulo de claves;
# el esquema OpenAPI, que sale de construir la aplicacion y por eso vive en
# `server/` y no junto a los demas (el contrato de capas no deja a `workspace`
# importar la raiz de composicion); y el cliente de TypeScript, que se genera
# **desde** ese esquema con el generador en version exacta.
run = [
  "uv run --project app/backend python -m untangle.workspace.generate_contracts",
  "uv run --project app/backend python -m untangle.server.openapi_export",
  "pnpm --dir app/frontend exec openapi-ts",
]

[tasks."contracts:check"]
description = "Falla si un contrato generado quedo sin regenerar (deriva, C-28)"
# Dos preguntas y no una. `git diff` ve un archivo generado que cambio, pero no
# uno **nuevo**: si una regeneracion produce un archivo que el commit no trae,
# queda sin seguimiento y el diff sigue vacio. La segunda linea pregunta por
# eso, en las mismas rutas.
run = [
  "mise run contracts:gen",
  "git diff --exit-code -- app/contracts app/frontend/src/shared/copy app/frontend/src/shared/api",
  "test -z \"$(git status --porcelain --untracked-files=all -- app/contracts app/frontend/src/shared/copy app/frontend/src/shared/api)\"",
]

# --- Chequeos de contenido ----------------------------------------------------

[tasks."copy:check"]
description = "Los seis chequeos del catalogo de textos (BR3.1 a BR3.6)"
run = "uv run --project app/backend python -m untangle.copy_catalog.checks"

[tasks."content:check"]
description = "Frases prohibidas y texto de clausula ajena sobre lo que se publica"
run = "uv run --project app/backend python -m untangle.evals.content_checks"

[tasks."schema:check"]
description = "Valida los archivos versionados contra sus JSON Schema"
run = "uv run --project app/backend python -m untangle.workspace.schema_check"

[tasks."env:check"]
description = "Compara .env.example contra las variables que el codigo lee, en las dos direcciones"
run = "uv run --project app/backend python -m untangle.workspace.env_check"

[tasks."rls:check"]
description = "Pregunta al catalogo vivo que tablas hay y al rol vivo que puede hacer"
# Le pregunta al motor, no a un archivo. Una lista de tablas escrita a mano solo
# cubre las que alguien se acordo de anadir, y la que nadie anadio pasa la
# compuerta en verde sin estar aislada (SEC-U2.1, SEC-U2.4).
run = "uv run --project app/backend python -m untangle.tenancy.cli rls-check"

[tasks."migrate:check"]
description = "Sube, baja y vuelve a subir las migraciones contra una base efimera propia"
# La suya propia y no la de la suite: necesita una base virgen para que el
# `downgrade` tenga algo que demostrar. Falla ante dos cabezas y ante una
# revision que cree una tabla sin su aislamiento (SEC-U2.12, BR1.11).
run = "uv run --project app/backend python -m untangle.tenancy.cli migrate-check"

[tasks."tenancy:credential"]
description = "Emite una credencial de bandeja a la salida estandar: mise run tenancy:credential -- --tenant <id> --principal <id>"
# A la salida estandar y **nunca** a un archivo del repositorio: una credencial
# en un archivo es una credencial publicada, y de ahi no se vuelve borrandola
# (BR2.6, D23). Es para Miguel, el despliegue local y las pruebas; los visitantes
# entran con el enlace firmado de su propio caso.
#
# **Con `--env-file .env`**, como sus tareas hermanas. Sin el, la clave de firma que
# vive en `.env` no llega al proceso y el comando falla pidiendo una variable que ya
# estaba puesta --el fallo mas confuso que hay, porque manda a mirar donde no es--. Lo
# encontro Miguel el 2026-09-29 al emitir su primera credencial.
run = "uv run --env-file .env --project app/backend python -m untangle.tenancy.cli issue-credential"

[tasks."tenancy:case-link"]
description = "Emite el enlace de un caso a la salida estandar: mise run tenancy:case-link -- --tenant <id> --case <id>"
# A la salida estandar y **nunca** a un archivo, por la misma razon que la
# credencial: el token se emite una sola vez y de la fila queda solo su resumen.
# Imprime la direccion entera con el token en el **fragmento**, que el navegador
# nunca manda al servidor (C-07, BR5.6).
#
